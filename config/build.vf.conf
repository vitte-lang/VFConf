# VFConf — Vitte Foundation Configuration Language
# config/build.vf.conf
#
# Canonical build configuration for the VFConf reference implementation.

[build]
enabled = true
system = "dune"
profile = "dev"
root = "."
source_directory = "lib"
binary_directory = "bin"
build_directory = "_build"
parallel = true
jobs = 0
incremental = true

[build.project]
name = "vfconf"
version = "0.1.0"
language = "ocaml"
minimum_ocaml = "5.1"
minimum_dune = "3.17"

[build.targets]
default = "@install"
library = "vfconf"
executables = [
  "vfconf",
  "vfconf-check",
  "vfconf-dump",
  "vfconf-fmt"
]

[build.commands]
build = ["dune", "build"]
check = ["dune", "build", "@check"]
test = ["dune", "runtest"]
clean = ["dune", "clean"]
install = ["dune", "install"]
uninstall = ["dune", "uninstall"]
format = ["dune", "build", "@fmt"]
format_apply = ["dune", "build", "@fmt", "--auto-promote"]

[build.profiles.dev]
enabled = true
warnings = true
warnings_as_errors = false
debug = true
optimization = 0

[build.profiles.release]
enabled = true
warnings = true
warnings_as_errors = true
debug = false
optimization = 3

[build.ocaml]
native = true
bytecode = true
opaque = false
safe_string = true

[build.ocamllex]
enabled = true
sources = [
  "lib/lexer/lexer.mll"
]

[build.menhir]
enabled = true
sources = [
  "lib/parser/parser.mly"
]
infer = true
explain = true
strict = true

[build.library]
name = "vfconf"
public_name = "vfconf"
wrapped = true
include_subdirectories = "unqualified"

[build.library.dependencies]
packages = [
  "unix"
]

[build.executables]
directory = "bin"

[build.executables.vfconf]
source = "main.ml"
public_name = "vfconf"

[build.executables.check]
source = "check.ml"
public_name = "vfconf-check"

[build.executables.dump]
source = "dump.ml"
public_name = "vfconf-dump"

[build.executables.format]
source = "fmt.ml"
public_name = "vfconf-fmt"

[build.tests]
enabled = true
directory = "tests"
command = ["dune", "runtest"]
fail_fast = false

[build.fuzz]
enabled = false
directory = "fuzz"

[build.documentation]
enabled = true
directory = "docs"
command = ["dune", "build", "@doc"]

[build.install]
enabled = true
library = true
executables = true
schemas = true
themes = true
languages = true
configuration = true

[build.install.paths]
schemas = "share/vfconf/schemas"
themes = "share/vfconf/themes"
languages = "share/vfconf/languages"
config = "share/vfconf/config"
grammar = "share/vfconf/grammar"

[build.environment]
OCAMLRUNPARAM = "b"
DUNE_CACHE = "enabled"

[build.validation]
check_parser_conflicts = true
check_unused_rules = true
check_warnings = true
check_schemas = true
check_examples = true
check_language_definitions = true
check_themes = true

[build.artifacts]
ignore = [
  "_build",
  "*.cmi",
  "*.cmo",
  "*.cmx",
  "*.cma",
  "*.cmxa",
  "*.cmxs",
  "*.o",
  "*.a",
  "*.annot",
  "*.cmt",
  "*.cmti"
]

[build.packaging]
enabled = true
opam = "vfconf.opam"
package = "vfconf"
version = "0.1.0"

[build.compatibility]
architectures = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "sparc",
  "sparc64"
]

operating_systems = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd"
]