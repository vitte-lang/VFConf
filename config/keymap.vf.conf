# VFConf — Vitte Foundation Configuration Language
# config/keymap.vf.conf
#
# Canonical VFConf editor keymap.

[keymap]
version = "1.0"
enabled = true
platform = "auto"
timeout = 1s
case_sensitive = false
allow_chords = true
allow_sequences = true
detect_conflicts = true

[keymap.modifiers]
control = "ctrl"
alt = "alt"
shift = "shift"
meta = "meta"
command = "cmd"
super = "super"

[keymap.keys]
separator = "+"
sequence_separator = " "
normalize_case = true
normalize_modifiers = true
reject_unknown_keys = true
reject_duplicate_modifiers = true

[keymap.conflicts]
policy = "error"
allow_context_overlap = true
allow_platform_overlap = true
report_shadowed = true

# ------------------------------------------------------------
# File operations
# ------------------------------------------------------------

[keymap.file.new]
key = "ctrl+n"
command = "editor.new"
description = "Create a new file"

[keymap.file.open]
key = "ctrl+o"
command = "editor.open"
description = "Open a file"

[keymap.file.save]
key = "ctrl+s"
command = "editor.save"
description = "Save the current file"

[keymap.file.save_all]
key = "ctrl+shift+s"
command = "editor.save_all"
description = "Save all files"

[keymap.file.close]
key = "ctrl+w"
command = "editor.close"
description = "Close the current file"

# ------------------------------------------------------------
# Editing
# ------------------------------------------------------------

[keymap.edit.undo]
key = "ctrl+z"
command = "editor.undo"

[keymap.edit.redo]
key = "ctrl+shift+z"
command = "editor.redo"

[keymap.edit.cut]
key = "ctrl+x"
command = "editor.cut"

[keymap.edit.copy]
key = "ctrl+c"
command = "editor.copy"

[keymap.edit.paste]
key = "ctrl+v"
command = "editor.paste"

[keymap.edit.select_all]
key = "ctrl+a"
command = "editor.select_all"

[keymap.edit.delete_line]
key = "ctrl+shift+k"
command = "editor.delete_line"

[keymap.edit.duplicate_line]
key = "ctrl+shift+d"
command = "editor.duplicate_line"

[keymap.edit.move_line_up]
key = "alt+up"
command = "editor.move_line_up"

[keymap.edit.move_line_down]
key = "alt+down"
command = "editor.move_line_down"

[keymap.edit.comment]
key = "ctrl+/"
command = "editor.toggle_comment"

# ------------------------------------------------------------
# Search
# ------------------------------------------------------------

[keymap.search.find]
key = "ctrl+f"
command = "editor.find"

[keymap.search.replace]
key = "ctrl+h"
command = "editor.replace"

[keymap.search.find_next]
key = "f3"
command = "editor.find_next"

[keymap.search.find_previous]
key = "shift+f3"
command = "editor.find_previous"

[keymap.search.workspace]
key = "ctrl+shift+f"
command = "editor.find_workspace"

# ------------------------------------------------------------
# Navigation
# ------------------------------------------------------------

[keymap.navigation.up]
key = "up"
command = "navigation.up"

[keymap.navigation.down]
key = "down"
command = "navigation.down"

[keymap.navigation.left]
key = "left"
command = "navigation.left"

[keymap.navigation.right]
key = "right"
command = "navigation.right"

[keymap.navigation.page_up]
key = "pageup"
command = "navigation.page_up"

[keymap.navigation.page_down]
key = "pagedown"
command = "navigation.page_down"

[keymap.navigation.line_start]
key = "home"
command = "navigation.line_start"

[keymap.navigation.line_end]
key = "end"
command = "navigation.line_end"

[keymap.navigation.file_start]
key = "ctrl+home"
command = "navigation.file_start"

[keymap.navigation.file_end]
key = "ctrl+end"
command = "navigation.file_end"

[keymap.navigation.back]
key = "alt+left"
command = "navigation.back"

[keymap.navigation.forward]
key = "alt+right"
command = "navigation.forward"

# ------------------------------------------------------------
# Symbols
# ------------------------------------------------------------

[keymap.symbol.definition]
key = "f12"
command = "editor.goto_definition"

[keymap.symbol.references]
key = "shift+f12"
command = "editor.goto_reference"

[keymap.symbol.rename]
key = "f2"
command = "editor.rename"

[keymap.symbol.workspace]
key = "ctrl+t"
command = "editor.goto_symbol"

[keymap.symbol.file]
key = "ctrl+shift+o"
command = "editor.goto_file_symbol"

# ------------------------------------------------------------
# Formatting
# ------------------------------------------------------------

[keymap.format.document]
key = "ctrl+shift+i"
command = "editor.format"

[keymap.format.selection]
key = "ctrl+k ctrl+f"
command = "editor.format_selection"

# ------------------------------------------------------------
# Completion
# ------------------------------------------------------------

[keymap.completion.trigger]
key = "ctrl+space"
command = "editor.completion"

[keymap.completion.parameter]
key = "ctrl+shift+space"
command = "editor.parameter_hint"

# ------------------------------------------------------------
# Diagnostics
# ------------------------------------------------------------

[keymap.diagnostics.next]
key = "f8"
command = "diagnostics.next"

[keymap.diagnostics.previous]
key = "shift+f8"
command = "diagnostics.previous"

[keymap.diagnostics.show]
key = "ctrl+shift+m"
command = "diagnostics.show"

[keymap.diagnostics.quick_fix]
key = "ctrl+."
command = "diagnostics.quick_fix"

# ------------------------------------------------------------
# VFConf
# ------------------------------------------------------------

[keymap.vfconf.check]
key = "ctrl+k ctrl+c"
command = "vfconf.check"
description = "Validate the current VFConf document"

[keymap.vfconf.format]
key = "ctrl+k ctrl+f"
command = "vfconf.format"
description = "Format the current VFConf document"

[keymap.vfconf.dump]
key = "ctrl+k ctrl+d"
command = "vfconf.dump"
description = "Dump the parsed VFConf document"

[keymap.vfconf.reload]
key = "ctrl+k ctrl+r"
command = "vfconf.reload"
description = "Reload VFConf configuration"

[keymap.vfconf.definition]
key = "ctrl+k ctrl+g"
command = "vfconf.goto_definition"

# ------------------------------------------------------------
# Build
# ------------------------------------------------------------

[keymap.build.build]
key = "ctrl+shift+b"
command = "build.build"

[keymap.build.check]
key = "ctrl+k ctrl+b"
command = "build.check"

[keymap.build.run]
key = "ctrl+f5"
command = "build.run"

[keymap.build.test]
key = "ctrl+k ctrl+t"
command = "build.test"

[keymap.build.clean]
key = "ctrl+k ctrl+x"
command = "build.clean"

# ------------------------------------------------------------
# Debugger
# ------------------------------------------------------------

[keymap.debug.start]
key = "f5"
command = "debug.start"

[keymap.debug.stop]
key = "shift+f5"
command = "debug.stop"

[keymap.debug.continue]
key = "f5"
command = "debug.continue"
when = "debug.active"

[keymap.debug.pause]
key = "f6"
command = "debug.pause"
when = "debug.active"

[keymap.debug.step_over]
key = "f10"
command = "debug.step_over"

[keymap.debug.step_into]
key = "f11"
command = "debug.step_into"

[keymap.debug.step_out]
key = "shift+f11"
command = "debug.step_out"

[keymap.debug.breakpoint]
key = "f9"
command = "debug.toggle_breakpoint"

# ------------------------------------------------------------
# Terminal
# ------------------------------------------------------------

[keymap.terminal.new]
key = "ctrl+shift+`"
command = "terminal.new"

[keymap.terminal.close]
key = "ctrl+shift+w"
command = "terminal.close"
when = "terminal.focused"

[keymap.terminal.clear]
key = "ctrl+l"
command = "terminal.clear"
when = "terminal.focused"

[keymap.terminal.copy]
key = "ctrl+shift+c"
command = "terminal.copy"
when = "terminal.focused"

[keymap.terminal.paste]
key = "ctrl+shift+v"
command = "terminal.paste"
when = "terminal.focused"

[keymap.terminal.interrupt]
key = "ctrl+c"
command = "terminal.interrupt"
when = "terminal.focused"

# ------------------------------------------------------------
# Panels
# ------------------------------------------------------------

[keymap.panel.explorer]
key = "ctrl+shift+e"
command = "panel.explorer"

[keymap.panel.search]
key = "ctrl+shift+f"
command = "panel.search"

[keymap.panel.diagnostics]
key = "ctrl+shift+m"
command = "panel.diagnostics"

[keymap.panel.terminal]
key = "ctrl+`"
command = "panel.terminal"

[keymap.panel.toggle]
key = "ctrl+j"
command = "panel.toggle"

# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

[keymap.tabs.next]
key = "ctrl+tab"
command = "editor.next_tab"

[keymap.tabs.previous]
key = "ctrl+shift+tab"
command = "editor.previous_tab"

[keymap.tabs.first]
key = "ctrl+1"
command = "editor.tab"
args = { index: 1 }

[keymap.tabs.second]
key = "ctrl+2"
command = "editor.tab"
args = { index: 2 }

[keymap.tabs.third]
key = "ctrl+3"
command = "editor.tab"
args = { index: 3 }

# ------------------------------------------------------------
# macOS overrides
# ------------------------------------------------------------

[keymap.macos.save]
key = "cmd+s"
command = "editor.save"
platform = "macos"
priority = 100

[keymap.macos.open]
key = "cmd+o"
command = "editor.open"
platform = "macos"
priority = 100

[keymap.macos.new]
key = "cmd+n"
command = "editor.new"
platform = "macos"
priority = 100

[keymap.macos.close]
key = "cmd+w"
command = "editor.close"
platform = "macos"
priority = 100

[keymap.macos.undo]
key = "cmd+z"
command = "editor.undo"
platform = "macos"
priority = 100

[keymap.macos.redo]
key = "cmd+shift+z"
command = "editor.redo"
platform = "macos"
priority = 100

[keymap.macos.cut]
key = "cmd+x"
command = "editor.cut"
platform = "macos"
priority = 100

[keymap.macos.copy]
key = "cmd+c"
command = "editor.copy"
platform = "macos"
priority = 100

[keymap.macos.paste]
key = "cmd+v"
command = "editor.paste"
platform = "macos"
priority = 100

[keymap.macos.select_all]
key = "cmd+a"
command = "editor.select_all"
platform = "macos"
priority = 100

[keymap.macos.find]
key = "cmd+f"
command = "editor.find"
platform = "macos"
priority = 100

[keymap.macos.format]
key = "cmd+shift+i"
command = "editor.format"
platform = "macos"
priority = 100

# ------------------------------------------------------------
# Reserved keys
# ------------------------------------------------------------

[keymap.reserved]
enabled = true
keys = [
  "ctrl+c",
  "ctrl+z"
]
commands = [
  "terminal.interrupt"
]