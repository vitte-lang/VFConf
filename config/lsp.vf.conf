# VFConf — Vitte Foundation Configuration Language
# config/lsp.vf.conf
#
# Canonical Language Server Protocol configuration for VFConf.

[lsp]
enabled = true
language_id = "vfconf"
name = "VFConf Language Server"
version = "0.1.0"
transport = "stdio"
command = "vfconf-lsp"
args = []
start_automatically = true
restart_on_failure = true
maximum_restarts = 5
startup_timeout = 10s
request_timeout = 30s
shutdown_timeout = 5s

[lsp.files]
extension = ".vf.conf"
mime = "text/x-vfconf"
include = [
  "**/*.vf.conf"
]
exclude = [
  "_build/**",
  ".git/**",
  "_opam/**"
]

[lsp.workspace]
enabled = true
root_markers = [
  "dune-project",
  "vfconf.opam",
  ".git"
]
workspace_folders = true
configuration = true
watch_files = true
reload_configuration = true

[lsp.synchronization]
open_close = true
change = "incremental"
save = true
include_text_on_save = false
will_save = false
will_save_wait_until = false

[lsp.position]
encoding = "utf-16"
preserve_source_spans = true

[lsp.diagnostics]
enabled = true
live = true
delay = 250ms
related_information = true
tags = true
versioned = true
maximum = 1000
configuration = "config/diagnostics.vf.conf"

[lsp.diagnostics.severity]
error = true
warning = true
information = true
hint = true

[lsp.completion]
enabled = true
resolve = true
snippets = true
insert_replace = true
label_details = true
sections = true
keys = true
values = true
references = true
keywords = true
schemas = true

[lsp.completion.trigger]
characters = [
  ".",
  "$",
  "[",
  "=",
  ":"
]

[lsp.hover]
enabled = true
values = true
types = true
references = true
schemas = true
documentation = true

[lsp.signature_help]
enabled = true
trigger_characters = [
  "(",
  ","
]

[lsp.definition]
enabled = true
references = true
definitions = true
includes = true
schema_fields = true

[lsp.references]
enabled = true
include_declaration = true
maximum = 10000

[lsp.declaration]
enabled = true

[lsp.type_definition]
enabled = true

[lsp.implementation]
enabled = false

[lsp.document_symbols]
enabled = true
sections = true
assignments = true
definitions = true
includes = true
conditionals = true
hierarchical = true

[lsp.workspace_symbols]
enabled = true
maximum = 10000

[lsp.rename]
enabled = true
prepare = true
definitions = true
references = true
configuration_keys = true

[lsp.formatting]
enabled = true
document = true
range = true
on_type = false
configuration = "config/formatter.vf.conf"

[lsp.folding]
enabled = true
sections = true
blocks = true
arrays = true
objects = true
comments = true
line_only = false

[lsp.selection_range]
enabled = true

[lsp.document_highlight]
enabled = true
references = true
definitions = true
keys = true

[lsp.document_links]
enabled = true
includes = true
paths = true

[lsp.code_actions]
enabled = true
quick_fix = true
source_fix_all = true
source_format = true
resolve = true

[lsp.code_lens]
enabled = true
references = true
includes = true
schema = true

[lsp.semantic_tokens]
enabled = true
full = true
delta = true
range = true

[lsp.semantic_tokens.types]
values = [
  "namespace",
  "type",
  "class",
  "enum",
  "interface",
  "struct",
  "typeParameter",
  "parameter",
  "variable",
  "property",
  "enumMember",
  "event",
  "function",
  "method",
  "macro",
  "keyword",
  "modifier",
  "comment",
  "string",
  "number",
  "regexp",
  "operator"
]

[lsp.semantic_tokens.modifiers]
values = [
  "declaration",
  "definition",
  "readonly",
  "static",
  "deprecated",
  "abstract",
  "async",
  "modification",
  "documentation",
  "defaultLibrary"
]

[lsp.inlay_hints]
enabled = true
types = true
references = true
defaults = true

[lsp.inline_values]
enabled = false

[lsp.call_hierarchy]
enabled = false

[lsp.type_hierarchy]
enabled = true

[lsp.workspace_edit]
enabled = true
document_changes = true
resource_operations = [
  "create",
  "rename",
  "delete"
]

[lsp.file_operations]
enabled = true
will_create = false
did_create = true
will_rename = true
did_rename = true
will_delete = true
did_delete = true

[lsp.schema]
enabled = true
directory = "schemas"
automatic_detection = true
validate_on_open = true
validate_on_change = true
validate_on_save = true

[lsp.schema.files]
syntax = "schemas/syntax.schema.vf.conf"
theme = "schemas/theme.schema.vf.conf"
editor = "schemas/editor.schema.vf.conf"
language = "schemas/language.schema.vf.conf"
keymap = "schemas/keymap.schema.vf.conf"

[lsp.references_resolution]
enabled = true
maximum_depth = 128
detect_cycles = true
definitions = true
configuration = true

[lsp.includes]
enabled = true
maximum_depth = 64
detect_cycles = true
follow_relative = true
allow_absolute = true
allow_outside_workspace = false

[lsp.index]
enabled = true
workspace = true
includes = true
definitions = true
references = true
schemas = true
incremental = true
maximum_files = 100000

[lsp.cache]
enabled = true
directory = ".cache/vfconf/lsp"
maximum_size = 256MiB
persist = true

[lsp.performance]
incremental_parsing = true
incremental_analysis = true
parallel_analysis = true
maximum_file_size = 64MiB
large_file_threshold = 8MiB

[lsp.large_files]
diagnostics = true
completion = false
semantic_tokens = false
references = false
formatting = true

[lsp.logging]
enabled = false
level = "information"
file = ""
protocol = false
requests = false
responses = false
notifications = false

[lsp.telemetry]
enabled = false

[lsp.experimental]
enabled = false
syntax_tree = false
ast_dump = false
schema_inspection = false
configuration_graph = false

[lsp.security]
allow_execute_commands = false
allow_external_includes = false
follow_symlinks = true
trusted_workspace_required = true

[lsp.server]
canonical_diagnostics = true
diagnostic_language = "en"
preserve_spans = true
stable_diagnostic_codes = true
duplicate_diagnostic_catalog = false