# VFConf — Vitte Foundation Configuration Language
# config/runtime.vf.conf
#
# Canonical runtime configuration for the VFConf reference implementation.

[runtime]
enabled = true
version = "0.1.0"
mode = "normal"
strict = true
fail_fast = true
deterministic = true

[runtime.input]
encoding = "utf-8"
maximum_file_size = 64MiB
allow_empty = true
require_vfconf_extension = false

[runtime.parsing]
enabled = true
preserve_source_spans = true
preserve_filenames = true
maximum_nesting_depth = 256
maximum_statements = 1000000
maximum_array_items = 1000000
maximum_object_entries = 1000000

[runtime.semantic]
enabled = true
analyze = true
validate_assignments = true
validate_references = true
detect_duplicate_keys = true
detect_duplicate_definitions = true

[runtime.evaluation]
enabled = true
resolve_references = true
evaluate_conditions = true
apply_assignments = true
maximum_reference_depth = 128
detect_reference_cycles = true

[runtime.definitions]
enabled = true
allow_forward_references = true
allow_redefinition = false

[runtime.references]
enabled = true
configuration = true
definitions = true
maximum_depth = 128
detect_cycles = true
undefined = "error"

[runtime.includes]
enabled = true
maximum_depth = 64
detect_cycles = true
relative = true
absolute = true
outside_root = false
follow_symlinks = true
missing = "error"

[runtime.includes.paths]
root = "."
search = [
  ".",
  "config",
  "languages",
  "themes",
  "schemas"
]

[runtime.assignments]
assign = true
define_assign = true
add_assign = true
sub_assign = true
require_existing_for_add = true
require_existing_for_sub = true

[runtime.conditionals]
enabled = true
undefined_reference = "error"
strict_boolean = false

[runtime.values]
strings = true
integers = true
floats = true
booleans = true
null = true
arrays = true
objects = true
references = true
colors = true
durations = true
sizes = true

[runtime.values.integer]
overflow = "error"

[runtime.values.float]
allow_nan = false
allow_infinity = false

[runtime.values.array]
maximum_items = 1000000

[runtime.values.object]
maximum_entries = 1000000
duplicate_keys = "error"

[runtime.values.color]
validate_components = true
red_minimum = 0
red_maximum = 255
green_minimum = 0
green_maximum = 255
blue_minimum = 0
blue_maximum = 255
alpha_minimum = 0.0
alpha_maximum = 1.0

[runtime.values.duration]
minimum = 0ns
units = [
  "ns",
  "us",
  "ms",
  "s",
  "min",
  "h"
]

[runtime.values.size]
minimum = 0B
units = [
  "B",
  "KB",
  "MB",
  "GB",
  "KiB",
  "MiB",
  "GiB"
]

[runtime.schema]
enabled = true
validate = true
apply_defaults = true
allow_unknown_sections = false
allow_unknown_fields = false
directory = "schemas"

[runtime.schema.files]
syntax = "schemas/syntax.schema.vf.conf"
theme = "schemas/theme.schema.vf.conf"
editor = "schemas/editor.schema.vf.conf"
language = "schemas/language.schema.vf.conf"
keymap = "schemas/keymap.schema.vf.conf"

[runtime.diagnostics]
enabled = true
configuration = "config/diagnostics.vf.conf"
canonical = true
language = "en"
preserve_spans = true
maximum_errors = 100
warnings_as_errors = false

[runtime.errors]
lexical = "error"
syntax = "error"
semantic = "error"
include = "error"
schema = "error"
evaluation = "error"
io = "error"
internal = "abort"

[runtime.environment]
enabled = true
inherit_process_environment = false
allow_environment_references = false

[runtime.paths]
normalize = true
canonicalize = false
case_sensitive = true
separator = "native"

[runtime.filesystem]
enabled = true
read = true
write = false
follow_symlinks = true

[runtime.security]
allow_external_includes = false
allow_environment_access = false
allow_process_execution = false
allow_network = false
allow_dynamic_code = false
allow_native_plugins = false

[runtime.cache]
enabled = true
parsed_documents = true
resolved_references = true
schemas = true
maximum_entries = 4096
maximum_size = 128MiB

[runtime.performance]
parallel = false
worker_count = 1
incremental = true
lazy_resolution = true
maximum_memory = 512MiB

[runtime.compatibility]
language_version = "1.0"
accept_deprecated_boolean_aliases = true
accept_on_off = true
accept_none = true
strict_unknown_syntax = true

[runtime.debug]
enabled = false
trace_lexer = false
trace_parser = false
trace_semantic = false
trace_resolver = false
trace_evaluator = false
trace_schema = false
dump_tokens = false
dump_ast = false
dump_environment = false
dump_config = false

[runtime.logging]
enabled = false
level = "warning"
destination = "stderr"
timestamps = false

[runtime.output]
encoding = "utf-8"
flush = true

[runtime.limits]
include_depth = 64
reference_depth = 128
nesting_depth = 256
diagnostics = 1000
file_size = 64MiB
memory = 512MiB