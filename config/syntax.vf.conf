# VFConf — Vitte Foundation Configuration Language
# config/syntax.vf.conf
#
# Canonical syntax-highlighting configuration for *.vf.conf.

[syntax]
id = "vfconf"
name = "VFConf"
display_name = "Vitte Foundation Configuration Language"
version = "1.0"
language_id = "vfconf"
mime = "text/x-vfconf"
enabled = true
case_sensitive = true

[syntax.files]
extensions = [
  ".vf.conf"
]
filenames = []
first_line = ""

[syntax.lexer]
encoding = "utf-8"
unicode = true
incremental = true

# ------------------------------------------------------------
# Comments
# ------------------------------------------------------------

[syntax.comments]
enabled = true

[syntax.comments.hash]
type = "line"
start = "#"
scope = "comment.line.number-sign.vfconf"

[syntax.comments.slash]
type = "line"
start = "//"
scope = "comment.line.double-slash.vfconf"

[syntax.comments.block]
type = "block"
start = "/*"
end = "*/"
nested = true
scope = "comment.block.vfconf"

# ------------------------------------------------------------
# Strings
# ------------------------------------------------------------

[syntax.strings]
enabled = true

[syntax.strings.double]
start = "\""
end = "\""
escape = "\\"
multiline = false
scope = "string.quoted.double.vfconf"

[syntax.strings.escape]
scope = "constant.character.escape.vfconf"

# ------------------------------------------------------------
# Numbers
# ------------------------------------------------------------

[syntax.numbers]
enabled = true

[syntax.numbers.integer]
pattern = "[0-9][0-9_]*"
scope = "constant.numeric.integer.vfconf"

[syntax.numbers.float]
pattern = "[0-9][0-9_]*\\.[0-9][0-9_]*"
scope = "constant.numeric.float.vfconf"

[syntax.numbers.hexadecimal]
pattern = "0[xX][0-9a-fA-F_]+"
scope = "constant.numeric.integer.hexadecimal.vfconf"

[syntax.numbers.binary]
pattern = "0[bB][01_]+"
scope = "constant.numeric.integer.binary.vfconf"

[syntax.numbers.octal]
pattern = "0[oO][0-7_]+"
scope = "constant.numeric.integer.octal.vfconf"

# ------------------------------------------------------------
# Literals
# ------------------------------------------------------------

[syntax.literals.boolean]
values = [
  "true",
  "false",
  "on",
  "off"
]
scope = "constant.language.boolean.vfconf"

[syntax.literals.null]
values = [
  "null",
  "none"
]
scope = "constant.language.null.vfconf"

# ------------------------------------------------------------
# Keywords
# ------------------------------------------------------------

[syntax.keywords.control]
values = [
  "include",
  "define",
  "when",
  "else"
]
scope = "keyword.control.vfconf"

[syntax.keywords.functions]
values = [
  "rgb",
  "rgba"
]
scope = "support.function.vfconf"

# ------------------------------------------------------------
# Sections
# ------------------------------------------------------------

[syntax.sections]
enabled = true
begin = "\\["
end = "\\]"
scope = "meta.section.vfconf"
name_scope = "entity.name.section.vfconf"

# ------------------------------------------------------------
# Assignments
# ------------------------------------------------------------

[syntax.assignments]
enabled = true

[syntax.assignments.normal]
operator = "="
scope = "keyword.operator.assignment.vfconf"

[syntax.assignments.define]
operator = ":="
scope = "keyword.operator.assignment.definition.vfconf"

[syntax.assignments.add]
operator = "+="
scope = "keyword.operator.assignment.augmented.vfconf"

[syntax.assignments.subtract]
operator = "-="
scope = "keyword.operator.assignment.augmented.vfconf"

# ------------------------------------------------------------
# Logical operators
# ------------------------------------------------------------

[syntax.operators.logical]
values = [
  "&&",
  "||",
  "!"
]
scope = "keyword.operator.logical.vfconf"

# ------------------------------------------------------------
# Comparison operators
# ------------------------------------------------------------

[syntax.operators.comparison]
values = [
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">="
]
scope = "keyword.operator.comparison.vfconf"

# ------------------------------------------------------------
# Delimiters
# ------------------------------------------------------------

[syntax.delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
comma = ","
colon = ":"
semicolon = ";"
dot = "."
dollar = "$"

[syntax.delimiters.scope]
parentheses = "punctuation.section.parens.vfconf"
brackets = "punctuation.section.brackets.vfconf"
braces = "punctuation.section.braces.vfconf"
comma = "punctuation.separator.comma.vfconf"
colon = "punctuation.separator.key-value.vfconf"
semicolon = "punctuation.terminator.statement.vfconf"
dot = "punctuation.accessor.vfconf"
dollar = "punctuation.definition.reference.vfconf"

# ------------------------------------------------------------
# Identifiers
# ------------------------------------------------------------

[syntax.identifiers]
pattern = "[A-Za-z_][A-Za-z0-9_-]*"
scope = "variable.other.vfconf"

[syntax.identifiers.key]
scope = "variable.other.member.vfconf"

[syntax.identifiers.definition]
scope = "entity.name.constant.vfconf"

# ------------------------------------------------------------
# References
# ------------------------------------------------------------

[syntax.references]
enabled = true
prefix = "$"
pattern = "\\$[A-Za-z_][A-Za-z0-9_-]*(\\.[A-Za-z_][A-Za-z0-9_-]*)*"
scope = "variable.other.reference.vfconf"

# ------------------------------------------------------------
# Colors
# ------------------------------------------------------------

[syntax.colors]
enabled = true

[syntax.colors.hex3]
pattern = "#[0-9a-fA-F]{3}"
scope = "constant.other.color.vfconf"

[syntax.colors.hex4]
pattern = "#[0-9a-fA-F]{4}"
scope = "constant.other.color.vfconf"

[syntax.colors.hex6]
pattern = "#[0-9a-fA-F]{6}"
scope = "constant.other.color.vfconf"

[syntax.colors.hex8]
pattern = "#[0-9a-fA-F]{8}"
scope = "constant.other.color.vfconf"

[syntax.colors.rgb]
pattern = "rgb\\("
scope = "support.function.color.vfconf"

[syntax.colors.rgba]
pattern = "rgba\\("
scope = "support.function.color.vfconf"

# ------------------------------------------------------------
# Durations
# ------------------------------------------------------------

[syntax.durations]
enabled = true
pattern = "[0-9]+(\\.[0-9]+)?(ns|us|ms|s|min|h)"
scope = "constant.numeric.duration.vfconf"

# ------------------------------------------------------------
# Sizes
# ------------------------------------------------------------

[syntax.sizes]
enabled = true
pattern = "[0-9]+(\\.[0-9]+)?(B|KB|MB|GB|KiB|MiB|GiB)"
scope = "constant.numeric.size.vfconf"

# ------------------------------------------------------------
# Semantic highlighting
# ------------------------------------------------------------

[syntax.semantic]
enabled = true

[syntax.semantic.tokens]
section = "namespace"
key = "property"
definition = "variable"
reference = "variable"
keyword = "keyword"
boolean = "enumMember"
null = "enumMember"
string = "string"
integer = "number"
float = "number"
duration = "number"
size = "number"
color = "string"
operator = "operator"
comment = "comment"

[syntax.semantic.modifiers]
definition = ["declaration", "readonly"]
reference = ["readonly"]

# ------------------------------------------------------------
# Folding
# ------------------------------------------------------------

[syntax.folding]
enabled = true
sections = true
blocks = true
arrays = true
objects = true
comments = true

[syntax.folding.block]
start = "{"
end = "}"

[syntax.folding.comment]
start = "/*"
end = "*/"

# ------------------------------------------------------------
# Bracket matching
# ------------------------------------------------------------

[syntax.brackets]
enabled = true
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

# ------------------------------------------------------------
# Indentation
# ------------------------------------------------------------

[syntax.indentation]
enabled = true
increase_after = "{"
decrease_before = "}"
width = 2

# ------------------------------------------------------------
# Pattern precedence
# ------------------------------------------------------------

[syntax.patterns]
precedence = [
  "comments",
  "strings",
  "colors",
  "durations",
  "sizes",
  "numbers",
  "keywords",
  "literals",
  "references",
  "sections",
  "operators",
  "identifiers",
  "delimiters"
]

longest_match = true

# ------------------------------------------------------------
# Highlighting scopes
# ------------------------------------------------------------

[syntax.scopes]
comment = "comment.vfconf"
string = "string.vfconf"
number = "constant.numeric.vfconf"
boolean = "constant.language.boolean.vfconf"
null = "constant.language.null.vfconf"
keyword = "keyword.vfconf"
operator = "keyword.operator.vfconf"
section = "entity.name.section.vfconf"
key = "variable.other.member.vfconf"
reference = "variable.other.reference.vfconf"
definition = "entity.name.constant.vfconf"
color = "constant.other.color.vfconf"
duration = "constant.numeric.duration.vfconf"
size = "constant.numeric.size.vfconf"

# ------------------------------------------------------------
# Validation
# ------------------------------------------------------------

[syntax.validation]
reject_unknown_tokens = true
validate_patterns = true
validate_scopes = true
detect_pattern_conflicts = true

# Hex colors must be recognized before hash comments.
# This resolves the lexical ambiguity between:
#
#   color = #ff8800
#
# and:
#
#   # comment
#
# The lexer must apply the same precedence.

[syntax.validation.hash]
color_before_comment = true