# VFConf — Vitte Foundation Configuration Language
# config/diagnostics.vf.conf
#
# Canonical diagnostic configuration.
#
# Stable diagnostic namespaces:
#   VF0001..VF0099  lexical
#   VF0101..VF0199  syntax
#   VF0201..VF0299  semantic
#   VF0301..VF0399  include
#   VF0401..VF0499  schema
#   VF0501..VF0599  evaluation
#   VF0601..VF0699  I/O
#   VF9001..VF9999  internal
#   VFWxxxx          warnings

[diagnostics]
enabled = true
language = "en"
format = "human"
show_code = true
show_severity = true
show_filename = true
show_location = true
show_source = true
show_labels = true
show_notes = true
show_fixes = true
sort = true
deduplicate = true
maximum = 1000

[diagnostics.location]
line_base = 1
column_base = 1
show_line = true
show_column = true
show_range = true
show_end_position = true
show_offset = false

[diagnostics.source]
enabled = true
context_before = 2
context_after = 2
maximum_width = 160
show_line_numbers = true
show_primary_span = true
show_secondary_spans = true
tab_width = 4

[diagnostics.severity]
error = true
warning = true
information = true
hint = true

[diagnostics.severity.names]
error = "error"
warning = "warning"
information = "information"
hint = "hint"

[diagnostics.severity.exit]
error = true
warning = false
information = false
hint = false

[diagnostics.output]
stdout = false
stderr = true
flush = true
color = "auto"

[diagnostics.output.formats]
supported = [
  "human",
  "compact",
  "json"
]

[diagnostics.codes]
enabled = true
prefix = "VF"
warning_prefix = "VFW"
minimum_width = 4

[diagnostics.categories]
lexical = true
syntax = true
semantic = true
include = true
schema = true
evaluation = true
io = true
internal = true

[diagnostics.categories.lexical]
name = "lexical"
range_start = 1
range_end = 99

[diagnostics.categories.syntax]
name = "syntax"
range_start = 101
range_end = 199

[diagnostics.categories.semantic]
name = "semantic"
range_start = 201
range_end = 299

[diagnostics.categories.include]
name = "include"
range_start = 301
range_end = 399

[diagnostics.categories.schema]
name = "schema"
range_start = 401
range_end = 499

[diagnostics.categories.evaluation]
name = "evaluation"
range_start = 501
range_end = 599

[diagnostics.categories.io]
name = "io"
range_start = 601
range_end = 699

[diagnostics.categories.internal]
name = "internal"
range_start = 9001
range_end = 9999

# ------------------------------------------------------------
# Lexical diagnostics
# ------------------------------------------------------------

[diagnostics.lexical]
enabled = true
severity = "error"

[diagnostics.lexical.VF0001]
enabled = true
name = "invalid-character"

[diagnostics.lexical.VF0002]
enabled = true
name = "unterminated-string"

[diagnostics.lexical.VF0003]
enabled = true
name = "invalid-escape"

[diagnostics.lexical.VF0004]
enabled = true
name = "invalid-number"

[diagnostics.lexical.VF0005]
enabled = true
name = "invalid-color"

[diagnostics.lexical.VF0006]
enabled = true
name = "invalid-duration"

[diagnostics.lexical.VF0007]
enabled = true
name = "invalid-size"

[diagnostics.lexical.VF0008]
enabled = true
name = "unterminated-comment"

[diagnostics.lexical.VF0009]
enabled = true
name = "invalid-token"

# ------------------------------------------------------------
# Syntax diagnostics
# ------------------------------------------------------------

[diagnostics.syntax]
enabled = true
severity = "error"

[diagnostics.syntax.VF0101]
enabled = true
name = "unexpected-token"

[diagnostics.syntax.VF0102]
enabled = true
name = "unexpected-end-of-file"

[diagnostics.syntax.VF0103]
enabled = true
name = "invalid-syntax"

# ------------------------------------------------------------
# Semantic diagnostics
# ------------------------------------------------------------

[diagnostics.semantic]
enabled = true
severity = "error"

[diagnostics.semantic.VF0201]
enabled = true
name = "duplicate-key"

[diagnostics.semantic.VF0202]
enabled = true
name = "duplicate-definition"

[diagnostics.semantic.VF0203]
enabled = true
name = "undefined-reference"

[diagnostics.semantic.VF0204]
enabled = true
name = "invalid-assignment"

[diagnostics.semantic.VF0205]
enabled = true
name = "type-mismatch"

[diagnostics.semantic.VF0206]
enabled = true
name = "invalid-condition"

[diagnostics.semantic.VF0207]
enabled = true
name = "invalid-value"

# ------------------------------------------------------------
# Include diagnostics
# ------------------------------------------------------------

[diagnostics.include]
enabled = true
severity = "error"

[diagnostics.include.VF0301]
enabled = true
name = "include-not-found"

[diagnostics.include.VF0302]
enabled = true
name = "include-cycle"

[diagnostics.include.VF0303]
enabled = true
name = "include-depth-exceeded"

[diagnostics.include.VF0304]
enabled = true
name = "invalid-include"

# ------------------------------------------------------------
# Schema diagnostics
# ------------------------------------------------------------

[diagnostics.schema]
enabled = true
severity = "error"

[diagnostics.schema.VF0401]
enabled = true
name = "missing-required-field"

[diagnostics.schema.VF0402]
enabled = true
name = "schema-type-mismatch"

[diagnostics.schema.VF0403]
enabled = true
name = "schema-constraint-violation"

# ------------------------------------------------------------
# Evaluation diagnostics
# ------------------------------------------------------------

[diagnostics.evaluation]
enabled = true
severity = "error"

[diagnostics.evaluation.VF0501]
enabled = true
name = "evaluation-failed"

[diagnostics.evaluation.VF0502]
enabled = true
name = "reference-cycle"

# ------------------------------------------------------------
# I/O diagnostics
# ------------------------------------------------------------

[diagnostics.io]
enabled = true
severity = "error"

[diagnostics.io.VF0601]
enabled = true
name = "file-not-found"

[diagnostics.io.VF0602]
enabled = true
name = "io-error"

# ------------------------------------------------------------
# Internal diagnostics
# ------------------------------------------------------------

[diagnostics.internal]
enabled = true
severity = "error"

[diagnostics.internal.VF9001]
enabled = true
name = "internal-error"
show_details = true

# ------------------------------------------------------------
# Warnings
# ------------------------------------------------------------

[diagnostics.warnings]
enabled = true
as_errors = false
show = true

[diagnostics.warnings.semantic]
enabled = true

[diagnostics.warnings.schema]
enabled = true

[diagnostics.warnings.deprecated]
enabled = true

[diagnostics.warnings.unused]
enabled = true

[diagnostics.warnings.shadowed]
enabled = true

[diagnostics.warnings.style]
enabled = true

# ------------------------------------------------------------
# Labels
# ------------------------------------------------------------

[diagnostics.labels]
enabled = true
primary = true
secondary = true
maximum = 16

[diagnostics.labels.primary]
marker = "^"

[diagnostics.labels.secondary]
marker = "-"

# ------------------------------------------------------------
# Notes
# ------------------------------------------------------------

[diagnostics.notes]
enabled = true
maximum = 16
prefix = "note"

# ------------------------------------------------------------
# Fixes
# ------------------------------------------------------------

[diagnostics.fixes]
enabled = true
show_replacement = true
maximum = 16
prefix = "help"

[diagnostics.fixes.application]
automatic = false
safe_only = true

# ------------------------------------------------------------
# Limits
# ------------------------------------------------------------

[diagnostics.limits]
maximum_errors = 100
maximum_warnings = 500
maximum_information = 500
maximum_hints = 500
stop_after_maximum_errors = true

# ------------------------------------------------------------
# Sorting
# ------------------------------------------------------------

[diagnostics.sorting]
enabled = true
primary = "filename"
secondary = "offset"
tertiary = "severity"

[diagnostics.sorting.severity]
order = [
  "error",
  "warning",
  "information",
  "hint"
]

# ------------------------------------------------------------
# Canonical behaviour
# ------------------------------------------------------------

[diagnostics.policy]
canonical_messages = true
canonical_language = "en"
preserve_source_spans = true
allow_spanless_diagnostics = true
duplicate_catalog = false
stable_codes = true
stable_categories = true