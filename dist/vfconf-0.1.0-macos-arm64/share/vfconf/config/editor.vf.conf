# VFConf — Vitte Foundation Configuration Language
# config/editor.vf.conf
#
# Canonical editor configuration.

[editor]
enabled = true
encoding = "utf-8"
line_ending = "auto"
language_detection = true
syntax_highlighting = true
semantic_highlighting = true
diagnostics = true
completion = true
hover = true
formatting = true
auto_save = false
read_only = false

[editor.files]
extension = ".vf.conf"
language_id = "vfconf"
mime = "text/x-vfconf"
detect_by_extension = true
detect_by_filename = true
detect_by_content = false

[editor.indentation]
style = "spaces"
width = 2
tab_width = 4
insert_spaces = true
detect = true
smart = true
auto_indent = true
keep_indentation_on_empty_lines = false

[editor.lines]
line_numbers = true
relative_line_numbers = false
highlight_current = true
wrap = false
wrap_column = 100
rulers = [80, 100, 120]
trim_trailing_whitespace = true
insert_final_newline = true
trim_final_newlines = true

[editor.cursor]
style = "line"
blinking = true
smooth = false
surrounding_lines = 3

[editor.selection]
highlight = true
highlight_occurrences = true
selection_clipboard = false

[editor.whitespace]
render = "selection"
spaces = true
tabs = true
trailing = true
newlines = false

[editor.brackets]
matching = true
highlight_matching = true
auto_close = true
auto_surround = true
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"],
  ["\"", "\""]
]

[editor.comments]
line = ["#", "//"]
block = ["/*", "*/"]
toggle = true
continue_line_comment = true

[editor.syntax]
enabled = true
configuration = "config/syntax.vf.conf"
semantic = true
fallback = "plain"
reload_on_change = true

[editor.theme]
enabled = true
name = "default"
configuration = "themes/default.vf.conf"
follow_system = false
high_contrast = false

[editor.font]
family = "monospace"
size = 14
ligatures = true
weight = "normal"

[editor.completion]
enabled = true
automatic = true
minimum_characters = 1
maximum_items = 100
keywords = true
sections = true
keys = true
values = true
references = true
schemas = true
snippets = true

[editor.completion.trigger]
characters = [
  ".",
  "$",
  "[",
  "=",
  ":"
]

[editor.hover]
enabled = true
documentation = true
types = true
values = true
references = true
diagnostics = true

[editor.navigation]
goto_definition = true
goto_reference = true
goto_symbol = true
goto_section = true
breadcrumbs = true
outline = true

[editor.references]
enabled = true
highlight = true
resolve = true
maximum_depth = 128

[editor.formatter]
enabled = true
configuration = "config/formatter.vf.conf"
format_on_save = false
format_on_paste = false
format_on_type = false

[editor.diagnostics]
enabled = true
configuration = "config/diagnostics.vf.conf"
live = true
delay = 250ms
show_inline = true
show_gutter = true
show_status = true
show_problems = true

[editor.lsp]
enabled = true
configuration = "config/lsp.vf.conf"
start_automatically = true
restart_on_failure = true

[editor.folding]
enabled = true
sections = true
blocks = true
arrays = true
objects = true
comments = true
maximum_regions = 5000

[editor.minimap]
enabled = false
show_slider = true
render_characters = true
maximum_column = 120

[editor.search]
case_sensitive = false
whole_word = false
regex = false
incremental = true
highlight_all = true
maximum_results = 10000

[editor.replace]
preserve_case = false
confirm_all = false

[editor.undo]
enabled = true
maximum_entries = 10000
group_typing = true

[editor.history]
enabled = true
recent_files = 100
search_entries = 100
command_entries = 100

[editor.save]
atomic = true
create_directories = false
backup = false
backup_extension = ".bak"
preserve_permissions = true

[editor.autosave]
enabled = false
delay = 2s
on_focus_lost = false
on_window_change = false

[editor.performance]
incremental_parsing = true
incremental_highlighting = true
incremental_diagnostics = true
maximum_file_size = 64MiB
large_file_threshold = 8MiB

[editor.large_files]
syntax_highlighting = true
semantic_highlighting = false
diagnostics = false
completion = false
minimap = false

[editor.accessibility]
screen_reader = "auto"
high_contrast = "auto"
reduce_motion = false
announce_diagnostics = true

[editor.security]
follow_symlinks = true
allow_external_includes = false
allow_commands = false
trusted_workspace_required = true

[editor.keymap]
enabled = true
configuration = "config/keymap.vf.conf"

[editor.status]
show_language = true
show_encoding = true
show_line_ending = true
show_position = true
show_diagnostics = true
show_git = true

[editor.experimental]
enabled = false
tree_sitter = false
structural_editing = false