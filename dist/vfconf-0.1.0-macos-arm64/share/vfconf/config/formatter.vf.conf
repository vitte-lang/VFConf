# VFConf — Vitte Foundation Configuration Language
# config/formatter.vf.conf
#
# Canonical formatter configuration for *.vf.conf files.

[formatter]
enabled = true
language = "vfconf"
version = "1.0"
deterministic = true
preserve_semantics = true

[formatter.indentation]
width = 2
style = "spaces"
tabs = false

[formatter.lines]
line_ending = "lf"
final_newline = true
maximum_width = 100
trim_trailing_whitespace = true
preserve_blank_lines = true
maximum_blank_lines = 2

[formatter.spacing]
around_operators = true
after_comma = true
after_colon = true
before_colon = false
inside_parentheses = false
inside_brackets = false
inside_braces = true

[formatter.assignments]
space_around_operator = true
align = false

[formatter.sections]
blank_line_before = true
blank_line_after_header = false
compact_empty = true

[formatter.blocks]
indent = true
opening_brace = "same-line"
closing_brace = "own-line"
blank_line_between = false

[formatter.arrays]
multiline = false
indent = true
trailing_comma = false
compact_empty = true
one_item_per_line = false

[formatter.objects]
multiline = true
indent = true
sort_keys = false
trailing_comma = false
compact_empty = true
one_entry_per_line = true

[formatter.conditions]
parentheses = "minimal"
space_around_logical_operators = true
space_around_comparison_operators = true
space_after_not = false

[formatter.references]
compact = true
separator = "."
space_after_prefix = false

[formatter.strings]
quote = "\""
escape = "\\"
escape_control_characters = true
escape_non_ascii = false
preserve_escape_style = true

[formatter.numbers]
normalize_integers = false
normalize_floats = true
preserve_base = true
preserve_digit_separators = true

[formatter.booleans]
canonical = true
true = "true"
false = "false"

[formatter.null]
canonical = true
value = "null"

[formatter.colors]
normalize = false
uppercase_hex = false
prefer_hex = false
preserve_alpha = true

[formatter.durations]
normalize = false
preserve_unit = true
space_before_unit = false

[formatter.sizes]
normalize = false
preserve_unit = true
space_before_unit = false

[formatter.includes]
quote_paths = true
normalize_paths = false
sort = false

[formatter.definitions]
sort = false
blank_line_between = false

[formatter.comments]
preserve = true
line_style = "preserve"
block_style = "preserve"
indent = true
wrap = false
maximum_width = 100

[formatter.order]
sort_sections = false
sort_assignments = false
sort_definitions = false
sort_includes = false
preserve_statement_order = true

[formatter.output]
encoding = "utf-8"
write_atomic = true
preserve_permissions = true
create_backup = false

[formatter.check]
enabled = true
fail_on_change = true
show_diff = true

[formatter.safety]
preserve_source_meaning = true
preserve_unknown_values = true
preserve_unknown_statements = true
abort_on_parse_error = true
abort_on_semantic_error = false

[formatter.performance]
maximum_file_size = 64MiB
buffer_initial_capacity = 4096

[formatter.compatibility]
extension = ".vf.conf"
mime = "text/x-vfconf"
language_id = "vfconf"