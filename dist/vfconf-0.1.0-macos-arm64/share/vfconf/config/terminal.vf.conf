# VFConf — Vitte Foundation Configuration Language
# config/terminal.vf.conf
#
# Terminal configuration for VFConf editor.

[terminal]
shell = "bash"
font_family = "monospace"
font_size = 13
line_height = 1.2
cursor_blink = true
cursor_shape = "block"
scrollback = 10000
bell = false
copy_on_select = true
right_click_selects_word = true

[terminal.colors]
background = "#121419"
foreground = "#D7DAE0"
cursor = "#F2F3F5"
cursor_text = "#181A1F"
selection = "#36516F"

[terminal.colors.ansi]
black = "#1B1D22"
red = "#E06C75"
green = "#78C490"
yellow = "#E5C07B"
blue = "#61A7F2"
magenta = "#C678DD"
cyan = "#56B6C2"
white = "#D7DAE0"
bright_black = "#626975"
bright_red = "#F37B84"
bright_green = "#91D5A5"
bright_yellow = "#F0CD8A"
bright_blue = "#7DBBFF"
bright_magenta = "#D995EE"
bright_cyan = "#70CDD8"
bright_white = "#FFFFFF"

[terminal.keybindings]
copy = "Ctrl+Shift+C"
paste = "Ctrl+Shift+V"
new_tab = "Ctrl+Shift+T"
close_tab = "Ctrl+Shift+W"
split_pane_right = "Ctrl+Shift+Right"
split_pane_down = "Ctrl+Shift+Down"
next_tab = "Ctrl+Tab"
prev_tab = "Ctrl+Shift+Tab"