# VFConf — Vitte Foundation Configuration Language
# config/theme.vf.conf
#
# Theme configuration for VFConf editor.

[theme]
id = "config-theme"
name = "Config Theme"
version = "1.0"
variant = "dark"
enabled = true

[ui]
background = "#181A1F"
foreground = "#D7DAE0"
border = "#343842"
focus_border = "#5C9DED"
disabled = "#747B87"

[editor]
background = "#181A1F"
foreground = "#D7DAE0"
cursor = "#F2F3F5"
selection = "#36516F"
selection_foreground = "#FFFFFF"
current_line = "#1E2127"
indent_guide = "#30343D"
active_indent_guide = "#535B68"
whitespace = "#414751"

[terminal]
background = "#121419"
foreground = "#D7DAE0"
cursor = "#F2F3F5"
cursor_foreground = "#181A1F"

[terminal_ansi]
black = "#1B1D22"
red = "#E06C75"
green = "#78C490"
yellow = "#E5C07B"
blue = "#61A7F2"
magenta = "#C678DD"
cyan = "#56B6C2"
white = "#D7DAE0"
bright_black = "#626975"
bright_red = "#F37B84"
bright_green = "#91D5A5"
bright_yellow = "#F0CD8A"
bright_blue = "#7DBBFF"
bright_magenta = "#D995EE"
bright_cyan = "#70CDD8"
bright_white = "#FFFFFF"

[panel]
background = "#17191E"
foreground = "#D7DAE0"
border = "#30343D"
title = "#F0F1F3"

[statusbar]
background = "#20242B"
foreground = "#D7DAE0"
border = "#343944"

[tabs]
background = "#16181D"
foreground = "#9299A5"
active_background = "#1E2127"
active_foreground = "#F1F2F4"
active_border = "#61A7F2"
inactive_background = "#181A1F"
inactive_foreground = "#808792"
border = "#30343D"

[syntax]
comment = "#737B86"
keyword = "#C792EA"
string = "#C3E88D"
number = "#F78C6C"
boolean = "#FF9CAC"
operator = "#89DDFF"
variable = "#D7DAE0"
function = "#82AAFF"
type = "#FFCB6B"
constant = "#FFCB6B"