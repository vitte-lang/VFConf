[formatter]
enabled = false
indent_width = 4
align_labels = false
align_operands = false

[compiler]
enabled = true
auto_detect = true

[compiler.gnu]
command = "as"
arguments = []

[compiler.nasm]
command = "nasm"
arguments = []

[compiler.yasm]
command = "yasm"
arguments = []

[compiler.masm]
command = "ml"
arguments = []

[build]
enabled = true
object_extension = ".o"

[lsp]
enabled = false

[debugger]
enabled = true
providers = [
  "gdb",
  "lldb"
]

[diagnostics]
enabled = true
canonical_language = "en"

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "bare-metal"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.auto_detect"]
}