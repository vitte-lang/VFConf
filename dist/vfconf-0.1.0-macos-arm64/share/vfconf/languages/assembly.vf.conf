# VFConf — Vitte Foundation Configuration Language
# languages/assembly.vf.conf
#
# Assembly language definition.
# Covers common GNU, Intel/NASM, MASM and architecture-specific assembly.

[language]
id = "assembly"
name = "Assembly"
display_name = "Assembly"
version = "1.0"
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".s",
  ".S",
  ".asm",
  ".inc"
]
filenames = []
mime = [
  "text/x-asm"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = [
  ";",
  "#",
  "//"
]
block = ["/*", "*/"]

[strings]
double_quote = true
single_quote = true
escape = "\\"
multiline = false

[numbers]
decimal = true
hexadecimal = true
binary = true
octal = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9]+"
hexadecimal = "(0[xX][0-9A-Fa-f]+|[0-9A-Fa-f]+[hH])"
binary = "(0[bB][01]+|[01]+[bB])"
octal = "(0[oO][0-7]+|[0-7]+[qQoO])"

[keywords]
values = [
  "section",
  "segment",
  "global",
  "extern",
  "public",
  "private",
  "proc",
  "endp",
  "end",
  "equ",
  "times",
  "align",
  "org",
  "bits",
  "use16",
  "use32",
  "use64"
]

[keywords.data]
values = [
  "db",
  "dw",
  "dd",
  "dq",
  "dt",
  "do",
  "dy",
  "dz",
  "byte",
  "word",
  "dword",
  "qword",
  "tword",
  "oword",
  "yword",
  "zword",
  "resb",
  "resw",
  "resd",
  "resq",
  "rest"
]

[keywords.control]
values = [
  "call",
  "ret",
  "jmp",
  "je",
  "jne",
  "jz",
  "jnz",
  "ja",
  "jae",
  "jb",
  "jbe",
  "jg",
  "jge",
  "jl",
  "jle",
  "jo",
  "jno",
  "js",
  "jns",
  "jp",
  "jnp",
  "loop"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
comma = ","
colon = ":"

[syntax]
enabled = true
labels = true
registers = true
instructions = true
directives = true
immediates = true

[syntax.labels]
pattern = "[A-Za-z_.$?@][A-Za-z0-9_.$?@]*:"
scope = "entity.name.label.assembly"

[syntax.immediates]
pattern = "[$#]?[0-9A-Fa-fxX]+"
scope = "constant.numeric.assembly"

[syntax.directives]
pattern = "(\\.|%)[A-Za-z_][A-Za-z0-9_]*"
scope = "keyword.directive.assembly"

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "sparc",
  "sparc64"
]
default = "x86_64"

[architectures.x86]
bits = [16, 32]
syntax = [
  "intel",
  "att"
]

[architectures.x86_64]
bits = [64]
syntax = [
  "intel",
  "att"
]

[architectures.arm]
bits = [32]
syntax = ["unified"]

[architectures.aarch64]
bits = [64]
syntax = ["unified"]

[architectures.riscv32]
bits = [32]
extensions = [
  "i",
  "m",
  "a",
  "f",
  "d",
  "c"
]

[architectures.riscv64]
bits = [64]
extensions = [
  "i",
  "m",
  "a",
  "f",
  "d",
  "c"
]

[architectures.mips]
bits = [32]

[architectures.mips64]
bits = [64]

[architectures.powerpc]
bits = [32]

[architectures.powerpc64]
bits = [64]

[architectures.sparc]
bits = [32]

[architectures.sparc64]
bits = [64]

