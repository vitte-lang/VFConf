# VFConf — Vitte Foundation Configuration Language
# languages/c.vf.conf
#
# C programming language definition.

[language]
id = "c"
name = "C"
display_name = "C"
version = "1.0"
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".c",
  ".h"
]
filenames = []
mime = [
  "text/x-c",
  "text/x-chdr"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
nested_block = false

[strings]
double_quote = true
single_quote = false
escape = "\\"
multiline = false

[characters]
enabled = true
quote = "'"
escape = "\\"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true

[numbers.suffixes]
integer = [
  "u",
  "U",
  "l",
  "L",
  "ul",
  "UL",
  "ull",
  "ULL",
  "ll",
  "LL"
]
float = [
  "f",
  "F",
  "l",
  "L"
]

[keywords]
values = [
  "auto",
  "break",
  "case",
  "char",
  "const",
  "continue",
  "default",
  "do",
  "double",
  "else",
  "enum",
  "extern",
  "float",
  "for",
  "goto",
  "if",
  "inline",
  "int",
  "long",
  "register",
  "restrict",
  "return",
  "short",
  "signed",
  "sizeof",
  "static",
  "struct",
  "switch",
  "typedef",
  "union",
  "unsigned",
  "void",
  "volatile",
  "while",
  "_Alignas",
  "_Alignof",
  "_Atomic",
  "_Bool",
  "_Complex",
  "_Generic",
  "_Imaginary",
  "_Noreturn",
  "_Static_assert",
  "_Thread_local",
  "alignas",
  "alignof",
  "bool",
  "constexpr",
  "false",
  "nullptr",
  "static_assert",
  "thread_local",
  "true",
  "typeof",
  "typeof_unqual"
]

[keywords.types]
values = [
  "void",
  "char",
  "short",
  "int",
  "long",
  "float",
  "double",
  "signed",
  "unsigned",
  "_Bool",
  "_Complex",
  "bool",
  "size_t",
  "ptrdiff_t",
  "wchar_t",
  "char16_t",
  "char32_t",
  "int8_t",
  "int16_t",
  "int32_t",
  "int64_t",
  "uint8_t",
  "uint16_t",
  "uint32_t",
  "uint64_t",
  "intptr_t",
  "uintptr_t"
]

[keywords.storage]
values = [
  "auto",
  "extern",
  "register",
  "static",
  "typedef",
  "_Thread_local",
  "thread_local"
]

[keywords.qualifiers]
values = [
  "const",
  "restrict",
  "volatile",
  "_Atomic"
]

[keywords.control]
values = [
  "break",
  "case",
  "continue",
  "default",
  "do",
  "else",
  "for",
  "goto",
  "if",
  "return",
  "switch",
  "while"
]

[keywords.aggregate]
values = [
  "enum",
  "struct",
  "union"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "++",
  "--",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  "?",
  ":",
  ".",
  "->",
  ","
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","

[preprocessor]
enabled = true
prefix = "#"

[preprocessor.directives]
values = [
  "define",
  "undef",
  "include",
  "if",
  "ifdef",
  "ifndef",
  "elif",
  "else",
  "endif",
  "error",
  "warning",
  "line",
  "pragma",
  "embed"
]

[preprocessor.macros]
values = [
  "__FILE__",
  "__LINE__",
  "__DATE__",
  "__TIME__",
  "__STDC__",
  "__STDC_VERSION__",
  "__STDC_HOSTED__"
]

[syntax]
enabled = true
functions = true
types = true
variables = true
constants = true
macros = true
preprocessor = true

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.c"

[syntax.type]
scope = "storage.type.c"

[syntax.variable]
scope = "variable.other.c"

[syntax.constant]
scope = "constant.language.c"

[syntax.macro]
scope = "entity.name.function.preprocessor.c"

[syntax.preprocessor]
scope = "meta.preprocessor.c"

[syntax.include]
scope = "string.quoted.other.lt-gt.include.c"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = [
  "{"
]
decrease_before = [
  "}"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "c17"
supported = [
  "c89",
  "c90",
  "c95",
  "c99",
  "c11",
  "c17",
  "c23"
]

[compiler]
enabled = true
auto_detect = true
default = "cc"

[compiler.cc]
command = "cc"
arguments = [
  "-std=c17",
  "-Wall",
  "-Wextra",
  "-Wpedantic"
]

[compiler.gcc]
command = "gcc"
arguments = [
  "-std=c17",
  "-Wall",
  "-Wextra",
  "-Wpedantic"
]

[compiler.clang]
command = "clang"
arguments = [
  "-std=c17",
  "-Wall",
  "-Wextra",
  "-Wpedantic"
]

[compiler.msvc]
command = "cl"
arguments = [
  "/std:c17",
  "/W4"
]

[build]
enabled = true
object_extension = ".o"
executable_extension = ""

[build.windows]
object_extension = ".obj"
executable_extension = ".exe"

[formatter]
enabled = true
provider = "clang-format"
command = "clang-format"

[formatter.arguments]
values = [
  "-style=file"
]

[lsp]
enabled = true
provider = "clangd"
command = "clangd"

[lsp.arguments]
values = [
  "--background-index",
  "--clang-tidy"
]

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
warnings = true
warnings_as_errors = false

[diagnostics.clang_tidy]
enabled = true
command = "clang-tidy"

[debugger]
enabled = true
providers = [
  "gdb",
  "lldb"
]

[repl]
enabled = false

[tasks]
compile = [
  "cc",
  "-std=c17",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "$file",
  "-o",
  "$output"
]

check = [
  "cc",
  "-std=c17",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-fsyntax-only",
  "$file"
]

format = [
  "clang-format",
  "-i",
  "$file"
]

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "sparc",
  "sparc64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "solaris",
  "bare-metal"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}