# VFConf — Vitte Foundation Configuration Language
# languages/go.vf.conf
#
# Go programming language definition.

[language]
id = "go"
name = "Go"
display_name = "Go"
version = "1.0"
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".go"
]
filenames = [
  "go.mod",
  "go.sum",
  "go.work"
]
mime = [
  "text/x-go"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
nested_block = false
documentation = ["//"]

[strings]
double_quote = true
escape = "\\"
multiline = false

[strings.raw]
enabled = true
start = "`"
end = "`"
escape_sequences = false
multiline = true

[characters]
enabled = true
quote = "'"
escape = "\\"
unicode = true

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
legacy_octal = "0[0-7_]+"
binary = "0[bB][01_]+"

[keywords]
values = [
  "break",
  "case",
  "chan",
  "const",
  "continue",
  "default",
  "defer",
  "else",
  "fallthrough",
  "for",
  "func",
  "go",
  "goto",
  "if",
  "import",
  "interface",
  "map",
  "package",
  "range",
  "return",
  "select",
  "struct",
  "switch",
  "type",
  "var"
]

[keywords.control]
values = [
  "break",
  "case",
  "continue",
  "default",
  "defer",
  "else",
  "fallthrough",
  "for",
  "go",
  "goto",
  "if",
  "range",
  "return",
  "select",
  "switch"
]

[keywords.declaration]
values = [
  "const",
  "func",
  "import",
  "package",
  "type",
  "var"
]

[keywords.types]
values = [
  "any",
  "bool",
  "byte",
  "comparable",
  "complex64",
  "complex128",
  "error",
  "float32",
  "float64",
  "int",
  "int8",
  "int16",
  "int32",
  "int64",
  "rune",
  "string",
  "uint",
  "uint8",
  "uint16",
  "uint32",
  "uint64",
  "uintptr"
]

[keywords.builtins]
values = [
  "append",
  "cap",
  "clear",
  "close",
  "complex",
  "copy",
  "delete",
  "imag",
  "len",
  "make",
  "max",
  "min",
  "new",
  "panic",
  "print",
  "println",
  "real",
  "recover"
]

[literals]
values = [
  "true",
  "false",
  "iota",
  "nil"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "&",
  "|",
  "^",
  "<<",
  ">>",
  "&^",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  "&^=",
  "&&",
  "||",
  "<-",
  "++",
  "--",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "=",
  ":=",
  "!",
  "~"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","
colon = ":"
dot = "."

[syntax]
enabled = true
packages = true
imports = true
functions = true
methods = true
types = true
interfaces = true
structs = true
variables = true
constants = true
parameters = true
fields = true
labels = true
generics = true
channels = true
goroutines = true

[syntax.package]
scope = "entity.name.namespace.go"

[syntax.import]
scope = "string.quoted.double.go"

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.go"

[syntax.method]
scope = "entity.name.function.method.go"

[syntax.type]
scope = "entity.name.type.go"

[syntax.interface]
scope = "entity.name.type.interface.go"

[syntax.struct]
scope = "entity.name.type.struct.go"

[syntax.variable]
scope = "variable.other.go"

[syntax.constant]
scope = "variable.other.constant.go"

[syntax.parameter]
scope = "variable.parameter.go"

[syntax.field]
scope = "variable.other.member.go"

[syntax.label]
pattern = "[A-Za-z_][A-Za-z0-9_]*:"
scope = "entity.name.label.go"

[syntax.channel]
operators = [
  "chan",
  "<-"
]
scope = "keyword.operator.channel.go"

[syntax.goroutine]
keyword = "go"
scope = "keyword.control.go"

[syntax.defer]
keyword = "defer"
scope = "keyword.control.defer.go"

[syntax.generics]
enabled = true
type_parameters = true
constraints = true
approximation_operator = "~"

[indentation]
enabled = true
style = "tabs"
width = 8
tab_width = 8

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[formatter]
enabled = true
provider = "gofmt"
command = "gofmt"

[formatter.arguments]
values = [
  "-w"
]

[formatter.goimports]
enabled = true
command = "goimports"

[compiler]
enabled = true
auto_detect = true
default = "go"

[compiler.go]
command = "go"
arguments = [
  "build"
]

[build]
enabled = true
module_file = "go.mod"
workspace_file = "go.work"
dependency_file = "go.sum"

[build.commands]
build = ["go", "build", "./..."]
install = ["go", "install", "./..."]
clean = ["go", "clean"]
generate = ["go", "generate", "./..."]

[lsp]
enabled = true
provider = "gopls"
command = "gopls"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.vet]
enabled = true
command = "go"

[diagnostics.vet.arguments]
values = [
  "vet",
  "./..."
]

[diagnostics.staticcheck]
enabled = true
command = "staticcheck"

[diagnostics.compiler]
enabled = true
warnings = true

[debugger]
enabled = true
providers = [
  "delve"
]

[debugger.delve]
command = "dlv"

[repl]
enabled = false

[test]
enabled = true
command = "go"

[test.arguments]
values = [
  "test",
  "./..."
]

[benchmark]
enabled = true
command = "go"

[benchmark.arguments]
values = [
  "test",
  "-bench=.",
  "./..."
]

[tasks]
build = [
  "go",
  "build",
  "./..."
]

run = [
  "go",
  "run",
  "$file"
]

test = [
  "go",
  "test",
  "./..."
]

vet = [
  "go",
  "vet",
  "./..."
]

format = [
  "gofmt",
  "-w",
  "$file"
]

[environment]
GOROOT = true
GOPATH = true
GOMOD = true
GOWORK = true
GOOS = true
GOARCH = true
CGO_ENABLED = true

[architectures]
supported = [
  "386",
  "amd64",
  "arm",
  "arm64",
  "riscv64",
  "mips",
  "mipsle",
  "mips64",
  "mips64le",
  "ppc64",
  "ppc64le",
  "s390x",
  "wasm"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "dragonfly",
  "solaris",
  "aix",
  "illumos",
  "plan9",
  "js",
  "wasip1"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}