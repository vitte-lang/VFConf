# VFConf — Vitte Foundation Configuration Language
# languages/java.vf.conf
#
# Java programming language definition.

[language]
id = "java"
name = "Java"
display_name = "Java"
version = "1.0"
enabled = true
category = "general-purpose"
case_sensitive = true

[files]
extensions = [
  ".java"
]
filenames = [
  "module-info.java",
  "package-info.java"
]
mime = [
  "text/x-java-source"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
documentation = ["/**", "*/"]
nested_block = false

[strings]
double_quote = true
escape = "\\"
multiline = false

[strings.text_block]
enabled = true
delimiter = "\"\"\""
multiline = true
escape_sequences = true

[characters]
enabled = true
quote = "'"
escape = "\\"
unicode = true

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true
digit_separator = "_"

[numbers.suffixes]
integer = [
  "l",
  "L"
]

float = [
  "f",
  "F",
  "d",
  "D"
]

[keywords]
values = [
  "abstract",
  "assert",
  "boolean",
  "break",
  "byte",
  "case",
  "catch",
  "char",
  "class",
  "const",
  "continue",
  "default",
  "do",
  "double",
  "else",
  "enum",
  "extends",
  "final",
  "finally",
  "float",
  "for",
  "goto",
  "if",
  "implements",
  "import",
  "instanceof",
  "int",
  "interface",
  "long",
  "native",
  "new",
  "package",
  "private",
  "protected",
  "public",
  "return",
  "short",
  "static",
  "strictfp",
  "super",
  "switch",
  "synchronized",
  "this",
  "throw",
  "throws",
  "transient",
  "try",
  "void",
  "volatile",
  "while"
]

[keywords.contextual]
values = [
  "exports",
  "module",
  "non-sealed",
  "open",
  "opens",
  "permits",
  "provides",
  "record",
  "requires",
  "sealed",
  "to",
  "transitive",
  "uses",
  "var",
  "when",
  "with",
  "yield"
]

[keywords.types]
values = [
  "boolean",
  "byte",
  "char",
  "double",
  "float",
  "int",
  "long",
  "short",
  "void"
]

[keywords.control]
values = [
  "break",
  "case",
  "catch",
  "continue",
  "default",
  "do",
  "else",
  "finally",
  "for",
  "if",
  "return",
  "switch",
  "throw",
  "throws",
  "try",
  "while",
  "yield"
]

[keywords.declaration]
values = [
  "class",
  "enum",
  "interface",
  "record"
]

[keywords.access]
values = [
  "private",
  "protected",
  "public"
]

[keywords.modifiers]
values = [
  "abstract",
  "final",
  "native",
  "non-sealed",
  "sealed",
  "static",
  "strictfp",
  "synchronized",
  "transient",
  "volatile"
]

[literals]
values = [
  "true",
  "false",
  "null"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "++",
  "--",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  ">>>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  ">>>=",
  "?",
  ":",
  "->",
  "::",
  "."
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
angles = ["<", ">"]
semicolon = ";"
comma = ","
dot = "."

[annotations]
enabled = true
prefix = "@"

[syntax]
enabled = true
packages = true
modules = true
imports = true
classes = true
interfaces = true
records = true
enums = true
annotations = true
methods = true
constructors = true
fields = true
variables = true
parameters = true
generics = true
lambdas = true

[syntax.package]
scope = "entity.name.namespace.java"

[syntax.module]
scope = "entity.name.module.java"

[syntax.class]
scope = "entity.name.type.class.java"

[syntax.interface]
scope = "entity.name.type.interface.java"

[syntax.record]
scope = "entity.name.type.record.java"

[syntax.enum]
scope = "entity.name.type.enum.java"

[syntax.annotation]
scope = "entity.name.type.annotation.java"

[syntax.method]
pattern = "[A-Za-z_$][A-Za-z0-9_$]*(?=\\s*\\()"
scope = "entity.name.function.java"

[syntax.constructor]
scope = "entity.name.function.constructor.java"

[syntax.field]
scope = "variable.other.member.java"

[syntax.variable]
scope = "variable.other.java"

[syntax.parameter]
scope = "variable.parameter.java"

[syntax.generic]
scope = "entity.name.type.parameter.java"

[syntax.lambda]
operator = "->"
scope = "keyword.operator.lambda.java"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "25"
supported = [
  "8",
  "11",
  "17",
  "21",
  "25"
]

[runtime]
enabled = true
command = "java"

[runtime.arguments]
values = []

[compiler]
enabled = true
auto_detect = true
default = "javac"

[compiler.javac]
command = "javac"
arguments = [
  "-encoding",
  "UTF-8"
]

[build]
enabled = true
class_extension = ".class"
source_directory = "src"
output_directory = "build"

[build.maven]
enabled = true
command = "mvn"
project_file = "pom.xml"

[build.gradle]
enabled = true
command = "gradle"
project_files = [
  "build.gradle",
  "build.gradle.kts"
]

[formatter]
enabled = true
provider = "google-java-format"
command = "google-java-format"

[formatter.arguments]
values = [
  "--replace"
]

[lsp]
enabled = true
provider = "eclipse-jdtls"
command = "jdtls"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
warnings = true
warnings_as_errors = false

[diagnostics.checkstyle]
enabled = false
command = "checkstyle"

[diagnostics.spotbugs]
enabled = false
command = "spotbugs"

[debugger]
enabled = true
providers = [
  "jdb",
  "java-debug"
]

[repl]
enabled = true
command = "jshell"

[repl.arguments]
values = []

[test]
enabled = true

[test.junit]
enabled = true
framework = "junit"

[tasks]
compile = [
  "javac",
  "$file"
]

run = [
  "java",
  "$main"
]

format = [
  "google-java-format",
  "--replace",
  "$file"
]

maven_build = [
  "mvn",
  "package"
]

maven_test = [
  "mvn",
  "test"
]

gradle_build = [
  "gradle",
  "build"
]

gradle_test = [
  "gradle",
  "test"
]

[environment]
JAVA_HOME = true
CLASSPATH = true
JDK_HOME = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64",
  "ppc64",
  "s390x"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "solaris",
  "aix"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $runtime.enabled == true {
  required_path += ["runtime.command"]
}

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}
