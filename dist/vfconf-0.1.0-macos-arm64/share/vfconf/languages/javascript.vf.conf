# VFConf — Vitte Foundation Configuration Language
# languages/javascript.vf.conf
#
# JavaScript / ECMAScript language definition.

[language]
id = "javascript"
name = "JavaScript"
display_name = "JavaScript"
version = "1.0"
enabled = true
category = "scripting"
case_sensitive = true

[files]
extensions = [
  ".js",
  ".mjs",
  ".cjs",
  ".jsx"
]
filenames = []
mime = [
  "text/javascript",
  "application/javascript"
]

[files.shebang]
patterns = [
  "#!/usr/bin/env node",
  "#!/usr/bin/node"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
documentation = ["/**", "*/"]
nested_block = false

[strings]
single_quote = true
double_quote = true
escape = "\\"
multiline = false

[strings.template]
enabled = true
start = "`"
end = "`"
escape = "\\"
multiline = true
interpolation_start = "${"
interpolation_end = "}"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
bigint = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"
bigint = "[0-9][0-9_]*n"

[keywords]
values = [
  "async",
  "await",
  "break",
  "case",
  "catch",
  "class",
  "const",
  "continue",
  "debugger",
  "default",
  "delete",
  "do",
  "else",
  "export",
  "extends",
  "finally",
  "for",
  "from",
  "function",
  "get",
  "if",
  "import",
  "in",
  "instanceof",
  "let",
  "new",
  "of",
  "return",
  "set",
  "static",
  "super",
  "switch",
  "this",
  "throw",
  "try",
  "typeof",
  "var",
  "void",
  "while",
  "with",
  "yield"
]

[keywords.control]
values = [
  "break",
  "case",
  "catch",
  "continue",
  "debugger",
  "default",
  "do",
  "else",
  "finally",
  "for",
  "if",
  "return",
  "switch",
  "throw",
  "try",
  "while"
]

[keywords.declaration]
values = [
  "class",
  "const",
  "function",
  "let",
  "var"
]

[keywords.module]
values = [
  "export",
  "from",
  "import"
]

[keywords.async]
values = [
  "async",
  "await",
  "yield"
]

[literals]
values = [
  "true",
  "false",
  "null",
  "undefined",
  "NaN",
  "Infinity"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "**",
  "++",
  "--",
  "==",
  "!=",
  "===",
  "!==",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "??",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  ">>>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "**=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  ">>>=",
  "&&=",
  "||=",
  "??=",
  "?",
  ":",
  "?.",
  "=>",
  "."
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","
colon = ":"
dot = "."

[regex]
enabled = true
delimiter = "/"
escape = "\\"
flags = [
  "d",
  "g",
  "i",
  "m",
  "s",
  "u",
  "v",
  "y"
]

[syntax]
enabled = true
functions = true
classes = true
methods = true
variables = true
constants = true
parameters = true
properties = true
modules = true
imports = true
exports = true
async = true
generators = true
regex = true
jsx = true

[syntax.function]
pattern = "[A-Za-z_$][A-Za-z0-9_$]*(?=\\s*\\()"
scope = "entity.name.function.js"

[syntax.class]
scope = "entity.name.type.class.js"

[syntax.method]
scope = "entity.name.function.method.js"

[syntax.variable]
scope = "variable.other.readwrite.js"

[syntax.constant]
scope = "variable.other.constant.js"

[syntax.parameter]
scope = "variable.parameter.js"

[syntax.property]
scope = "variable.other.property.js"

[syntax.module]
scope = "entity.name.module.js"

[syntax.regex]
scope = "string.regexp.js"

[syntax.arrow]
operator = "=>"
scope = "storage.type.function.arrow.js"

[syntax.optional_chaining]
operator = "?."
scope = "keyword.operator.optional-chaining.js"

[syntax.nullish]
operator = "??"
scope = "keyword.operator.logical.js"

[syntax.jsx]
enabled = true
extensions = [".jsx"]

[syntax.jsx.tag]
scope = "entity.name.tag.jsx"

[syntax.jsx.attribute]
scope = "entity.other.attribute-name.jsx"

[indentation]
enabled = true
style = "spaces"
width = 2

[indentation.rules]
increase_after = [
  "{",
  "[",
  "("
]
decrease_before = [
  "}",
  "]",
  ")"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "latest"
supported = [
  "es5",
  "es2015",
  "es2016",
  "es2017",
  "es2018",
  "es2019",
  "es2020",
  "es2021",
  "es2022",
  "es2023",
  "es2024",
  "es2025",
  "latest"
]

[runtime]
enabled = true
auto_detect = true
default = "node"

[runtime.node]
command = "node"
arguments = []

[runtime.deno]
command = "deno"
arguments = [
  "run"
]

[runtime.bun]
command = "bun"
arguments = [
  "run"
]

[package]
enabled = true
manifest = "package.json"

[package.managers]
values = [
  "npm",
  "pnpm",
  "yarn",
  "bun"
]

[formatter]
enabled = true
provider = "prettier"
command = "prettier"

[formatter.arguments]
values = [
  "--write"
]

[lsp]
enabled = true
provider = "typescript-language-server"
command = "typescript-language-server"

[lsp.arguments]
values = [
  "--stdio"
]

[diagnostics]
enabled = true

[diagnostics.eslint]
enabled = true
command = "eslint"

[diagnostics.eslint.arguments]
values = [
  "--format",
  "json"
]

[debugger]
enabled = true
providers = [
  "node",
  "js-debug"
]

[repl]
enabled = true
command = "node"

[test]
enabled = true
auto_detect = true

[test.frameworks]
values = [
  "node:test",
  "jest",
  "vitest",
  "mocha",
  "ava"
]

[tasks]
run = [
  "node",
  "$file"
]

check = [
  "node",
  "--check",
  "$file"
]

format = [
  "prettier",
  "--write",
  "$file"
]

lint = [
  "eslint",
  "$file"
]

[environment]
NODE_ENV = true
NODE_PATH = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64",
  "ppc64",
  "s390x"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "browser"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}