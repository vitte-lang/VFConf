# VFConf — Vitte Foundation Configuration Language
# languages/kotlin.vf.conf
#
# Kotlin programming language definition.

[language]
id = "kotlin"
name = "Kotlin"
display_name = "Kotlin"
version = "1.0"
enabled = true
category = "general-purpose"
case_sensitive = true

[files]
extensions = [
  ".kt",
  ".kts"
]
filenames = [
  "settings.gradle.kts",
  "build.gradle.kts"
]
mime = [
  "text/x-kotlin"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
documentation = ["/**", "*/"]
nested_block = true

[strings]
double_quote = true
escape = "\\"
multiline = false
interpolation = true

[strings.raw]
enabled = true
delimiter = "\"\"\""
multiline = true
escape_sequences = false
interpolation = true

[strings.interpolation]
simple_prefix = "$"
expression_start = "${"
expression_end = "}"

[characters]
enabled = true
quote = "'"
escape = "\\"
unicode = true

[numbers]
decimal = true
hexadecimal = true
binary = true
octal = false
floating_point = true
scientific = true
digit_separator = "_"

[numbers.suffixes]
integer = [
  "L",
  "u",
  "U",
  "uL",
  "UL"
]

float = [
  "f",
  "F"
]

[keywords]
values = [
  "as",
  "break",
  "class",
  "continue",
  "do",
  "else",
  "false",
  "for",
  "fun",
  "if",
  "in",
  "interface",
  "is",
  "null",
  "object",
  "package",
  "return",
  "super",
  "this",
  "throw",
  "true",
  "try",
  "typealias",
  "typeof",
  "val",
  "var",
  "when",
  "while"
]

[keywords.soft]
values = [
  "by",
  "catch",
  "constructor",
  "delegate",
  "dynamic",
  "field",
  "file",
  "finally",
  "get",
  "import",
  "init",
  "param",
  "property",
  "receiver",
  "set",
  "setparam",
  "where"
]

[keywords.modifiers]
values = [
  "abstract",
  "actual",
  "annotation",
  "companion",
  "const",
  "crossinline",
  "data",
  "enum",
  "expect",
  "external",
  "final",
  "infix",
  "inline",
  "inner",
  "internal",
  "lateinit",
  "noinline",
  "open",
  "operator",
  "out",
  "override",
  "private",
  "protected",
  "public",
  "reified",
  "sealed",
  "suspend",
  "tailrec",
  "vararg",
  "value"
]

[keywords.types]
values = [
  "Any",
  "Boolean",
  "Byte",
  "Char",
  "Double",
  "Float",
  "Int",
  "Long",
  "Nothing",
  "Short",
  "String",
  "UInt",
  "ULong",
  "UByte",
  "UShort",
  "Unit"
]

[keywords.control]
values = [
  "break",
  "catch",
  "continue",
  "do",
  "else",
  "finally",
  "for",
  "if",
  "return",
  "throw",
  "try",
  "when",
  "while"
]

[keywords.declaration]
values = [
  "class",
  "fun",
  "interface",
  "object",
  "typealias",
  "val",
  "var"
]

[literals]
values = [
  "true",
  "false",
  "null"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "++",
  "--",
  "==",
  "!=",
  "===",
  "!==",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "?.",
  "?:",
  "!!",
  "..",
  "..<",
  "::",
  "->",
  "@"
]

[operators.words]
values = [
  "as",
  "as?",
  "in",
  "!in",
  "is",
  "!is"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
angles = ["<", ">"]
semicolon = ";"
comma = ","
colon = ":"
dot = "."

[annotations]
enabled = true
prefix = "@"

[syntax]
enabled = true
packages = true
imports = true
classes = true
interfaces = true
objects = true
functions = true
properties = true
variables = true
parameters = true
types = true
annotations = true
generics = true
lambdas = true
coroutines = true
extension_functions = true

[syntax.package]
scope = "entity.name.namespace.kotlin"

[syntax.class]
scope = "entity.name.type.class.kotlin"

[syntax.interface]
scope = "entity.name.type.interface.kotlin"

[syntax.object]
scope = "entity.name.type.object.kotlin"

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.kotlin"

[syntax.property]
scope = "variable.other.property.kotlin"

[syntax.variable]
scope = "variable.other.kotlin"

[syntax.parameter]
scope = "variable.parameter.kotlin"

[syntax.type]
scope = "entity.name.type.kotlin"

[syntax.annotation]
scope = "entity.name.type.annotation.kotlin"

[syntax.lambda]
operator = "->"
scope = "storage.type.function.kotlin"

[syntax.nullable]
operator = "?"
scope = "keyword.operator.nullable.kotlin"

[syntax.safe_call]
operator = "?."
scope = "keyword.operator.safe-call.kotlin"

[syntax.elvis]
operator = "?:"
scope = "keyword.operator.elvis.kotlin"

[syntax.not_null]
operator = "!!"
scope = "keyword.operator.not-null.kotlin"

[syntax.coroutines]
keywords = [
  "suspend"
]
scope = "storage.modifier.async.kotlin"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = [
  "{"
]
decrease_before = [
  "}"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[compiler]
enabled = true
auto_detect = true
default = "kotlinc"

[compiler.kotlinc]
command = "kotlinc"
arguments = []

[compiler.jvm]
command = "kotlinc"
arguments = [
  "-include-runtime"
]

[compiler.javascript]
command = "kotlinc-js"
arguments = []

[runtime]
enabled = true
default = "kotlin"

[runtime.kotlin]
command = "kotlin"
arguments = []

[runtime.java]
command = "java"
arguments = []

[build]
enabled = true

[build.gradle]
enabled = true
command = "gradle"
project_files = [
  "build.gradle",
  "build.gradle.kts",
  "settings.gradle",
  "settings.gradle.kts"
]

[build.maven]
enabled = true
command = "mvn"
project_file = "pom.xml"

[formatter]
enabled = true
provider = "ktlint"
command = "ktlint"

[formatter.arguments]
values = [
  "-F"
]

[lsp]
enabled = true
provider = "kotlin-language-server"
command = "kotlin-language-server"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
warnings = true
warnings_as_errors = false

[diagnostics.ktlint]
enabled = true
command = "ktlint"

[debugger]
enabled = true
providers = [
  "java-debug",
  "jdb"
]

[repl]
enabled = true
command = "kotlinc"

[repl.arguments]
values = []

[test]
enabled = true

[test.frameworks]
values = [
  "kotlin.test",
  "junit",
  "junit5",
  "kotest"
]

[tasks]
compile = [
  "kotlinc",
  "$file",
  "-include-runtime",
  "-d",
  "$output"
]

run = [
  "kotlin",
  "$main"
]

format = [
  "ktlint",
  "-F",
  "$file"
]

lint = [
  "ktlint",
  "$file"
]

gradle_build = [
  "gradle",
  "build"
]

gradle_test = [
  "gradle",
  "test"
]

[environment]
JAVA_HOME = true
KOTLIN_HOME = true
CLASSPATH = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64"
]

[platforms]
supported = [
  "jvm",
  "javascript",
  "wasm",
  "linux",
  "macos",
  "windows",
  "android",
  "ios"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}