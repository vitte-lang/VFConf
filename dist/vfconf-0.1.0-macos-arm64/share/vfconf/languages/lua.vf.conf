# VFConf — Vitte Foundation Configuration Language
# languages/lua.vf.conf
#
# Lua programming language definition.

[language]
id = "lua"
name = "Lua"
display_name = "Lua"
version = "1.0"
enabled = true
category = "scripting"
case_sensitive = true

[files]
extensions = [
  ".lua"
]
filenames = [
  ".luacheckrc"
]
mime = [
  "text/x-lua"
]

[files.shebang]
patterns = [
  "#!/usr/bin/lua",
  "#!/usr/bin/env lua",
  "#!/usr/bin/luajit",
  "#!/usr/bin/env luajit"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["--"]
block = ["--[[", "]]"]
nested_block = false

[comments.long]
enabled = true
start_pattern = "--\\[=*\\["
end_pattern = "\\]=*\\]"

[strings]
single_quote = true
double_quote = true
escape = "\\"
multiline = false

[strings.long]
enabled = true
start_pattern = "\\[=*\\["
end_pattern = "\\]=*\\]"
multiline = true
escape_sequences = false

[numbers]
decimal = true
hexadecimal = true
floating_point = true
scientific = true
hexadecimal_float = true

[numbers.patterns]
decimal = "[0-9]+"
hexadecimal = "0[xX][0-9A-Fa-f]+"
float = "[0-9]+\\.[0-9]*"
scientific = "[0-9]+(\\.[0-9]*)?[eE][+-]?[0-9]+"

[keywords]
values = [
  "and",
  "break",
  "do",
  "else",
  "elseif",
  "end",
  "false",
  "for",
  "function",
  "goto",
  "if",
  "in",
  "local",
  "nil",
  "not",
  "or",
  "repeat",
  "return",
  "then",
  "true",
  "until",
  "while"
]

[keywords.control]
values = [
  "break",
  "do",
  "else",
  "elseif",
  "for",
  "goto",
  "if",
  "in",
  "repeat",
  "return",
  "then",
  "until",
  "while"
]

[keywords.declaration]
values = [
  "function",
  "local"
]

[keywords.logical]
values = [
  "and",
  "not",
  "or"
]

[literals]
values = [
  "true",
  "false",
  "nil"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "//",
  "%",
  "^",
  "#",
  "&",
  "~",
  "|",
  "<<",
  ">>",
  "==",
  "~=",
  "<",
  "<=",
  ">",
  ">=",
  "=",
  "..",
  "..."
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","
colon = ":"
double_colon = "::"
dot = "."

[syntax]
enabled = true
functions = true
local_functions = true
variables = true
local_variables = true
parameters = true
tables = true
fields = true
methods = true
labels = true
varargs = true

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.lua"

[syntax.local_function]
scope = "entity.name.function.local.lua"

[syntax.variable]
scope = "variable.other.lua"

[syntax.local_variable]
scope = "variable.other.local.lua"

[syntax.parameter]
scope = "variable.parameter.lua"

[syntax.table]
scope = "meta.table.lua"

[syntax.field]
scope = "variable.other.member.lua"

[syntax.method]
scope = "entity.name.function.method.lua"

[syntax.label]
pattern = "::[A-Za-z_][A-Za-z0-9_]*::"
scope = "entity.name.label.lua"

[syntax.varargs]
pattern = "\\.\\.\\."
scope = "variable.parameter.varargs.lua"

[syntax.method_call]
operator = ":"
scope = "punctuation.accessor.lua"

[syntax.concatenation]
operator = ".."
scope = "keyword.operator.concatenation.lua"

[syntax.length]
operator = "#"
scope = "keyword.operator.length.lua"

[indentation]
enabled = true
style = "spaces"
width = 2

[indentation.rules]
increase_after = [
  "do",
  "function",
  "then",
  "repeat"
]
decrease_before = [
  "end",
  "until",
  "else",
  "elseif"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "5.4"
supported = [
  "5.1",
  "5.2",
  "5.3",
  "5.4"
]

[runtime]
enabled = true
auto_detect = true
default = "lua"

[runtime.lua]
command = "lua"
arguments = []

[runtime.lua51]
command = "lua5.1"
arguments = []

[runtime.lua52]
command = "lua5.2"
arguments = []

[runtime.lua53]
command = "lua5.3"
arguments = []

[runtime.lua54]
command = "lua5.4"
arguments = []

[runtime.luajit]
command = "luajit"
arguments = []

[compiler]
enabled = true
default = "luac"

[compiler.luac]
command = "luac"
arguments = [
  "-o"
]

[package]
enabled = true

[package.managers]
values = [
  "luarocks"
]

[formatter]
enabled = true
provider = "stylua"
command = "stylua"

[formatter.arguments]
values = []

[lsp]
enabled = true
provider = "lua-language-server"
command = "lua-language-server"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.luacheck]
enabled = true
command = "luacheck"

[diagnostics.compiler]
enabled = true
command = "luac"

[diagnostics.compiler.arguments]
values = [
  "-p"
]

[debugger]
enabled = true
providers = [
  "local-lua-debugger",
  "mobdebug"
]

[repl]
enabled = true
command = "lua"

[test]
enabled = true
auto_detect = true

[test.frameworks]
values = [
  "busted",
  "luaunit"
]

[tasks]
run = [
  "lua",
  "$file"
]

check = [
  "luac",
  "-p",
  "$file"
]

compile = [
  "luac",
  "-o",
  "$output",
  "$file"
]

format = [
  "stylua",
  "$file"
]

lint = [
  "luacheck",
  "$file"
]

[environment]
LUA_PATH = true
LUA_CPATH = true
LUA_INIT = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "solaris",
  "embedded"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}