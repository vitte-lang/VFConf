# VFConf — Vitte Foundation Configuration Language
# languages/ocaml.vf.conf
#
# OCaml programming language definition.

[language]
id = "ocaml"
name = "OCaml"
display_name = "OCaml"
version = "1.0"
enabled = true
category = "functional"
case_sensitive = true

[files]
extensions = [
  ".ml",
  ".mli",
  ".mll",
  ".mly",
  ".mlt"
]
filenames = [
  "dune",
  "dune-project"
]
mime = [
  "text/x-ocaml"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = []
block = ["(*", "*)"]
nested_block = true
documentation = ["(**", "*)"]

[strings]
double_quote = true
escape = "\\"
multiline = true

[strings.quoted]
enabled = true
start_pattern = "\\{[A-Za-z_]*\\|"
end_pattern = "\\|[A-Za-z_]*\\}"
multiline = true
escape_sequences = false

[characters]
enabled = true
quote = "'"
escape = "\\"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"

[numbers.suffixes]
integer = [
  "l",
  "L",
  "n"
]

[keywords]
values = [
  "and",
  "as",
  "assert",
  "begin",
  "class",
  "constraint",
  "do",
  "done",
  "downto",
  "else",
  "end",
  "exception",
  "external",
  "false",
  "for",
  "fun",
  "function",
  "functor",
  "if",
  "in",
  "include",
  "inherit",
  "initializer",
  "lazy",
  "let",
  "match",
  "method",
  "module",
  "mutable",
  "new",
  "nonrec",
  "object",
  "of",
  "open",
  "or",
  "private",
  "rec",
  "sig",
  "struct",
  "then",
  "to",
  "true",
  "try",
  "type",
  "val",
  "virtual",
  "when",
  "while",
  "with"
]

[keywords.control]
values = [
  "assert",
  "do",
  "done",
  "downto",
  "else",
  "for",
  "if",
  "lazy",
  "match",
  "then",
  "to",
  "try",
  "when",
  "while",
  "with"
]

[keywords.declaration]
values = [
  "class",
  "exception",
  "external",
  "let",
  "method",
  "module",
  "type",
  "val"
]

[keywords.function]
values = [
  "fun",
  "function",
  "functor"
]

[keywords.module]
values = [
  "functor",
  "include",
  "module",
  "open",
  "sig",
  "struct"
]

[keywords.modifiers]
values = [
  "mutable",
  "nonrec",
  "private",
  "rec",
  "virtual"
]

[keywords.types]
values = [
  "bool",
  "bytes",
  "char",
  "exn",
  "float",
  "int",
  "int32",
  "int64",
  "list",
  "nativeint",
  "option",
  "result",
  "string",
  "unit"
]

[literals]
values = [
  "true",
  "false"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "+.",
  "-.",
  "*.",
  "/.",
  "=",
  "<>",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "not",
  "land",
  "lor",
  "lxor",
  "lsl",
  "lsr",
  "asr",
  ":=",
  "!",
  "@",
  "^",
  "|>",
  "@@",
  "->",
  "<-",
  "=>",
  "::",
  ":",
  ";",
  ";;",
  "|",
  "&"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
arrays = ["[|", "|]"]
semicolon = ";"
double_semicolon = ";;"
comma = ","
colon = ":"
dot = "."

[attributes]
enabled = true
attribute_start = "[@"
extension_start = "[%"
item_attribute_start = "[@@"
floating_attribute_start = "[@@@"

[syntax]
enabled = true
values = true
functions = true
types = true
constructors = true
variants = true
records = true
modules = true
module_types = true
classes = true
methods = true
objects = true
labels = true
polymorphic_variants = true
attributes = true
extensions = true

[syntax.value]
scope = "variable.other.ocaml"

[syntax.function]
scope = "entity.name.function.ocaml"

[syntax.type]
scope = "entity.name.type.ocaml"

[syntax.constructor]
pattern = "[A-Z][A-Za-z0-9_']*"
scope = "entity.name.type.variant.ocaml"

[syntax.variant]
scope = "entity.name.type.variant.ocaml"

[syntax.record]
scope = "meta.record.ocaml"

[syntax.record_field]
scope = "variable.other.member.ocaml"

[syntax.module]
pattern = "[A-Z][A-Za-z0-9_']*"
scope = "entity.name.namespace.ocaml"

[syntax.module_type]
scope = "entity.name.type.module.ocaml"

[syntax.class]
scope = "entity.name.type.class.ocaml"

[syntax.method]
scope = "entity.name.function.method.ocaml"

[syntax.label]
pattern = "[~?][a-z_][A-Za-z0-9_']*"
scope = "variable.parameter.label.ocaml"

[syntax.polymorphic_variant]
pattern = "`[A-Z][A-Za-z0-9_']*"
scope = "entity.name.type.variant.polymorphic.ocaml"

[syntax.type_variable]
pattern = "'[a-z_][A-Za-z0-9_']*"
scope = "entity.name.type.parameter.ocaml"

[syntax.attribute]
scope = "entity.other.attribute-name.ocaml"

[syntax.extension]
scope = "entity.other.attribute-name.extension.ocaml"

[syntax.pipeline]
operator = "|>"
scope = "keyword.operator.pipeline.ocaml"

[indentation]
enabled = true
style = "spaces"
width = 2

[indentation.rules]
increase_after = [
  "begin",
  "do",
  "else",
  "fun",
  "function",
  "match",
  "object",
  "sig",
  "struct",
  "then",
  "try",
  "with"
]

decrease_before = [
  "done",
  "end",
  "else",
  "with"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["[|", "|]"],
  ["{", "}"]
]

[compiler]
enabled = true
auto_detect = true
default = "ocamlopt"

[compiler.ocamlc]
command = "ocamlc"
arguments = [
  "-w",
  "+a"
]

[compiler.ocamlopt]
command = "ocamlopt"
arguments = [
  "-w",
  "+a"
]

[build]
enabled = true
default = "dune"

[build.dune]
command = "dune"
project_files = [
  "dune-project",
  "dune"
]

[build.dune.commands]
build = [
  "dune",
  "build"
]

check = [
  "dune",
  "build",
  "@check"
]

test = [
  "dune",
  "runtest"
]

clean = [
  "dune",
  "clean"
]

install = [
  "dune",
  "install"
]

[package]
enabled = true

[package.managers]
values = [
  "opam"
]

[package.opam]
command = "opam"

[formatter]
enabled = true
provider = "ocamlformat"
command = "ocamlformat"

[formatter.arguments]
values = [
  "--enable-outside-detected-project",
  "--inplace"
]

[lsp]
enabled = true
provider = "ocaml-lsp-server"
command = "ocamllsp"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
warnings = true
warnings_as_errors = false

[diagnostics.dune]
enabled = true
command = "dune"

[diagnostics.merlin]
enabled = true

[repl]
enabled = true
command = "utop"

[repl.fallback]
command = "ocaml"

[debugger]
enabled = true
providers = [
  "ocamldebug"
]

[test]
enabled = true
command = "dune"

[test.arguments]
values = [
  "runtest"
]

[tasks]
compile_bytecode = [
  "ocamlc",
  "$file",
  "-o",
  "$output"
]

compile_native = [
  "ocamlopt",
  "$file",
  "-o",
  "$output"
]

build = [
  "dune",
  "build"
]

check = [
  "dune",
  "build",
  "@check"
]

test = [
  "dune",
  "runtest"
]

format = [
  "ocamlformat",
  "--enable-outside-detected-project",
  "--inplace",
  "$file"
]

[environment]
OPAM_SWITCH_PREFIX = true
OCAMLPATH = true
CAML_LD_LIBRARY_PATH = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64",
  "powerpc",
  "powerpc64",
  "s390x"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $build.enabled == true {
  required_path += ["build.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}