# VFConf — Vitte Foundation Configuration Language
# languages/python.vf.conf
#
# Python programming language definition.

[language]
id = "python"
name = "Python"
display_name = "Python"
version = "1.0"
enabled = true
category = "scripting"
case_sensitive = true

[files]
extensions = [
  ".py",
  ".pyw",
  ".pyi"
]
filenames = [
  "SConstruct",
  "SConscript"
]
mime = [
  "text/x-python",
  "application/x-python-code"
]

[files.shebang]
patterns = [
  "#!/usr/bin/python",
  "#!/usr/bin/python3",
  "#!/usr/bin/env python",
  "#!/usr/bin/env python3"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["#"]
block = []
documentation = [
  "\"\"\"",
  "'''"
]

[strings]
single_quote = true
double_quote = true
escape = "\\"
multiline = false

[strings.triple_single]
enabled = true
delimiter = "'''"
multiline = true
escape_sequences = true

[strings.triple_double]
enabled = true
delimiter = "\"\"\""
multiline = true
escape_sequences = true

[strings.prefixes]
values = [
  "r",
  "R",
  "u",
  "U",
  "b",
  "B",
  "f",
  "F",
  "fr",
  "Fr",
  "fR",
  "FR",
  "rf",
  "rF",
  "Rf",
  "RF",
  "br",
  "Br",
  "bR",
  "BR",
  "rb",
  "rB",
  "Rb",
  "RB"
]

[strings.formatted]
enabled = true
prefixes = [
  "f",
  "F",
  "fr",
  "Fr",
  "fR",
  "FR",
  "rf",
  "rF",
  "Rf",
  "RF"
]
interpolation_start = "{"
interpolation_end = "}"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
complex = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"
imaginary = "([0-9][0-9_]*(\\.[0-9_]*)?|\\.[0-9_]+)([eE][+-]?[0-9_]+)?[jJ]"

[keywords]
values = [
  "False",
  "None",
  "True",
  "and",
  "as",
  "assert",
  "async",
  "await",
  "break",
  "class",
  "continue",
  "def",
  "del",
  "elif",
  "else",
  "except",
  "finally",
  "for",
  "from",
  "global",
  "if",
  "import",
  "in",
  "is",
  "lambda",
  "nonlocal",
  "not",
  "or",
  "pass",
  "raise",
  "return",
  "try",
  "while",
  "with",
  "yield"
]

[keywords.soft]
values = [
  "match",
  "case",
  "_",
  "type"
]

[keywords.control]
values = [
  "assert",
  "break",
  "continue",
  "elif",
  "else",
  "except",
  "finally",
  "for",
  "if",
  "pass",
  "raise",
  "return",
  "try",
  "while",
  "with",
  "yield"
]

[keywords.declaration]
values = [
  "class",
  "def",
  "global",
  "lambda",
  "nonlocal",
  "type"
]

[keywords.module]
values = [
  "as",
  "from",
  "import"
]

[keywords.async]
values = [
  "async",
  "await"
]

[keywords.logical]
values = [
  "and",
  "in",
  "is",
  "not",
  "or"
]

[literals]
values = [
  "True",
  "False",
  "None",
  "NotImplemented",
  "Ellipsis"
]

[builtins]
values = [
  "abs",
  "aiter",
  "all",
  "anext",
  "any",
  "ascii",
  "bin",
  "bool",
  "breakpoint",
  "bytearray",
  "bytes",
  "callable",
  "chr",
  "classmethod",
  "compile",
  "complex",
  "delattr",
  "dict",
  "dir",
  "divmod",
  "enumerate",
  "eval",
  "exec",
  "filter",
  "float",
  "format",
  "frozenset",
  "getattr",
  "globals",
  "hasattr",
  "hash",
  "help",
  "hex",
  "id",
  "input",
  "int",
  "isinstance",
  "issubclass",
  "iter",
  "len",
  "list",
  "locals",
  "map",
  "max",
  "memoryview",
  "min",
  "next",
  "object",
  "oct",
  "open",
  "ord",
  "pow",
  "print",
  "property",
  "range",
  "repr",
  "reversed",
  "round",
  "set",
  "setattr",
  "slice",
  "sorted",
  "staticmethod",
  "str",
  "sum",
  "super",
  "tuple",
  "type",
  "vars",
  "zip",
  "__import__"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "**",
  "/",
  "//",
  "%",
  "@",
  "<<",
  ">>",
  "&",
  "|",
  "^",
  "~",
  ":=",
  "<",
  "<=",
  ">",
  ">=",
  "==",
  "!=",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "//=",
  "%=",
  "@=",
  "&=",
  "|=",
  "^=",
  ">>=",
  "<<=",
  "**=",
  "->"
]

[operators.words]
values = [
  "and",
  "or",
  "not",
  "in",
  "is",
  "not in",
  "is not"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
comma = ","
colon = ":"
semicolon = ";"
dot = "."
ellipsis = "..."

[decorators]
enabled = true
prefix = "@"

[syntax]
enabled = true
modules = true
classes = true
functions = true
async_functions = true
methods = true
variables = true
constants = true
parameters = true
decorators = true
annotations = true
type_parameters = true
comprehensions = true
generators = true
pattern_matching = true

[syntax.module]
scope = "entity.name.namespace.python"

[syntax.class]
scope = "entity.name.type.class.python"

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.python"

[syntax.async_function]
scope = "entity.name.function.async.python"

[syntax.method]
scope = "entity.name.function.method.python"

[syntax.variable]
scope = "variable.other.python"

[syntax.constant]
scope = "variable.other.constant.python"

[syntax.parameter]
scope = "variable.parameter.python"

[syntax.decorator]
pattern = "@[A-Za-z_][A-Za-z0-9_.]*"
scope = "entity.name.function.decorator.python"

[syntax.annotation]
scope = "entity.name.type.python"

[syntax.self]
values = [
  "self",
  "cls"
]
scope = "variable.language.special.python"

[syntax.pattern_matching]
keywords = [
  "match",
  "case"
]
scope = "keyword.control.match.python"

[syntax.walrus]
operator = ":="
scope = "keyword.operator.assignment.python"

[syntax.lambda]
keyword = "lambda"
scope = "storage.type.function.lambda.python"

[syntax.comprehension]
keywords = [
  "for",
  "if",
  "in",
  "async"
]

[indentation]
enabled = true
significant = true
style = "spaces"
width = 4
tab_width = 4
allow_tabs = false

[indentation.rules]
increase_after = [":"]
dedent_keywords = [
  "elif",
  "else",
  "except",
  "finally",
  "case"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "3"
supported = [
  "3.9",
  "3.10",
  "3.11",
  "3.12",
  "3.13",
  "3.14"
]

[runtime]
enabled = true
auto_detect = true
default = "python3"

[runtime.python3]
command = "python3"
arguments = []

[runtime.python]
command = "python"
arguments = []

[package]
enabled = true

[package.managers]
values = [
  "pip",
  "pipx",
  "uv",
  "poetry",
  "pdm"
]

[package.files]
values = [
  "pyproject.toml",
  "requirements.txt",
  "requirements-dev.txt",
  "Pipfile",
  "poetry.lock",
  "pdm.lock",
  "uv.lock"
]

[virtual_environment]
enabled = true
auto_detect = true

[virtual_environment.directories]
values = [
  ".venv",
  "venv",
  "env"
]

[formatter]
enabled = true
provider = "black"
command = "black"

[formatter.arguments]
values = [
  "$file"
]

[formatter.alternatives]
values = [
  "ruff",
  "autopep8",
  "yapf"
]

[lsp]
enabled = true
provider = "pyright"
command = "pyright-langserver"

[lsp.arguments]
values = [
  "--stdio"
]

[lsp.alternatives]
values = [
  "pylsp",
  "basedpyright"
]

[diagnostics]
enabled = true

[diagnostics.ruff]
enabled = true
command = "ruff"

[diagnostics.ruff.arguments]
values = [
  "check",
  "$file"
]

[diagnostics.mypy]
enabled = true
command = "mypy"

[diagnostics.mypy.arguments]
values = [
  "$file"
]

[diagnostics.runtime]
enabled = true
command = "python3"

[diagnostics.runtime.arguments]
values = [
  "-m",
  "py_compile",
  "$file"
]

[debugger]
enabled = true
providers = [
  "debugpy",
  "pdb"
]

[repl]
enabled = true
command = "python3"

[test]
enabled = true
auto_detect = true

[test.frameworks]
values = [
  "pytest",
  "unittest"
]

[tasks]
run = [
  "python3",
  "$file"
]

check = [
  "python3",
  "-m",
  "py_compile",
  "$file"
]

format = [
  "black",
  "$file"
]

lint = [
  "ruff",
  "check",
  "$file"
]

typecheck = [
  "mypy",
  "$file"
]

test = [
  "python3",
  "-m",
  "pytest"
]

[environment]
PYTHONPATH = true
PYTHONHOME = true
VIRTUAL_ENV = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64",
  "ppc64",
  "s390x"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "aix",
  "wasm"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}
