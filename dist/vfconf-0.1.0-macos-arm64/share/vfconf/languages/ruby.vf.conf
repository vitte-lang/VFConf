# VFConf — Vitte Foundation Configuration Language
# languages/ruby.vf.conf
#
# Ruby programming language definition.

[language]
id = "ruby"
name = "Ruby"
display_name = "Ruby"
version = "1.0"
enabled = true
category = "scripting"
case_sensitive = true

[files]
extensions = [
  ".rb",
  ".rbw",
  ".rake",
  ".gemspec"
]
filenames = [
  "Gemfile",
  "Rakefile",
  "Guardfile",
  "Capfile",
  "Vagrantfile"
]
mime = [
  "text/x-ruby",
  "application/x-ruby"
]

[files.shebang]
patterns = [
  "#!/usr/bin/ruby",
  "#!/usr/bin/env ruby"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["#"]
block = ["=begin", "=end"]
nested_block = false
documentation = [
  "=begin",
  "=end"
]

[strings]
single_quote = true
double_quote = true
escape = "\\"
multiline = true

[strings.single]
interpolation = false
escape_sequences = true

[strings.double]
interpolation = true
escape_sequences = true

[strings.interpolation]
start = "#{"
end = "}"

[strings.percent]
enabled = true
forms = [
  "%q",
  "%Q",
  "%w",
  "%W",
  "%i",
  "%I",
  "%x",
  "%r",
  "%s"
]

[strings.heredoc]
enabled = true
operator = "<<"
indent_operator = "<<-"
squiggly_operator = "<<~"
multiline = true
interpolation = true

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
rational = true
complex = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO]?[0-7_]+"
binary = "0[bB][01_]+"

[numbers.suffixes]
values = [
  "r",
  "i",
  "ri"
]

[keywords]
values = [
  "BEGIN",
  "END",
  "alias",
  "and",
  "begin",
  "break",
  "case",
  "class",
  "def",
  "defined?",
  "do",
  "else",
  "elsif",
  "end",
  "ensure",
  "false",
  "for",
  "if",
  "in",
  "module",
  "next",
  "nil",
  "not",
  "or",
  "redo",
  "rescue",
  "retry",
  "return",
  "self",
  "super",
  "then",
  "true",
  "undef",
  "unless",
  "until",
  "when",
  "while",
  "yield"
]

[keywords.control]
values = [
  "begin",
  "break",
  "case",
  "do",
  "else",
  "elsif",
  "ensure",
  "for",
  "if",
  "in",
  "next",
  "redo",
  "rescue",
  "retry",
  "return",
  "then",
  "unless",
  "until",
  "when",
  "while",
  "yield"
]

[keywords.declaration]
values = [
  "alias",
  "class",
  "def",
  "module",
  "undef"
]

[keywords.logical]
values = [
  "and",
  "not",
  "or"
]

[literals]
values = [
  "true",
  "false",
  "nil",
  "self"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "**",
  "+@",
  "-@",
  "==",
  "!=",
  "===",
  "=~",
  "!~",
  "<",
  "<=",
  ">",
  ">=",
  "<=>",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "**=",
  "&&=",
  "||=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  "=>",
  "->",
  "&.",
  "::",
  "..",
  "...",
  "?"
]

[operators.words]
values = [
  "and",
  "or",
  "not"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","
colon = ":"
double_colon = "::"
dot = "."

[variables]
enabled = true

[variables.local]
pattern = "[a-z_][A-Za-z0-9_]*"
scope = "variable.other.local.ruby"

[variables.instance]
pattern = "@[A-Za-z_][A-Za-z0-9_]*"
scope = "variable.other.instance.ruby"

[variables.class]
pattern = "@@[A-Za-z_][A-Za-z0-9_]*"
scope = "variable.other.class.ruby"

[variables.global]
pattern = "\\$[A-Za-z_][A-Za-z0-9_]*"
scope = "variable.other.global.ruby"

[variables.constants]
pattern = "[A-Z][A-Za-z0-9_]*"
scope = "variable.other.constant.ruby"

[symbols]
enabled = true
prefix = ":"
pattern = ":[A-Za-z_][A-Za-z0-9_!?=]*"
scope = "constant.other.symbol.ruby"

[regex]
enabled = true
delimiter = "/"
escape = "\\"

[regex.options]
values = [
  "i",
  "m",
  "x",
  "o",
  "n",
  "e",
  "s",
  "u"
]

[syntax]
enabled = true
classes = true
modules = true
methods = true
singleton_methods = true
variables = true
constants = true
parameters = true
blocks = true
lambdas = true
symbols = true
regex = true
interpolation = true

[syntax.class]
scope = "entity.name.type.class.ruby"

[syntax.module]
scope = "entity.name.namespace.ruby"

[syntax.method]
pattern = "[A-Za-z_][A-Za-z0-9_!?=]*(?=\\s*\\()"
scope = "entity.name.function.ruby"

[syntax.singleton_method]
scope = "entity.name.function.singleton.ruby"

[syntax.parameter]
scope = "variable.parameter.ruby"

[syntax.block_parameter]
start = "|"
end = "|"
scope = "variable.parameter.block.ruby"

[syntax.constant]
scope = "variable.other.constant.ruby"

[syntax.lambda]
operators = [
  "->",
  "lambda"
]
scope = "storage.type.function.lambda.ruby"

[syntax.block]
keywords = [
  "do",
  "end"
]
scope = "meta.block.ruby"

[syntax.safe_navigation]
operator = "&."
scope = "punctuation.accessor.safe.ruby"

[syntax.range]
operators = [
  "..",
  "..."
]
scope = "keyword.operator.range.ruby"

[syntax.hash_rocket]
operator = "=>"
scope = "keyword.operator.association.ruby"

[indentation]
enabled = true
style = "spaces"
width = 2

[indentation.rules]
increase_after = [
  "begin",
  "case",
  "class",
  "def",
  "do",
  "for",
  "if",
  "module",
  "unless",
  "until",
  "while"
]

decrease_before = [
  "end",
  "else",
  "elsif",
  "ensure",
  "rescue",
  "when"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "3"
supported = [
  "2.7",
  "3.0",
  "3.1",
  "3.2",
  "3.3",
  "3.4",
  "3"
]

[runtime]
enabled = true
auto_detect = true
default = "ruby"

[runtime.ruby]
command = "ruby"
arguments = []

[runtime.jruby]
command = "jruby"
arguments = []

[runtime.truffleruby]
command = "truffleruby"
arguments = []

[package]
enabled = true
manifest = "Gemfile"

[package.bundler]
enabled = true
command = "bundle"

[package.rubygems]
enabled = true
command = "gem"

[build]
enabled = true

[build.rake]
enabled = true
command = "rake"
project_file = "Rakefile"

[formatter]
enabled = true
provider = "rubocop"
command = "rubocop"

[formatter.arguments]
values = [
  "-A",
  "$file"
]

[lsp]
enabled = true
provider = "ruby-lsp"
command = "ruby-lsp"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.syntax]
enabled = true
command = "ruby"

[diagnostics.syntax.arguments]
values = [
  "-c",
  "$file"
]

[diagnostics.rubocop]
enabled = true
command = "rubocop"

[diagnostics.rubocop.arguments]
values = [
  "$file"
]

[debugger]
enabled = true
providers = [
  "rdbg",
  "byebug"
]

[repl]
enabled = true
command = "irb"

[test]
enabled = true
auto_detect = true

[test.frameworks]
values = [
  "minitest",
  "rspec",
  "test-unit"
]

[tasks]
run = [
  "ruby",
  "$file"
]

check = [
  "ruby",
  "-c",
  "$file"
]

format = [
  "rubocop",
  "-A",
  "$file"
]

lint = [
  "rubocop",
  "$file"
]

test = [
  "bundle",
  "exec",
  "rake",
  "test"
]

[environment]
GEM_HOME = true
GEM_PATH = true
RUBYLIB = true
RUBYOPT = true
BUNDLE_GEMFILE = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64",
  "ppc64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}