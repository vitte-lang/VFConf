# VFConf — Vitte Foundation Configuration Language
# languages/swift.vf.conf
#
# Swift programming language definition.

[language]
id = "swift"
name = "Swift"
display_name = "Swift"
version = "1.0"
enabled = true
category = "general-purpose"
case_sensitive = true

[files]
extensions = [
  ".swift"
]
filenames = [
  "Package.swift"
]
mime = [
  "text/x-swift"
]

[files.shebang]
patterns = [
  "#!/usr/bin/swift",
  "#!/usr/bin/env swift"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
nested_block = true
documentation = [
  "///",
  "/**"
]

[strings]
double_quote = true
escape = "\\"
multiline = false
interpolation = true

[strings.multiline]
enabled = true
delimiter = "\"\"\""
multiline = true
interpolation = true

[strings.raw]
enabled = true
hash_delimiters = true
interpolation = true
multiline = true

[strings.interpolation]
start = "\\("
end = ")"

[characters]
enabled = false

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"

[keywords]
values = [
  "associatedtype",
  "borrowing",
  "break",
  "case",
  "catch",
  "class",
  "consume",
  "consuming",
  "continue",
  "convenience",
  "copy",
  "default",
  "defer",
  "deinit",
  "didSet",
  "distributed",
  "do",
  "dynamic",
  "else",
  "enum",
  "extension",
  "fallthrough",
  "fileprivate",
  "final",
  "for",
  "func",
  "get",
  "guard",
  "if",
  "import",
  "indirect",
  "infix",
  "init",
  "inout",
  "internal",
  "is",
  "isolated",
  "lazy",
  "let",
  "macro",
  "mutating",
  "nonisolated",
  "nonmutating",
  "open",
  "operator",
  "optional",
  "override",
  "package",
  "postfix",
  "precedencegroup",
  "prefix",
  "private",
  "protocol",
  "public",
  "repeat",
  "required",
  "rethrows",
  "return",
  "set",
  "some",
  "static",
  "struct",
  "subscript",
  "super",
  "switch",
  "throws",
  "typealias",
  "unowned",
  "var",
  "weak",
  "where",
  "while",
  "willSet"
]

[keywords.control]
values = [
  "break",
  "case",
  "catch",
  "continue",
  "default",
  "defer",
  "do",
  "else",
  "fallthrough",
  "for",
  "guard",
  "if",
  "repeat",
  "return",
  "switch",
  "while"
]

[keywords.declaration]
values = [
  "associatedtype",
  "class",
  "deinit",
  "enum",
  "extension",
  "func",
  "import",
  "init",
  "let",
  "macro",
  "operator",
  "precedencegroup",
  "protocol",
  "struct",
  "subscript",
  "typealias",
  "var"
]

[keywords.access]
values = [
  "fileprivate",
  "internal",
  "open",
  "package",
  "private",
  "public"
]

[keywords.modifiers]
values = [
  "borrowing",
  "class",
  "convenience",
  "consuming",
  "distributed",
  "dynamic",
  "final",
  "indirect",
  "inout",
  "isolated",
  "lazy",
  "mutating",
  "nonisolated",
  "nonmutating",
  "optional",
  "override",
  "required",
  "static",
  "unowned",
  "weak"
]

[keywords.async]
values = [
  "async",
  "await"
]

[keywords.errors]
values = [
  "throw",
  "throws",
  "rethrows",
  "try"
]

[keywords.types]
values = [
  "Any",
  "AnyObject",
  "Bool",
  "Character",
  "Double",
  "Float",
  "Int",
  "Int8",
  "Int16",
  "Int32",
  "Int64",
  "Never",
  "String",
  "UInt",
  "UInt8",
  "UInt16",
  "UInt32",
  "UInt64",
  "Void"
]

[literals]
values = [
  "true",
  "false",
  "nil"
]

[operators]
values = [
  "=",
  "+",
  "-",
  "*",
  "/",
  "%",
  "==",
  "!=",
  "===",
  "!==",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  "??",
  "??=",
  "?",
  "...",
  "..<",
  "->",
  "."
]

[operators.words]
values = [
  "as",
  "as?",
  "as!",
  "is",
  "try",
  "try?",
  "try!",
  "await"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
angles = ["<", ">"]
semicolon = ";"
comma = ","
colon = ":"
dot = "."

[attributes]
enabled = true
prefix = "@"

[directives]
enabled = true
prefix = "#"

[directives.values]
values = [
  "#available",
  "#assert",
  "#colorLiteral",
  "#column",
  "#dsohandle",
  "#else",
  "#elseif",
  "#endif",
  "#error",
  "#externalMacro",
  "#file",
  "#fileID",
  "#fileLiteral",
  "#filePath",
  "#function",
  "#if",
  "#imageLiteral",
  "#keyPath",
  "#line",
  "#selector",
  "#sourceLocation",
  "#unavailable",
  "#warning"
]

[syntax]
enabled = true
modules = true
classes = true
structs = true
enums = true
protocols = true
extensions = true
functions = true
methods = true
initializers = true
deinitializers = true
properties = true
variables = true
constants = true
parameters = true
generics = true
attributes = true
directives = true
closures = true
async = true
macros = true
actors = true

[syntax.module]
scope = "entity.name.namespace.swift"

[syntax.class]
scope = "entity.name.type.class.swift"

[syntax.struct]
scope = "entity.name.type.struct.swift"

[syntax.enum]
scope = "entity.name.type.enum.swift"

[syntax.protocol]
scope = "entity.name.type.protocol.swift"

[syntax.extension]
scope = "entity.name.type.extension.swift"

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.swift"

[syntax.method]
scope = "entity.name.function.method.swift"

[syntax.initializer]
keyword = "init"
scope = "entity.name.function.init.swift"

[syntax.deinitializer]
keyword = "deinit"
scope = "entity.name.function.deinit.swift"

[syntax.property]
scope = "variable.other.property.swift"

[syntax.variable]
scope = "variable.other.swift"

[syntax.constant]
scope = "variable.other.constant.swift"

[syntax.parameter]
scope = "variable.parameter.swift"

[syntax.generic]
scope = "entity.name.type.parameter.swift"

[syntax.attribute]
scope = "entity.other.attribute-name.swift"

[syntax.directive]
scope = "keyword.control.directive.swift"

[syntax.closure]
operator = "in"
scope = "storage.type.function.closure.swift"

[syntax.optional]
operator = "?"
scope = "keyword.operator.optional.swift"

[syntax.force_unwrap]
operator = "!"
scope = "keyword.operator.force-unwrap.swift"

[syntax.nil_coalescing]
operator = "??"
scope = "keyword.operator.nil-coalescing.swift"

[syntax.range]
operators = [
  "...",
  "..<"
]
scope = "keyword.operator.range.swift"

[syntax.async]
keywords = [
  "async",
  "await"
]
scope = "storage.modifier.async.swift"

[syntax.error_handling]
keywords = [
  "throw",
  "throws",
  "rethrows",
  "try"
]
scope = "keyword.control.exception.swift"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[compiler]
enabled = true
auto_detect = true
default = "swiftc"

[compiler.swiftc]
command = "swiftc"
arguments = []

[runtime]
enabled = true
default = "swift"

[runtime.swift]
command = "swift"
arguments = []

[build]
enabled = true
default = "swift-package-manager"

[build.swift_package_manager]
command = "swift"
manifest = "Package.swift"

[build.swift_package_manager.commands]
build = [
  "swift",
  "build"
]

run = [
  "swift",
  "run"
]

test = [
  "swift",
  "test"
]

clean = [
  "swift",
  "package",
  "clean"
]

release = [
  "swift",
  "build",
  "-c",
  "release"
]

[package]
enabled = true
manager = "swift-package-manager"
manifest = "Package.swift"
resolved = "Package.resolved"

[formatter]
enabled = true
provider = "swift-format"
command = "swift-format"

[formatter.arguments]
values = [
  "format",
  "--in-place"
]

[lsp]
enabled = true
provider = "sourcekit-lsp"
command = "sourcekit-lsp"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
command = "swiftc"
warnings = true
warnings_as_errors = false

[diagnostics.swiftlint]
enabled = true
command = "swiftlint"

[debugger]
enabled = true
providers = [
  "lldb"
]

[repl]
enabled = true
command = "swift"

[test]
enabled = true
command = "swift"

[test.arguments]
values = [
  "test"
]

[tasks]
compile = [
  "swiftc",
  "$file",
  "-o",
  "$output"
]

run = [
  "swift",
  "$file"
]

build = [
  "swift",
  "build"
]

test = [
  "swift",
  "test"
]

format = [
  "swift-format",
  "format",
  "--in-place",
  "$file"
]

lint = [
  "swiftlint",
  "$file"
]

release = [
  "swift",
  "build",
  "-c",
  "release"
]

[environment]
SDKROOT = true
SWIFT_EXEC = true
SWIFT_DRIVER_SWIFT_FRONTEND_EXEC = true
PATH = true

[architectures]
supported = [
  "x86_64",
  "arm",
  "aarch64"
]

[platforms]
supported = [
  "macos",
  "ios",
  "ipados",
  "tvos",
  "watchos",
  "visionos",
  "linux",
  "windows",
  "android"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $build.enabled == true {
  required_path += ["build.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}