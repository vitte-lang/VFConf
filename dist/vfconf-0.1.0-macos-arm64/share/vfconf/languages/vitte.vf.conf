[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "bare-metal",
  "embedded"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions",
  "grammar.version",
  "grammar.source"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}