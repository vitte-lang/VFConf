# VFConf — Vitte Foundation Configuration Language
# languages/vitte.vf.conf
#
# Vitte programming language definition.
# Grammar source: src/vitte/grammar/vitte.ebnf
# Grammar version: 2

[language]
id = "vitte"
name = "Vitte"
display_name = "Vitte"
version = "1.0"
grammar_version = 2
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".vit",
  ".vitl",
  ".vitte"
]
primary_extension = ".vit"
library_extension = ".vitl"
legacy_extension = ".vitte"
mime = [
  "text/x-vitte"
]

[lexer]
encoding = "utf-8"
unicode = false
case_sensitive = true

[comments]
line = [
  "#",
  "//"
]
block = [
  "/*",
  "*/"
]
zone_start = "<<<"
zone_end = ">>>"
nested_block = false

[comments.documentation]
line = "///"

[strings]
double_quote = true
single_quote = false
escape = "\\"
multiline = true

[strings.raw]
enabled = true
prefix = "r"
multiline = true

[strings.triple]
enabled = true
delimiter = "\"\"\""
multiline = true

[characters]
enabled = true
quote = "'"
escape = "\\"

[escapes]
values = [
  "\\n",
  "\\r",
  "\\t",
  "\\0",
  "\\\"",
  "\\'",
  "\\\\"
]

[escapes.hex]
enabled = true
prefix = "\\x"
digits = 2

[escapes.unicode]
enabled = true
prefix = "\\u{"
suffix = "}"

[numbers]
decimal = true
hexadecimal = true
binary = true
octal = true
floating_point = true
scientific = true
signed_literals = true
digit_separator = "_"
suffixes = true

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0x[0-9A-Fa-f][0-9A-Fa-f_]*"
binary = "0b[01][01_]*"
octal = "0o[0-7][0-7_]*"

[identifiers]
pattern = "[A-Za-z_][A-Za-z0-9_]*"
unicode = false

