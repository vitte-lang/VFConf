[grammar]
version = 2
normative = true
source = "src/vitte/grammar/vitte.ebnf"
generated = true
generator = "docs/book/grammar/scripts/sync_grammar.py"
generator_version = 2

[grammar.notation]
definition = "::="
alternative = "|"
optional = "[ ... ]"
repetition = "{ ... }"
compact_optional = "X?"
compact_repetition = "X*"
literal = "\"...\""
negative_predicate = "~X"

[grammar.compatibility]
legacy_declarations = [
  "class",
  "union",
  "bits",
  "flags"
]
preferred_declarations = [
  "form",
  "pick"
]

[environment]
VITTE_HOME = true
VITTE_PATH = true
VITTE_MODULE_PATH = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
