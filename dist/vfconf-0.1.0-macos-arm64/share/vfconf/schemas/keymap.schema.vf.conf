# VFConf — Vitte Foundation Configuration Language
# schemas/keymap.schema.vf.conf
#
# Canonical schema for keymap.vf.conf.
#
# A keymap associates physical or logical key combinations with editor,
# terminal, navigation, build, debugging, and VFConf commands.

[schema]
name = "keymap"
version = "1.0"
description = "VFConf keymap configuration schema"
target = "keymap.vf.conf"
allow_unknown_sections = false

[schema.root]
allow_unknown_fields = false

[schema.root.fields.version]
type = "string"
required = true
non_empty = true

[schema.root.fields.platform]
type = "string"
required = false
default = "auto"
one_of = ["auto", "linux", "macos", "windows", "unix"]

[schema.root.fields.enabled]
type = "boolean"
required = false
default = true

[schema.root.fields.timeout]
type = "duration"
required = false
default = 1s

[schema.root.fields.case_sensitive]
type = "boolean"
required = false
default = false

[schema.root.fields.allow_chords]
type = "boolean"
required = false
default = true

[schema.root.fields.allow_sequences]
type = "boolean"
required = false
default = true

[schema.root.fields.detect_conflicts]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Modifier configuration
# ------------------------------------------------------------

[schema.modifiers]
description = "Canonical modifier names"
allow_unknown_fields = false

[schema.modifiers.fields.control]
type = "string"
required = false
default = "ctrl"
non_empty = true

[schema.modifiers.fields.alt]
type = "string"
required = false
default = "alt"
non_empty = true

[schema.modifiers.fields.shift]
type = "string"
required = false
default = "shift"
non_empty = true

[schema.modifiers.fields.meta]
type = "string"
required = false
default = "meta"
non_empty = true

[schema.modifiers.fields.command]
type = "string"
required = false
default = "cmd"
non_empty = true

[schema.modifiers.fields.super]
type = "string"
required = false
default = "super"
non_empty = true

# ------------------------------------------------------------
# Key normalization
# ------------------------------------------------------------

[schema.keys]
description = "Key parsing and normalization rules"
allow_unknown_fields = false

[schema.keys.fields.separator]
type = "string"
required = false
default = "+"
non_empty = true

[schema.keys.fields.sequence_separator]
type = "string"
required = false
default = " "
non_empty = true

[schema.keys.fields.normalize_case]
type = "boolean"
required = false
default = true

[schema.keys.fields.normalize_modifiers]
type = "boolean"
required = false
default = true

[schema.keys.fields.reject_unknown_keys]
type = "boolean"
required = false
default = true

[schema.keys.fields.reject_duplicate_modifiers]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Context system
# ------------------------------------------------------------

[schema.context]
description = "Conditions controlling when bindings are active"
allow_unknown_fields = false

[schema.context.fields.enabled]
type = "boolean"
required = false
default = true

[schema.context.fields.expression_language]
type = "string"
required = false
default = "vfconf"

[schema.context.fields.undefined_is_false]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Binding definition
# ------------------------------------------------------------

[schema.binding]
description = "Schema applied to individual key bindings"
allow_unknown_fields = false

[schema.binding.fields.key]
type = "string"
required = true
non_empty = true

[schema.binding.fields.command]
type = "string"
required = true
non_empty = true

[schema.binding.fields.when]
type = "string"
required = false

[schema.binding.fields.args]
type = "object"
required = false
default = {}

[schema.binding.fields.enabled]
type = "boolean"
required = false
default = true

[schema.binding.fields.priority]
type = "integer"
required = false
default = 0

[schema.binding.fields.description]
type = "string"
required = false

[schema.binding.fields.platform]
type = "string"
required = false
default = "all"
one_of = [
  "all",
  "linux",
  "macos",
  "windows",
  "unix"
]

[schema.binding.fields.repeat]
type = "boolean"
required = false
default = false

[schema.binding.fields.consume]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Chords
# ------------------------------------------------------------

[schema.chord]
description = "Multi-key chord configuration"
allow_unknown_fields = false

[schema.chord.fields.keys]
type = "array"
required = true
non_empty = true

[schema.chord.fields.command]
type = "string"
required = true
non_empty = true

[schema.chord.fields.when]
type = "string"
required = false

[schema.chord.fields.timeout]
type = "duration"
required = false
default = 1s

[schema.chord.fields.args]
type = "object"
required = false
default = {}

[schema.chord.fields.enabled]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Conflict handling
# ------------------------------------------------------------

[schema.conflicts]
description = "Key binding conflict handling"
allow_unknown_fields = false

[schema.conflicts.fields.policy]
type = "string"
required = false
default = "error"
one_of = [
  "error",
  "warning",
  "first",
  "last",
  "priority"
]

[schema.conflicts.fields.allow_context_overlap]
type = "boolean"
required = false
default = true

[schema.conflicts.fields.allow_platform_overlap]
type = "boolean"
required = false
default = true

[schema.conflicts.fields.report_shadowed]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Reserved shortcuts
# ------------------------------------------------------------

[schema.reserved]
description = "Reserved shortcuts that user keymaps may not override"
allow_unknown_fields = false

[schema.reserved.fields.enabled]
type = "boolean"
required = false
default = true

[schema.reserved.fields.keys]
type = "array"
required = false
default = []

[schema.reserved.fields.commands]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Editor commands
# ------------------------------------------------------------

[schema.commands.editor]
allow_unknown_fields = false

[schema.commands.editor.fields.allowed]
type = "array"
required = false
default = [
  "editor.save",
  "editor.save_all",
  "editor.open",
  "editor.close",
  "editor.undo",
  "editor.redo",
  "editor.cut",
  "editor.copy",
  "editor.paste",
  "editor.select_all",
  "editor.find",
  "editor.replace",
  "editor.format",
  "editor.rename",
  "editor.goto_definition",
  "editor.goto_reference"
]

# ------------------------------------------------------------
# Navigation commands
# ------------------------------------------------------------

[schema.commands.navigation]
allow_unknown_fields = false

[schema.commands.navigation.fields.allowed]
type = "array"
required = false
default = [
  "navigation.up",
  "navigation.down",
  "navigation.left",
  "navigation.right",
  "navigation.page_up",
  "navigation.page_down",
  "navigation.line_start",
  "navigation.line_end",
  "navigation.file_start",
  "navigation.file_end",
  "navigation.back",
  "navigation.forward"
]

# ------------------------------------------------------------
# Terminal commands
# ------------------------------------------------------------

[schema.commands.terminal]
allow_unknown_fields = false

[schema.commands.terminal.fields.allowed]
type = "array"
required = false
default = [
  "terminal.new",
  "terminal.close",
  "terminal.clear",
  "terminal.copy",
  "terminal.paste",
  "terminal.interrupt",
  "terminal.scroll_up",
  "terminal.scroll_down"
]

# ------------------------------------------------------------
# Build commands
# ------------------------------------------------------------

[schema.commands.build]
allow_unknown_fields = false

[schema.commands.build.fields.allowed]
type = "array"
required = false
default = [
  "build.build",
  "build.check",
  "build.clean",
  "build.run",
  "build.test",
  "build.bench"
]

# ------------------------------------------------------------
# Debug commands
# ------------------------------------------------------------

[schema.commands.debug]
allow_unknown_fields = false

[schema.commands.debug.fields.allowed]
type = "array"
required = false
default = [
  "debug.start",
  "debug.stop",
  "debug.continue",
  "debug.pause",
  "debug.step_over",
  "debug.step_into",
  "debug.step_out",
  "debug.toggle_breakpoint"
]

# ------------------------------------------------------------
# VFConf commands
# ------------------------------------------------------------

[schema.commands.vfconf]
allow_unknown_fields = false

[schema.commands.vfconf.fields.allowed]
type = "array"
required = false
default = [
  "vfconf.check",
  "vfconf.format",
  "vfconf.dump",
  "vfconf.reload",
  "vfconf.goto_definition"
]

# ------------------------------------------------------------
# Validation rules
# ------------------------------------------------------------

[rules]

required_path = [
  "schema.name",
  "schema.version",
  "schema.target"
]

when $schema.root.allow_chords == true {
  required_path += ["schema.chord"]
}

when $schema.root.detect_conflicts == true {
  required_path += ["schema.conflicts"]
}

# Key names must be normalized before conflict detection.
rule = [
  {
    name: "normalized-key",
    severity: "error",
    target: "binding.key"
  },

  {
    name: "known-command",
    severity: "error",
    target: "binding.command"
  },

  {
    name: "non-empty-key",
    severity: "error",
    target: "binding.key"
  },

  {
    name: "binding-conflict",
    severity: "error",
    target: "binding"
  },

  {
    name: "valid-chord",
    severity: "error",
    target: "chord.keys"
  }
]
