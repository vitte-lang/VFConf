# ------------------------------------------------------------
# Validation rules
# ------------------------------------------------------------

[rules]

required_path = [
  "theme.id",
  "theme.name",
  "theme.variant",
  "ui.background",
  "ui.foreground",
  "editor.background",
  "editor.foreground"
]



rule = [
  {
    name: "unique-theme-id",
    severity: "error",
    target: "theme.id"
  },

  {
    name: "valid-theme-variant",
    severity: "error",
    target: "theme.variant"
  },

  {
    name: "valid-color",
    severity: "error",
    target: "*.color"
  },

  {
    name: "foreground-background-contrast",
    severity: "warning",
    target: "ui"
  },

  {
    name: "editor-foreground-background-contrast",
    severity: "warning",
    target: "editor"
  }
]

when $accessibility.high_contrast == true {
  rule += [
    {
      name: "high-contrast-ui",
      severity: "error",
      target: "ui"
    },

    {
      name: "high-contrast-editor",
      severity: "error",
      target: "editor"
    }
  ]
}
