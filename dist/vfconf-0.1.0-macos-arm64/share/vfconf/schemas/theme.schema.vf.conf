# VFConf — Vitte Foundation Configuration Language
# schemas/theme.schema.vf.conf
#
# Canonical schema for VFConf theme definitions.
#
# Theme files:
#   themes/default.vf.conf
#   themes/dark.vf.conf
#   themes/light.vf.conf
#   themes/high-contrast.vf.conf

[schema]
name = "theme"
version = "1.0"
description = "VFConf editor and terminal theme schema"
target = "themes/*.vf.conf"
allow_unknown_sections = false

# ------------------------------------------------------------
# Theme identity
# ------------------------------------------------------------

[schema.theme]
description = "Theme identity and metadata"
allow_unknown_fields = false

[schema.theme.fields.id]
type = "string"
required = true
non_empty = true

[schema.theme.fields.name]
type = "string"
required = true
non_empty = true

[schema.theme.fields.version]
type = "string"
required = false
default = "1.0"

[schema.theme.fields.description]
type = "string"
required = false

[schema.theme.fields.author]
type = "string"
required = false

[schema.theme.fields.variant]
type = "string"
required = true
one_of = [
  "dark",
  "light",
  "high-contrast-dark",
  "high-contrast-light"
]

[schema.theme.fields.enabled]
type = "boolean"
required = false
default = true

[schema.theme.fields.inherits]
type = "string"
required = false

