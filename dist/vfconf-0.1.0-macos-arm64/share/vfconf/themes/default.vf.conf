# VFConf — Vitte Foundation Configuration Language
# themes/default.vf.conf
#
# Canonical default theme for VFConf-compatible editors and terminal tooling.

[theme]
id = "default"
name = "VFConf Default"
display_name = "VFConf Default"
version = "1.0"
type = "dark"
enabled = true
high_contrast = false

[ui]
background = "#181A1F"
foreground = "#D7DAE0"
border = "#343842"
separator = "#2C3038"
focus = "#5C9DED"
disabled = "#747B87"
shadow = "#00000070"

[editor]
background = "#181A1F"
foreground = "#D7DAE0"
selection_background = "#36516F"
selection_foreground = "#FFFFFF"
inactive_selection_background = "#2A394B"
current_line_background = "#1E2127"
current_line_border = "#2C313A"
find_match_background = "#6D5724"
find_match_foreground = "#FFFFFF"
find_match_current_background = "#8B6C2B"
find_match_current_foreground = "#FFFFFF"
word_highlight_background = "#29394E"
word_highlight_strong_background = "#344C68"
range_highlight_background = "#222C39"
indent_guide = "#30343D"
indent_guide_active = "#535B68"
whitespace = "#414751"
cursor = "#F2F3F5"
cursor_secondary = "#9AA1AC"
link = "#61A7F2"

[gutter]
background = "#15171B"
foreground = "#737A86"
active_foreground = "#E3E5E8"
border = "#292D34"
line_number = "#737A86"
line_number_active = "#E3E5E8"
added = "#57B477"
modified = "#D6AA4E"
deleted = "#E06C75"

[terminal]
background = "#121419"
foreground = "#D7DAE0"
cursor = "#F2F3F5"
cursor_text = "#181A1F"
selection_background = "#36516F"
selection_foreground = "#FFFFFF"

[terminal_ansi]
black = "#1B1D22"
red = "#E06C75"
green = "#78C490"
yellow = "#E5C07B"
blue = "#61A7F2"
magenta = "#C678DD"
cyan = "#56B6C2"
white = "#D7DAE0"
bright_black = "#626975"
bright_red = "#F37B84"
bright_green = "#91D5A5"
bright_yellow = "#F0CD8A"
bright_blue = "#7DBBFF"
bright_magenta = "#D995EE"
bright_cyan = "#70CDD8"
bright_white = "#FFFFFF"

[panel]
background = "#17191E"
foreground = "#D7DAE0"
border = "#30343D"
title_foreground = "#F0F1F3"
title_background = "#1D2026"

[sidebar]
background = "#16181D"
foreground = "#CACED5"
border = "#30343D"
section_background = "#1B1E24"
section_foreground = "#E2E4E8"
selection_background = "#2C4159"
selection_foreground = "#FFFFFF"
inactive_selection_background = "#222E3D"
hover_background = "#20242B"

[statusbar]
background = "#20242B"
foreground = "#D7DAE0"
border = "#343944"
active_background = "#293443"
active_foreground = "#FFFFFF"
warning_background = "#624C1D"
warning_foreground = "#FFE7A5"
error_background = "#5A292F"
error_foreground = "#FFD8DB"

[tabs]
background = "#16181D"
foreground = "#9299A5"
active_background = "#1E2127"
active_foreground = "#F1F2F4"
active_border = "#61A7F2"
inactive_background = "#181A1F"
inactive_foreground = "#808792"
hover_background = "#20242B"
border = "#30343D"
dirty = "#D6AA4E"

[menu]
background = "#1E2127"
foreground = "#D7DAE0"
border = "#3B404A"
selection_background = "#30465F"
selection_foreground = "#FFFFFF"
separator = "#3B404A"
disabled = "#747B87"

[input]
background = "#1E2127"
foreground = "#E2E4E8"
border = "#414752"
focus_border = "#61A7F2"
placeholder = "#777F8B"
selection_background = "#36516F"
selection_foreground = "#FFFFFF"

[button]
background = "#30455D"
foreground = "#FFFFFF"
border = "#435A74"
hover_background = "#3A5573"
active_background = "#48688C"
disabled_background = "#282C33"
disabled_foreground = "#717782"

[scrollbar]
track = "#181A1F"
thumb = "#3B414B"
thumb_hover = "#4D5561"
thumb_active = "#606A78"

[minimap]
background = "#15171B"
foreground = "#616873"
selection = "#6684AA80"
find_match = "#D6AA4E80"
error = "#E06C75"
warning = "#E5C07B"

[diagnostics]
error = "#F07178"
warning = "#E5C07B"
information = "#61A7F2"
hint = "#56B6C2"
unnecessary = "#707783"
deprecated = "#A28BA7"

[diagnostics.background]
error = "#F0717818"
warning = "#E5C07B18"
information = "#61A7F218"
hint = "#56B6C218"

[diagnostics.underline]
error = "#F07178"
warning = "#E5C07B"
information = "#61A7F2"
hint = "#56B6C2"

[diff]
added_background = "#203B2A"
added_foreground = "#ADDFBC"
removed_background = "#45262B"
removed_foreground = "#F2ABB1"
modified_background = "#3D3421"
modified_foreground = "#EFD38C"
added_gutter = "#57B477"
removed_gutter = "#E06C75"
modified_gutter = "#D6AA4E"

[syntax]
foreground = "#D7DAE0"
background = "#181A1F"

[syntax.comment]
foreground = "#737B86"
italic = true

[syntax.documentation]
foreground = "#858E99"
italic = true

[syntax.keyword]
foreground = "#C792EA"

[syntax.control]
foreground = "#C792EA"

[syntax.declaration]
foreground = "#C586C0"

[syntax.modifier]
foreground = "#D39BD2"

[syntax.operator]
foreground = "#89DDFF"

[syntax.punctuation]
foreground = "#ADB3BD"

[syntax.string]
foreground = "#C3E88D"

[syntax.character]
foreground = "#C3E88D"

[syntax.escape]
foreground = "#F78C6C"

[syntax.number]
foreground = "#F78C6C"

[syntax.boolean]
foreground = "#FF9CAC"

[syntax.null]
foreground = "#FF9CAC"

[syntax.variable]
foreground = "#D7DAE0"

[syntax.variable_builtin]
foreground = "#FFCB6B"

[syntax.parameter]
foreground = "#F2C38B"

[syntax.property]
foreground = "#82AAFF"

[syntax.constant]
foreground = "#FFCB6B"

[syntax.function]
foreground = "#82AAFF"

[syntax.method]
foreground = "#82AAFF"

[syntax.type]
foreground = "#FFCB6B"

[syntax.class]
foreground = "#FFCB6B"

[syntax.struct]
foreground = "#FFCB6B"

[syntax.enum]
foreground = "#FFCB6B"

[syntax.interface]
foreground = "#C3E88D"

[syntax.trait]
foreground = "#C3E88D"

[syntax.namespace]
foreground = "#89DDFF"

[syntax.module]
foreground = "#89DDFF"

[syntax.attribute]
foreground = "#F2C38B"

[syntax.decorator]
foreground = "#F2C38B"

[syntax.macro]
foreground = "#C792EA"

[syntax.label]
foreground = "#89DDFF"

[syntax.lifetime]
foreground = "#F2C38B"

[syntax.regex]
foreground = "#89DDFF"

[syntax.reference]
foreground = "#82AAFF"

[syntax.section]
foreground = "#89DDFF"
bold = true

[syntax.key]
foreground = "#82AAFF"

[syntax.color]
foreground = "#F78C6C"

[syntax.duration]
foreground = "#F78C6C"

[syntax.size]
foreground = "#F78C6C"

[syntax.invalid]
foreground = "#FFFFFF"
background = "#B63A46"

[token_style]
comment = "italic"
documentation = "italic"
keyword = "normal"
control = "normal"
declaration = "normal"
modifier = "normal"
operator = "normal"
string = "normal"
number = "normal"
function = "normal"
type = "normal"
section = "bold"

[semantic]
enabled = true

[semantic.variable]
foreground = "#D7DAE0"

[semantic.variable.readonly]
foreground = "#FFCB6B"

[semantic.variable.static]
foreground = "#E8B46A"

[semantic.parameter]
foreground = "#F2C38B"

[semantic.property]
foreground = "#82AAFF"

[semantic.function]
foreground = "#82AAFF"

[semantic.function.async]
foreground = "#79C7E3"

[semantic.method]
foreground = "#82AAFF"

[semantic.type]
foreground = "#FFCB6B"

[semantic.type_parameter]
foreground = "#F2C38B"

[semantic.class]
foreground = "#FFCB6B"

[semantic.struct]
foreground = "#FFCB6B"

[semantic.enum]
foreground = "#FFCB6B"

[semantic.enum_member]
foreground = "#F78C6C"

[semantic.interface]
foreground = "#C3E88D"

[semantic.namespace]
foreground = "#89DDFF"

[semantic.macro]
foreground = "#C792EA"

[semantic.keyword]
foreground = "#C792EA"

[semantic.operator]
foreground = "#89DDFF"

[semantic.string]
foreground = "#C3E88D"

[semantic.number]
foreground = "#F78C6C"

[semantic.comment]
foreground = "#737B86"

[semantic_modifiers]
declaration = "normal"
definition = "normal"
readonly = "normal"
static = "normal"
deprecated = "strikethrough"
abstract = "italic"
async = "italic"
modification = "normal"
documentation = "italic"
default_library = "normal"

[font]
family = "monospace"
size = 14
weight = "normal"
line_height = 1.4
ligatures = true

[font.editor]
family = "monospace"
size = 14
weight = "normal"
ligatures = true

[font.terminal]
family = "monospace"
size = 13
weight = "normal"
ligatures = false

[link]
foreground = "#61A7F2"
active_foreground = "#8CC1FF"
visited_foreground = "#B69ADF"
underline = true

[notification]
background = "#20242B"
foreground = "#D7DAE0"
border = "#3A404A"

[notification.info]
accent = "#61A7F2"

[notification.warning]
accent = "#E5C07B"

[notification.error]
accent = "#F07178"

[notification.success]
accent = "#78C490"

[accessibility]
minimum_contrast = 4.5
focus_indicator = "#61A7F2"
high_visibility_cursor = true
underline_links = true

[custom]
accent_primary = "#61A7F2"
accent_secondary = "#C792EA"
accent_success = "#78C490"
accent_warning = "#E5C07B"
accent_error = "#F07178"

[rules]
required_path = [
  "theme.id",
  "theme.name",
  "theme.type",
  "editor.background",
  "editor.foreground",
  "syntax.foreground"
]

when $theme.enabled == true {
  required_path += ["ui.background"]
}

when $semantic.enabled == true {
  required_path += ["semantic.variable.foreground"]
}