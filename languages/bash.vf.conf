# VFConf — Vitte Foundation Configuration Language
# languages/bash.vf.conf
#
# Bash / POSIX shell language definition.

[language]
id = "bash"
name = "Bash"
display_name = "Bash Shell"
version = "1.0"
enabled = true
category = "scripting"
case_sensitive = true

[files]
extensions = [
  ".sh",
  ".bash",
  ".bashrc",
  ".bash_profile"
]
filenames = [
  ".bashrc",
  ".bash_profile",
  ".bash_login",
  ".bash_logout",
  ".profile"
]
mime = [
  "application/x-sh",
  "text/x-shellscript"
]

[files.shebang]
patterns = [
  "#!/bin/bash",
  "#!/usr/bin/bash",
  "#!/usr/bin/env bash",
  "#!/bin/sh",
  "#!/usr/bin/env sh"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["#"]
block = []

[strings]
single_quote = true
double_quote = true
escape = "\\"
multiline = true

[strings.single]
interpolation = false
escape_sequences = false

[strings.double]
interpolation = true
escape_sequences = true

[strings.ansi_c]
prefix = "$"
quote = "'"
enabled = true

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true

[numbers.patterns]
decimal = "[0-9]+"
hexadecimal = "0[xX][0-9A-Fa-f]+"
octal = "0[0-7]+"
binary = "2#[01]+"

[keywords]
values = [
  "if",
  "then",
  "elif",
  "else",
  "fi",
  "case",
  "esac",
  "for",
  "select",
  "while",
  "until",
  "do",
  "done",
  "in",
  "function",
  "time",
  "coproc"
]

[keywords.builtins]
values = [
  "alias",
  "bg",
  "bind",
  "break",
  "builtin",
  "caller",
  "cd",
  "command",
  "compgen",
  "complete",
  "compopt",
  "continue",
  "declare",
  "dirs",
  "disown",
  "echo",
  "enable",
  "eval",
  "exec",
  "exit",
  "export",
  "false",
  "fc",
  "fg",
  "getopts",
  "hash",
  "help",
  "history",
  "jobs",
  "kill",
  "let",
  "local",
  "logout",
  "mapfile",
  "popd",
  "printf",
  "pushd",
  "pwd",
  "read",
  "readarray",
  "readonly",
  "return",
  "set",
  "shift",
  "shopt",
  "source",
  "suspend",
  "test",
  "times",
  "trap",
  "true",
  "type",
  "typeset",
  "ulimit",
  "umask",
  "unalias",
  "unset",
  "wait"
]

[keywords.posix]
values = [
  ".",
  ":",
  "break",
  "cd",
  "continue",
  "eval",
  "exec",
  "exit",
  "export",
  "readonly",
  "return",
  "set",
  "shift",
  "trap",
  "unset"
]

[operators]
values = [
  "=",
  "==",
  "!=",
  "=~",
  "<",
  ">",
  "<=",
  ">=",
  "+",
  "-",
  "*",
  "/",
  "%",
  "**",
  "++",
  "--",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "<<<",
  ";",
  ";;",
  ";&",
  ";;&"
]

[operators.redirection]
values = [
  ">",
  ">>",
  "<",
  "<<",
  "<<<",
  "<>",
  ">|",
  "<&",
  ">&",
  "&>",
  "&>>"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
double_brackets = ["[[", "]]"]
braces = ["{", "}"]
semicolon = ";"
pipe = "|"
ampersand = "&"

[variables]
enabled = true
prefix = "$"

[variables.patterns]
simple = "\\$[A-Za-z_][A-Za-z0-9_]*"
braced = "\\$\\{[^}]+\\}"
positional = "\\$[0-9]+"
special = "\\$[?#!$*@_-]"

[variables.special]
values = [
  "$?",
  "$$",
  "$!",
  "$#",
  "$0",
  "$@",
  "$*",
  "$-",
  "$_"
]

[syntax]
enabled = true
functions = true
variables = true
parameters = true
commands = true
redirections = true
substitutions = true
heredocs = true

[syntax.function]
pattern = "([A-Za-z_][A-Za-z0-9_-]*[ \\t]*\\(\\)|function[ \\t]+[A-Za-z_][A-Za-z0-9_-]*)"
scope = "entity.name.function.shell"

[syntax.variable]
scope = "variable.other.readwrite.shell"

[syntax.parameter]
scope = "variable.parameter.shell"

[syntax.command]
scope = "support.function.command.shell"

[syntax.command_substitution]
start = "$("
end = ")"
scope = "meta.command.substitution.shell"

[syntax.arithmetic]
start = "$(("
end = "))"
scope = "meta.arithmetic.shell"

[syntax.parameter_expansion]
start = "${"
end = "}"
scope = "meta.parameter-expansion.shell"

[syntax.test]
single_start = "["
single_end = "]"
double_start = "[["
double_end = "]]"

[syntax.heredoc]
enabled = true
operators = [
  "<<",
  "<<-"
]
scope = "string.unquoted.heredoc.shell"

[syntax.shebang]
pattern = "^#!.*$"
scope = "comment.line.shebang.shell"

[syntax.escape]
pattern = "\\\\."
scope = "constant.character.escape.shell"

[syntax.glob]
enabled = true
values = [
  "*",
  "?",
  "[",
  "]"
]

[syntax.extglob]
enabled = true
operators = [
  "?(",
  "*(",
  "+(",
  "@(",
  "!("
]

[syntax.process_substitution]
enabled = true
input = "<("
output = ">("

[indentation]
enabled = true
width = 2
style = "spaces"

[indentation.rules]
increase_after = [
  "then",
  "do",
  "else",
  "elif",
  "case",
  "{"
]
decrease_before = [
  "fi",
  "done",
  "esac",
  "}",
  "else",
  "elif"
]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["[[", "]]"],
  ["{", "}"]
]

[formatter]
enabled = true
provider = "shfmt"
command = "shfmt"

[formatter.options]
indent = 2
binary_next_line = false
case_indent = true
space_redirects = false
keep_padding = false
function_next_line = false

[interpreter]
enabled = true
command = "bash"

[interpreter.posix]
command = "sh"

[interpreter.arguments]
values = []

[build]
enabled = false

[lsp]
enabled = true
provider = "bash-language-server"
command = "bash-language-server"
arguments = [
  "start"
]

[diagnostics]
enabled = true

[diagnostics.shellcheck]
enabled = true
command = "shellcheck"

[diagnostics.shellcheck.arguments]
values = [
  "--format",
  "json"
]

[repl]
enabled = true
command = "bash"

[debugger]
enabled = true
providers = [
  "bashdb"
]

[tasks]
run = ["bash", "$file"]
check = ["bash", "-n", "$file"]
lint = ["shellcheck", "$file"]
format = ["shfmt", "-w", "$file"]

[environment]
PATH = true
HOME = true
USER = true
SHELL = true
PWD = true

[platforms]
supported = [
  "linux",
  "macos",
  "freebsd",
  "openbsd",
  "netbsd",
  "solaris",
  "windows"
]

[platforms.windows]
requires = [
  "wsl"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $interpreter.enabled == true {
  required_path += ["interpreter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}