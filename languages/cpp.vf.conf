# VFConf — Vitte Foundation Configuration Language
# languages/cpp.vf.conf
#
# C++ programming language definition.

[language]
id = "cpp"
name = "C++"
display_name = "C++"
version = "1.0"
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".cpp",
  ".cc",
  ".cxx",
  ".c++",
  ".hpp",
  ".hh",
  ".hxx",
  ".h++",
  ".ipp",
  ".inl",
  ".tpp"
]
filenames = []
mime = [
  "text/x-c++src",
  "text/x-c++hdr"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
nested_block = false

[strings]
double_quote = true
single_quote = false
escape = "\\"
multiline = false

[strings.raw]
enabled = true
prefix = "R"
start = "\""
delimiter = true

[characters]
enabled = true
quote = "'"
escape = "\\"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true
digit_separator = "'"

[numbers.suffixes]
integer = [
  "u",
  "U",
  "l",
  "L",
  "ul",
  "UL",
  "ull",
  "ULL",
  "ll",
  "LL"
]

float = [
  "f",
  "F",
  "l",
  "L"
]

[keywords]
values = [
  "alignas",
  "alignof",
  "and",
  "and_eq",
  "asm",
  "atomic_cancel",
  "atomic_commit",
  "atomic_noexcept",
  "auto",
  "bitand",
  "bitor",
  "bool",
  "break",
  "case",
  "catch",
  "char",
  "char8_t",
  "char16_t",
  "char32_t",
  "class",
  "compl",
  "concept",
  "const",
  "consteval",
  "constexpr",
  "constinit",
  "const_cast",
  "continue",
  "co_await",
  "co_return",
  "co_yield",
  "decltype",
  "default",
  "delete",
  "do",
  "double",
  "dynamic_cast",
  "else",
  "enum",
  "explicit",
  "export",
  "extern",
  "false",
  "float",
  "for",
  "friend",
  "goto",
  "if",
  "inline",
  "int",
  "long",
  "mutable",
  "namespace",
  "new",
  "noexcept",
  "not",
  "not_eq",
  "nullptr",
  "operator",
  "or",
  "or_eq",
  "private",
  "protected",
  "public",
  "reflexpr",
  "register",
  "reinterpret_cast",
  "requires",
  "return",
  "short",
  "signed",
  "sizeof",
  "static",
  "static_assert",
  "static_cast",
  "struct",
  "switch",
  "synchronized",
  "template",
  "this",
  "thread_local",
  "throw",
  "true",
  "try",
  "typedef",
  "typeid",
  "typename",
  "union",
  "unsigned",
  "using",
  "virtual",
  "void",
  "volatile",
  "wchar_t",
  "while",
  "xor",
  "xor_eq"
]

[keywords.types]
values = [
  "bool",
  "char",
  "char8_t",
  "char16_t",
  "char32_t",
  "double",
  "float",
  "int",
  "long",
  "short",
  "signed",
  "unsigned",
  "void",
  "wchar_t",
  "size_t",
  "ptrdiff_t",
  "nullptr_t"
]

[keywords.control]
values = [
  "break",
  "case",
  "catch",
  "continue",
  "co_await",
  "co_return",
  "co_yield",
  "default",
  "do",
  "else",
  "for",
  "goto",
  "if",
  "return",
  "switch",
  "throw",
  "try",
  "while"
]

[keywords.declaration]
values = [
  "class",
  "concept",
  "enum",
  "namespace",
  "struct",
  "template",
  "typedef",
  "typename",
  "union",
  "using"
]

[keywords.access]
values = [
  "private",
  "protected",
  "public"
]

[keywords.modifiers]
values = [
  "const",
  "consteval",
  "constexpr",
  "constinit",
  "explicit",
  "extern",
  "friend",
  "inline",
  "mutable",
  "noexcept",
  "static",
  "thread_local",
  "virtual",
  "volatile"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "++",
  "--",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "<=>",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  "?",
  ":",
  "::",
  ".",
  "->",
  ".*",
  "->*",
  ","
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
angles = ["<", ">"]
semicolon = ";"
comma = ","

[preprocessor]
enabled = true
prefix = "#"

[preprocessor.directives]
values = [
  "define",
  "undef",
  "include",
  "if",
  "ifdef",
  "ifndef",
  "elif",
  "else",
  "endif",
  "error",
  "warning",
  "line",
  "pragma",
  "embed"
]

[preprocessor.macros]
values = [
  "__FILE__",
  "__LINE__",
  "__DATE__",
  "__TIME__",
  "__cplusplus"
]

[syntax]
enabled = true
functions = true
types = true
variables = true
constants = true
classes = true
namespaces = true
templates = true
concepts = true
macros = true
preprocessor = true

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.cpp"

[syntax.type]
scope = "entity.name.type.cpp"

[syntax.class]
scope = "entity.name.type.class.cpp"

[syntax.namespace]
scope = "entity.name.namespace.cpp"

[syntax.variable]
scope = "variable.other.cpp"

[syntax.constant]
scope = "constant.language.cpp"

[syntax.template]
scope = "meta.template.cpp"

[syntax.concept]
scope = "entity.name.type.concept.cpp"

[syntax.macro]
scope = "entity.name.function.preprocessor.cpp"

[syntax.preprocessor]
scope = "meta.preprocessor.cpp"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "c++23"
supported = [
  "c++98",
  "c++03",
  "c++11",
  "c++14",
  "c++17",
  "c++20",
  "c++23"
]

[compiler]
enabled = true
auto_detect = true
default = "c++"

[compiler.cxx]
command = "c++"
arguments = [
  "-std=c++23",
  "-Wall",
  "-Wextra",
  "-Wpedantic"
]

[compiler.gcc]
command = "g++"
arguments = [
  "-std=c++23",
  "-Wall",
  "-Wextra",
  "-Wpedantic"
]

[compiler.clang]
command = "clang++"
arguments = [
  "-std=c++23",
  "-Wall",
  "-Wextra",
  "-Wpedantic"
]

[compiler.msvc]
command = "cl"
arguments = [
  "/std:c++latest",
  "/W4"
]

[build]
enabled = true
object_extension = ".o"
executable_extension = ""

[build.windows]
object_extension = ".obj"
executable_extension = ".exe"

[formatter]
enabled = true
provider = "clang-format"
command = "clang-format"

[formatter.arguments]
values = [
  "-style=file"
]

[lsp]
enabled = true
provider = "clangd"
command = "clangd"

[lsp.arguments]
values = [
  "--background-index",
  "--clang-tidy",
  "--completion-style=detailed"
]

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
warnings = true
warnings_as_errors = false

[diagnostics.clang_tidy]
enabled = true
command = "clang-tidy"

[debugger]
enabled = true
providers = [
  "gdb",
  "lldb"
]

[repl]
enabled = false

[tasks]
compile = [
  "c++",
  "-std=c++23",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "$file",
  "-o",
  "$output"
]

check = [
  "c++",
  "-std=c++23",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-fsyntax-only",
  "$file"
]

format = [
  "clang-format",
  "-i",
  "$file"
]

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "sparc",
  "sparc64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "solaris",
  "bare-metal"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}