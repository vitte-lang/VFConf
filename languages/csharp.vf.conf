]

[keywords.modifiers]
values = [
  "abstract",
  "async",
  "const",
  "extern",
  "fixed",
  "new",
  "override",
  "partial",
  "readonly",
  "required",
  "sealed",
  "static",
  "unsafe",
  "virtual",
  "volatile"
]

[literals]
values = [
  "true",
  "false",
  "null"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "++",
  "--",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  ">>>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  ">>>=",
  "??",
  "??=",
  "?.",
  "?[",
  "?",
  ":",
  "=>",
  ".",
  "::",
  ".."
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","

[preprocessor]
enabled = true
prefix = "#"

[preprocessor.directives]
values = [
  "if",
  "else",
  "elif",
  "endif",
  "define",
  "undef",
  "warning",
  "error",
  "line",
  "region",
  "endregion",
  "pragma",
  "nullable"
]

[attributes]
enabled = true
start = "["
end = "]"

[syntax]
enabled = true
namespaces = true
classes = true
structs = true
interfaces = true
records = true
enums = true
delegates = true
methods = true
properties = true
events = true
fields = true
variables = true
parameters = true
attributes = true
generics = true
preprocessor = true

[syntax.namespace]
scope = "entity.name.namespace.cs"

[syntax.class]
scope = "entity.name.type.class.cs"

[syntax.struct]
scope = "entity.name.type.struct.cs"

[syntax.interface]
scope = "entity.name.type.interface.cs"

[syntax.record]
scope = "entity.name.type.record.cs"

[syntax.enum]
scope = "entity.name.type.enum.cs"

[syntax.method]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.cs"

[syntax.property]
scope = "variable.other.property.cs"

[syntax.field]
scope = "variable.other.member.cs"

[syntax.variable]
scope = "variable.other.cs"

[syntax.parameter]
scope = "variable.parameter.cs"

[syntax.attribute]
scope = "entity.name.type.attribute.cs"

[syntax.preprocessor]
scope = "meta.preprocessor.cs"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "latest"
supported = [
  "7.3",
  "8.0",
  "9.0",
  "10.0",
  "11.0",
  "12.0",
  "13.0",
  "latest"
]

[compiler]
enabled = true
auto_detect = true
default = "dotnet"

[compiler.dotnet]
command = "dotnet"
arguments = [
  "build"
]

[compiler.csc]
command = "csc"
arguments = []

[build]
enabled = true
project_extensions = [
  ".csproj",
  ".sln",
  ".slnx"
]
configuration = "Debug"

[build.release]
configuration = "Release"

[formatter]
enabled = true
provider = "dotnet-format"
command = "dotnet"

[formatter.arguments]
values = [
  "format"
]

[lsp]
enabled = true
provider = "csharp-ls"
command = "csharp-ls"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
warnings = true
warnings_as_errors = false

[debugger]
enabled = true
providers = [
  "netcoredbg",
  "vsdbg"
]

[repl]
enabled = true
command = "dotnet"

[repl.arguments]
values = [
  "repl"
]

[tasks]
build = [
  "dotnet",
  "build"
]

run = [
  "dotnet",
  "run"
]

test = [
  "dotnet",
  "test"
]

clean = [
  "dotnet",
  "clean"
]

format = [
  "dotnet",
  "format"
]

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}