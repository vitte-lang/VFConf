# VFConf — Vitte Foundation Configuration Language
# languages/csharp.vf.conf
#
# C# programming language definition.

[language]
id = "csharp"
name = "C#"
display_name = "C#"
version = "1.0"
enabled = true
category = "general-purpose"
case_sensitive = true

[files]
extensions = [
  ".cs",
  ".csx"
]
filenames = []
mime = [
  "text/x-csharp"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
nested_block = false
documentation = ["///"]

[strings]
double_quote = true
escape = "\\"
multiline = false

[strings.verbatim]
enabled = true
prefix = "@"
quote = "\""
multiline = true

[strings.interpolated]
enabled = true
prefix = "$"
quote = "\""

[strings.interpolated_verbatim]
enabled = true
prefixes = [
  "$@",
  "@$"
]
quote = "\""
multiline = true

[strings.raw]
enabled = true
minimum_quotes = 3
interpolation = true

[characters]
enabled = true
quote = "'"
escape = "\\"

[numbers]
decimal = true
hexadecimal = true
binary = true
floating_point = true
scientific = true
digit_separator = "_"

[numbers.suffixes]
integer = [
  "u",
  "U",
  "l",
  "L",
  "ul",
  "uL",
  "Ul",
  "UL",
  "lu",
  "lU",
  "Lu",
  "LU"
]

float = [
  "f",
  "F",
  "d",
  "D",
  "m",
  "M"
]

