# VFConf — Vitte Foundation Configuration Language
# languages/php.vf.conf
#
# PHP programming language definition.

[language]
id = "php"
name = "PHP"
display_name = "PHP"
version = "1.0"
enabled = true
category = "scripting"
case_sensitive = true

[files]
extensions = [
  ".php",
  ".php3",
  ".php4",
  ".php5",
  ".php7",
  ".php8",
  ".phtml",
  ".phps"
]
filenames = [
  "composer.json",
  "composer.lock"
]
mime = [
  "application/x-httpd-php",
  "text/x-php"
]

[files.shebang]
patterns = [
  "#!/usr/bin/php",
  "#!/usr/bin/env php"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = [
  "//",
  "#"
]
block = ["/*", "*/"]
documentation = ["/**", "*/"]
nested_block = false

[strings]
single_quote = true
double_quote = true
escape = "\\"
multiline = true

[strings.single]
interpolation = false
escape_sequences = true

[strings.double]
interpolation = true
escape_sequences = true

[strings.heredoc]
enabled = true
start = "<<<"
interpolation = true
multiline = true

[strings.nowdoc]
enabled = true
start = "<<<'"
interpolation = false
multiline = true

[characters]
enabled = false

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
legacy_octal = "0[0-7_]+"
binary = "0[bB][01_]+"

[keywords]
values = [
  "abstract",
  "and",
  "array",
  "as",
  "break",
  "callable",
  "case",
  "catch",
  "class",
  "clone",
  "const",
  "continue",
  "declare",
  "default",
  "do",
  "echo",
  "else",
  "elseif",
  "empty",
  "enddeclare",
  "endfor",
  "endforeach",
  "endif",
  "endswitch",
  "endwhile",
  "enum",
  "eval",
  "exit",
  "extends",
  "final",
  "finally",
  "fn",
  "for",
  "foreach",
  "function",
  "global",
  "goto",
  "if",
  "implements",
  "include",
  "include_once",
  "instanceof",
  "insteadof",
  "interface",
  "isset",
  "list",
  "match",
  "namespace",
  "new",
  "or",
  "print",
  "private",
  "protected",
  "public",
  "readonly",
  "require",
  "require_once",
  "return",
  "static",
  "switch",
  "throw",
  "trait",
  "try",
  "unset",
  "use",
  "var",
  "while",
  "xor",
  "yield",
  "yield from"
]

[keywords.control]
values = [
  "break",
  "case",
  "catch",
  "continue",
  "default",
  "do",
  "else",
  "elseif",
  "finally",
  "for",
  "foreach",
  "goto",
  "if",
  "match",
  "return",
  "switch",
  "throw",
  "try",
  "while",
  "yield"
]

[keywords.declaration]
values = [
  "class",
  "const",
  "enum",
  "fn",
  "function",
  "interface",
  "namespace",
  "trait",
  "use"
]

[keywords.access]
values = [
  "private",
  "protected",
  "public"
]

[keywords.modifiers]
values = [
  "abstract",
  "final",
  "readonly",
  "static"
]

[keywords.types]
values = [
  "array",
  "bool",
  "callable",
  "false",
  "float",
  "int",
  "iterable",
  "mixed",
  "never",
  "null",
  "object",
  "self",
  "static",
  "string",
  "true",
  "void"
]

[literals]
values = [
  "true",
  "false",
  "null"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "**",
  "++",
  "--",
  "==",
  "!=",
  "===",
  "!==",
  "<",
  "<=",
  ">",
  ">=",
  "<=>",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "**=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  ".",
  ".=",
  "??",
  "??=",
  "?",
  ":",
  "?:",
  "=>",
  "->",
  "?->",
  "::",
  "@"
]

[operators.words]
values = [
  "and",
  "or",
  "xor",
  "instanceof"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","
colon = ":"
dot = "."

[variables]
enabled = true
prefix = "$"

[variables.patterns]
simple = "\\$[A-Za-z_][A-Za-z0-9_]*"
dynamic = "\\$\\{[^}]+\\}"

[attributes]
enabled = true
start = "#["
end = "]"

[syntax]
enabled = true
namespaces = true
classes = true
interfaces = true
traits = true
enums = true
functions = true
methods = true
properties = true
constants = true
variables = true
parameters = true
attributes = true
anonymous_functions = true
arrow_functions = true

[syntax.namespace]
scope = "entity.name.namespace.php"

[syntax.class]
scope = "entity.name.type.class.php"

[syntax.interface]
scope = "entity.name.type.interface.php"

[syntax.trait]
scope = "entity.name.type.trait.php"

[syntax.enum]
scope = "entity.name.type.enum.php"

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.php"

[syntax.method]
scope = "entity.name.function.method.php"

[syntax.property]
scope = "variable.other.property.php"

[syntax.constant]
scope = "variable.other.constant.php"

[syntax.variable]
pattern = "\\$[A-Za-z_][A-Za-z0-9_]*"
scope = "variable.other.php"

[syntax.parameter]
scope = "variable.parameter.php"

[syntax.attribute]
scope = "entity.name.type.attribute.php"

[syntax.arrow_function]
keyword = "fn"
operator = "=>"
scope = "storage.type.function.arrow.php"

[syntax.object_access]
operator = "->"
scope = "punctuation.accessor.php"

[syntax.nullsafe_access]
operator = "?->"
scope = "punctuation.accessor.nullsafe.php"

[syntax.static_access]
operator = "::"
scope = "punctuation.accessor.static.php"

[syntax.open_tag]
values = [
  "<?php",
  "<?="
]
scope = "punctuation.section.embedded.begin.php"

[syntax.close_tag]
value = "?>"
scope = "punctuation.section.embedded.end.php"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[standards]
default = "8.4"
supported = [
  "7.4",
  "8.0",
  "8.1",
  "8.2",
  "8.3",
  "8.4"
]

[runtime]
enabled = true
default = "php"

[runtime.php]
command = "php"
arguments = []

[compiler]
enabled = false

[package]
enabled = true
manifest = "composer.json"
lockfile = "composer.lock"

[package.composer]
enabled = true
command = "composer"

[formatter]
enabled = true
provider = "php-cs-fixer"
command = "php-cs-fixer"

[formatter.arguments]
values = [
  "fix"
]

[lsp]
enabled = true
provider = "intelephense"
command = "intelephense"

[lsp.arguments]
values = [
  "--stdio"
]

[diagnostics]
enabled = true

[diagnostics.syntax]
enabled = true
command = "php"

[diagnostics.syntax.arguments]
values = [
  "-l"
]

[diagnostics.phpstan]
enabled = true
command = "phpstan"

[diagnostics.psalm]
enabled = true
command = "psalm"

[debugger]
enabled = true
providers = [
  "xdebug"
]

[repl]
enabled = true
command = "php"

[repl.arguments]
values = [
  "-a"
]

[test]
enabled = true
auto_detect = true

[test.frameworks]
values = [
  "phpunit",
  "pest"
]

[tasks]
run = [
  "php",
  "$file"
]

check = [
  "php",
  "-l",
  "$file"
]

format = [
  "php-cs-fixer",
  "fix",
  "$file"
]

lint = [
  "phpstan",
  "analyse",
  "$file"
]

test = [
  "phpunit"
]

[environment]
PHP_INI_SCAN_DIR = true
COMPOSER_HOME = true
COMPOSER_CACHE_DIR = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv64",
  "ppc64",
  "s390x"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $runtime.enabled == true {
  required_path += ["runtime.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}