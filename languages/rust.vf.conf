# VFConf — Vitte Foundation Configuration Language
# languages/rust.vf.conf
#
# Rust programming language definition.

[language]
id = "rust"
name = "Rust"
display_name = "Rust"
version = "1.0"
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".rs"
]
filenames = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain",
  "rust-toolchain.toml"
]
mime = [
  "text/x-rust"
]

[lexer]
encoding = "utf-8"
unicode = true

[comments]
line = ["//"]
block = ["/*", "*/"]
nested_block = true
documentation = [
  "///",
  "//!",
  "/**",
  "/*!"
]

[strings]
double_quote = true
escape = "\\"
multiline = true

[strings.raw]
enabled = true
prefix = "r"
hash_delimiters = true
multiline = true
escape_sequences = false

[strings.byte]
enabled = true
prefix = "b"
quote = "\""

[strings.raw_byte]
enabled = true
prefix = "br"
hash_delimiters = true

[characters]
enabled = true
quote = "'"
escape = "\\"
unicode = true

[characters.byte]
enabled = true
prefix = "b"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"

[numbers.integer_suffixes]
values = [
  "i8",
  "i16",
  "i32",
  "i64",
  "i128",
  "isize",
  "u8",
  "u16",
  "u32",
  "u64",
  "u128",
  "usize"
]

[numbers.float_suffixes]
values = [
  "f32",
  "f64"
]

[keywords]
values = [
  "as",
  "async",
  "await",
  "break",
  "const",
  "continue",
  "crate",
  "dyn",
  "else",
  "enum",
  "extern",
  "false",
  "fn",
  "for",
  "if",
  "impl",
  "in",
  "let",
  "loop",
  "match",
  "mod",
  "move",
  "mut",
  "pub",
  "ref",
  "return",
  "self",
  "Self",
  "static",
  "struct",
  "super",
  "trait",
  "true",
  "type",
  "union",
  "unsafe",
  "use",
  "where",
  "while"
]

[keywords.reserved]
values = [
  "abstract",
  "become",
  "box",
  "do",
  "final",
  "gen",
  "macro",
  "override",
  "priv",
  "try",
  "typeof",
  "unsized",
  "virtual",
  "yield"
]

[keywords.control]
values = [
  "break",
  "continue",
  "else",
  "for",
  "if",
  "in",
  "loop",
  "match",
  "return",
  "while"
]

[keywords.declaration]
values = [
  "const",
  "enum",
  "extern",
  "fn",
  "impl",
  "let",
  "mod",
  "static",
  "struct",
  "trait",
  "type",
  "union",
  "use"
]

[keywords.modifiers]
values = [
  "async",
  "const",
  "dyn",
  "move",
  "mut",
  "pub",
  "ref",
  "unsafe"
]

[keywords.types]
values = [
  "bool",
  "char",
  "f32",
  "f64",
  "i8",
  "i16",
  "i32",
  "i64",
  "i128",
  "isize",
  "str",
  "u8",
  "u16",
  "u32",
  "u64",
  "u128",
  "usize"
]

[literals]
values = [
  "true",
  "false"
]

[operators]
values = [
  "+",
  "-",
  "*",
  "/",
  "%",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!",
  "&",
  "|",
  "^",
  "<<",
  ">>",
  "=",
  "+=",
  "-=",
  "*=",
  "/=",
  "%=",
  "&=",
  "|=",
  "^=",
  "<<=",
  ">>=",
  "@",
  "_",
  ".",
  "..",
  "...",
  "..=",
  ",",
  ";",
  ":",
  "::",
  "->",
  "=>",
  "#",
  "$",
  "?"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
angles = ["<", ">"]
semicolon = ";"
comma = ","
colon = ":"
double_colon = "::"
dot = "."

[attributes]
enabled = true
outer_start = "#["
inner_start = "#!["
end = "]"

[macros]
enabled = true
suffix = "!"
declarative = true
procedural = true

[syntax]
enabled = true
modules = true
functions = true
structs = true
enums = true
unions = true
traits = true
implementations = true
types = true
variables = true
constants = true
statics = true
parameters = true
lifetimes = true
generics = true
macros = true
attributes = true
async = true

[syntax.module]
scope = "entity.name.namespace.rust"

[syntax.function]
pattern = "[A-Za-z_][A-Za-z0-9_]*(?=\\s*\\()"
scope = "entity.name.function.rust"

[syntax.struct]
scope = "entity.name.type.struct.rust"

[syntax.enum]
scope = "entity.name.type.enum.rust"

[syntax.union]
scope = "entity.name.type.union.rust"

[syntax.trait]
scope = "entity.name.type.trait.rust"

[syntax.type]
scope = "entity.name.type.rust"

[syntax.variable]
scope = "variable.other.rust"

[syntax.constant]
scope = "variable.other.constant.rust"

[syntax.static]
scope = "variable.other.static.rust"

[syntax.parameter]
scope = "variable.parameter.rust"

[syntax.lifetime]
pattern = "'[A-Za-z_][A-Za-z0-9_]*"
scope = "entity.name.type.lifetime.rust"

[syntax.generic]
scope = "entity.name.type.parameter.rust"

[syntax.macro]
pattern = "[A-Za-z_][A-Za-z0-9_]*!"
scope = "entity.name.function.macro.rust"

[syntax.attribute]
scope = "entity.other.attribute-name.rust"

[syntax.async]
keywords = [
  "async",
  "await"
]
scope = "storage.modifier.async.rust"

[syntax.unsafe]
keyword = "unsafe"
scope = "storage.modifier.unsafe.rust"

[syntax.reference]
operator = "&"
scope = "keyword.operator.reference.rust"

[syntax.mutable_reference]
pattern = "&\\s*mut"
scope = "keyword.operator.reference.mutable.rust"

[syntax.path]
operator = "::"
scope = "punctuation.accessor.rust"

[syntax.range]
operators = [
  "..",
  "..="
]
scope = "keyword.operator.range.rust"

[syntax.question]
operator = "?"
scope = "keyword.operator.question.rust"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[editions]
default = "2024"
supported = [
  "2015",
  "2018",
  "2021",
  "2024"
]

[compiler]
enabled = true
auto_detect = true
default = "rustc"

[compiler.rustc]
command = "rustc"
arguments = [
  "--edition",
  "2024"
]

[build]
enabled = true
default = "cargo"

[build.cargo]
command = "cargo"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"

[build.cargo.commands]
build = [
  "cargo",
  "build"
]

check = [
  "cargo",
  "check"
]

run = [
  "cargo",
  "run"
]

test = [
  "cargo",
  "test"
]

clean = [
  "cargo",
  "clean"
]

release = [
  "cargo",
  "build",
  "--release"
]

[package]
enabled = true
manager = "cargo"
registry = "crates.io"

[formatter]
enabled = true
provider = "rustfmt"
command = "rustfmt"

[formatter.arguments]
values = [
  "--edition",
  "2024"
]

[lsp]
enabled = true
provider = "rust-analyzer"
command = "rust-analyzer"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
command = "cargo"

[diagnostics.compiler.arguments]
values = [
  "check"
]

[diagnostics.clippy]
enabled = true
command = "cargo"

[diagnostics.clippy.arguments]
values = [
  "clippy",
  "--all-targets"
]

[debugger]
enabled = true
providers = [
  "gdb",
  "lldb"
]

[repl]
enabled = false

[test]
enabled = true
command = "cargo"

[test.arguments]
values = [
  "test"
]

[benchmark]
enabled = true
command = "cargo"

[benchmark.arguments]
values = [
  "bench"
]

[tasks]
build = [
  "cargo",
  "build"
]

check = [
  "cargo",
  "check"
]

run = [
  "cargo",
  "run"
]

test = [
  "cargo",
  "test"
]

format = [
  "cargo",
  "fmt"
]

lint = [
  "cargo",
  "clippy",
  "--all-targets"
]

release = [
  "cargo",
  "build",
  "--release"
]

[environment]
CARGO_HOME = true
RUSTUP_HOME = true
RUSTFLAGS = true
RUST_BACKTRACE = true
RUST_LOG = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "s390x",
  "sparc64",
  "wasm32",
  "wasm64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "android",
  "ios",
  "wasm",
  "embedded"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $build.enabled == true {
  required_path += ["build.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}
