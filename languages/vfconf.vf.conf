# VFConf — Vitte Foundation Configuration Language
# languages/vfconf.vf.conf
#
# Canonical VFConf language definition.

[language]
id = "vfconf"
name = "VFConf"
display_name = "Vitte Foundation Configuration Language"
version = "1.0"
enabled = true
category = "configuration"
case_sensitive = true

[files]
extensions = [
  ".vf.conf"
]
filenames = []
mime = [
  "text/x-vfconf"
]

[lexer]
encoding = "utf-8"
unicode = true
incremental = true

[comments]
line = [
  "#",
  "//"
]
block = [
  "/*",
  "*/"
]
nested_block = true

[strings]
double_quote = true
single_quote = false
escape = "\\"
multiline = false

[strings.escapes]
values = [
  "\\\\",
  "\\\"",
  "\\n",
  "\\r",
  "\\t",
  "\\b",
  "\\f",
  "\\u"
]

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
digit_separator = "_"

[numbers.patterns]
integer = "[+-]?[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"
float = "[+-]?([0-9][0-9_]*\\.[0-9_]+|[0-9][0-9_]*[eE][+-]?[0-9_]+)"

[booleans]
values = [
  "true",
  "false",
  "on",
  "off"
]

[booleans.canonical]
true = "true"
false = "false"

[null]
values = [
  "null",
  "none"
]
canonical = "null"

[keywords]
values = [
  "include",
  "define",
  "when",
  "else",
  "true",
  "false",
  "on",
  "off",
  "null",
  "none",
  "rgb",
  "rgba"
]

[keywords.control]
values = [
  "include",
  "define",
  "when",
  "else"
]

[keywords.boolean]
values = [
  "true",
  "false",
  "on",
  "off"
]

[keywords.null]
values = [
  "null",
  "none"
]

[keywords.functions]
values = [
  "rgb",
  "rgba"
]

[identifiers]
enabled = true
pattern = "[A-Za-z_][A-Za-z0-9_-]*"
case_sensitive = true

[paths]
enabled = true
separator = "."
pattern = "[A-Za-z_][A-Za-z0-9_-]*(\\.[A-Za-z_][A-Za-z0-9_-]*)*"

[sections]
enabled = true
start = "["
end = "]"
separator = "."
nested = true

[assignments]
enabled = true

[assignments.operators]
assign = "="
define = ":="
add = "+="
subtract = "-="

[references]
enabled = true
prefix = "$"
separator = "."
pattern = "\\$[A-Za-z_][A-Za-z0-9_-]*(\\.[A-Za-z_][A-Za-z0-9_-]*)*"

[includes]
enabled = true
keyword = "include"
path_type = "string"
maximum_depth = 64
detect_cycles = true

[definitions]
enabled = true
keyword = "define"
case_sensitive = true
forward_references = true

[conditionals]
enabled = true
keyword = "when"
else_keyword = "else"
blocks = true

[conditionals.logical]
and = "&&"
or = "||"
not = "!"

[conditionals.comparison]
equal = "=="
not_equal = "!="
less = "<"
less_equal = "<="
greater = ">"
greater_equal = ">="

[operators]
values = [
  "=",
  ":=",
  "+=",
  "-=",
  "==",
  "!=",
  "<",
  "<=",
  ">",
  ">=",
  "&&",
  "||",
  "!"
]

[delimiters]
section = [
  "[",
  "]"
]
array = [
  "[",
  "]"
]
object = [
  "{",
  "}"
]
parentheses = [
  "(",
  ")"
]
comma = ","
colon = ":"
semicolon = ";"
dot = "."
dollar = "$"

[arrays]
enabled = true
start = "["
end = "]"
separator = ","
trailing_comma = true

[objects]
enabled = true
start = "{"
end = "}"
separator = ","
key_value_separator = ":"
trailing_comma = true
nested = true

[colors]
enabled = true
hex = true
rgb = true
rgba = true

[colors.hex]
patterns = [
  "#RGB",
  "#RGBA",
  "#RRGGBB",
  "#RRGGBBAA"
]

[colors.rgb]
function = "rgb"
components = 3
minimum = 0
maximum = 255

[colors.rgba]
function = "rgba"
components = 4
minimum = 0
maximum = 255
alpha_minimum = 0.0
alpha_maximum = 1.0

[durations]
enabled = true

[durations.units]
values = [
  "ns",
  "us",
  "ms",
  "s",
  "min",
  "h"
]

[sizes]
enabled = true

[sizes.units]
values = [
  "B",
  "KB",
  "MB",
  "GB",
  "KiB",
  "MiB",
  "GiB"
]

[terminators]
semicolon = true
newline = true

[syntax]
enabled = true
sections = true
assignments = true
references = true
includes = true
definitions = true
conditionals = true
arrays = true
objects = true
colors = true
durations = true
sizes = true

[syntax.section]
scope = "entity.name.section.vfconf"

[syntax.key]
scope = "variable.other.key.vfconf"

[syntax.reference]
scope = "variable.other.reference.vfconf"

[syntax.keyword]
scope = "keyword.control.vfconf"

[syntax.boolean]
scope = "constant.language.boolean.vfconf"

[syntax.null]
scope = "constant.language.null.vfconf"

[syntax.string]
scope = "string.quoted.double.vfconf"

[syntax.number]
scope = "constant.numeric.vfconf"

[syntax.color]
scope = "constant.other.color.vfconf"

[syntax.duration]
scope = "constant.numeric.duration.vfconf"

[syntax.size]
scope = "constant.numeric.size.vfconf"

[syntax.operator]
scope = "keyword.operator.vfconf"

[syntax.comment]
scope = "comment.vfconf"

[syntax.function]
values = [
  "rgb",
  "rgba"
]
scope = "support.function.vfconf"

[semantic]
enabled = true

[semantic.tokens]
section = "namespace"
key = "property"
reference = "variable"
definition = "variable"
keyword = "keyword"
string = "string"
number = "number"
boolean = "boolean"
null = "enumMember"
color = "number"
duration = "number"
size = "number"
comment = "comment"
operator = "operator"
function = "function"

[indentation]
enabled = true
style = "spaces"
width = 2
tab_width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[folding]
enabled = true
sections = true
blocks = true
objects = true
arrays = true
comments = true

[formatter]
enabled = true
provider = "vfconf-fmt"
command = "vfconf-fmt"

[formatter.arguments]
values = []

[diagnostics]
enabled = true
provider = "vfconf-check"
command = "vfconf-check"
language = "en"
canonical_messages = true
preserve_source_spans = true

[diagnostics.codes]
lexical = "VF0001-VF0009"
syntax = "VF0101-VF0103"
semantic = "VF0201-VF0207"
include = "VF0301-VF0304"
schema = "VF0401-VF0403"
evaluation = "VF0501-VF0502"
io = "VF0601-VF0602"
internal = "VF9001"

[lsp]
enabled = true
provider = "vfconf-lsp"
command = "vfconf-lsp"
language_id = "vfconf"

[lsp.arguments]
values = [
  "--stdio"
]

[lsp.features]
diagnostics = true
completion = true
hover = true
definition = true
references = true
rename = true
formatting = true
document_symbols = true
workspace_symbols = true
folding = true
semantic_tokens = true
code_actions = true

[schema]
enabled = true
directory = "schemas"

[schema.files]
values = [
  "schemas/syntax.schema.vf.conf",
  "schemas/theme.schema.vf.conf",
  "schemas/editor.schema.vf.conf",
  "schemas/language.schema.vf.conf",
  "schemas/keymap.schema.vf.conf"
]

[parser]
implementation = "menhir"
incremental = false
preserve_source_spans = true
maximum_nesting = 256

[lexer.implementation]
implementation = "ocamllex"

[runtime]
enabled = true
implementation = "ocaml"
strict = true
deterministic = true

[toolchain]
language = "ocaml"
build_system = "dune"
lexer = "ocamllex"
parser = "menhir"

[toolchain.executables]
main = "vfconf"
check = "vfconf-check"
dump = "vfconf-dump"
format = "vfconf-fmt"
lsp = "vfconf-lsp"

[tasks]
check = [
  "vfconf-check",
  "$file"
]

format = [
  "vfconf-fmt",
  "$file"
]

dump = [
  "vfconf-dump",
  "$file"
]

parse = [
  "vfconf",
  "$file"
]

[environment]
VFCONF_PATH = true
VFCONF_CONFIG = true
VFCONF_SCHEMA_PATH = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "s390x",
  "sparc",
  "sparc64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd"
]

[validation]
strict = true
reject_duplicate_keys = true
reject_undefined_references = true
reject_reference_cycles = true
validate_includes = true
validate_schema = true
preserve_source_spans = true

[compatibility]
extension = ".vf.conf"
mime = "text/x-vfconf"
language_id = "vfconf"

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $diagnostics.enabled == true {
  required_path += ["diagnostics.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}