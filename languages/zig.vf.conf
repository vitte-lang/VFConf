[syntax]
enabled = true
functions = true
types = true
structs = true
enums = true
unions = true
opaque_types = true
variables = true
constants = true
parameters = true
fields = true
builtins = true
error_sets = true
error_unions = true
optionals = true
comptime = true
tests = true

[syntax.function]
scope = "entity.name.function.zig"

[syntax.type]
scope = "entity.name.type.zig"

[syntax.struct]
scope = "entity.name.type.struct.zig"

[syntax.enum]
scope = "entity.name.type.enum.zig"

[syntax.union]
scope = "entity.name.type.union.zig"

[syntax.opaque]
scope = "entity.name.type.opaque.zig"

[syntax.variable]
scope = "variable.other.zig"

[syntax.constant]
scope = "variable.other.constant.zig"

[syntax.parameter]
scope = "variable.parameter.zig"

[syntax.field]
scope = "variable.other.member.zig"

[syntax.builtin]
pattern = "@[A-Za-z_][A-Za-z0-9_]*"
scope = "support.function.builtin.zig"

[syntax.error]
scope = "entity.name.type.error.zig"

[syntax.comptime]
keyword = "comptime"
scope = "storage.modifier.comptime.zig"

[syntax.optional]
operator = "?"
scope = "keyword.operator.optional.zig"

[syntax.error_union]
operator = "!"
scope = "keyword.operator.error-union.zig"

[syntax.pointer_dereference]
operator = ".*"
scope = "keyword.operator.dereference.zig"

[syntax.optional_unwrap]
operator = ".?"
scope = "keyword.operator.optional-unwrap.zig"

[syntax.range]
operators = [
  "..",
  "..."
]
scope = "keyword.operator.range.zig"

[indentation]
enabled = true
style = "spaces"
width = 4

[indentation.rules]
increase_after = ["{"]
decrease_before = ["}"]

[brackets]
pairs = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[compiler]
enabled = true
auto_detect = true
default = "zig"

[compiler.zig]
command = "zig"
arguments = []

[build]
enabled = true
default = "zig-build"

[build.zig]
command = "zig"
project_file = "build.zig"

[build.commands]
build = [
  "zig",
  "build"
]

run = [
  "zig",
  "build",
  "run"
]

test = [
  "zig",
  "build",
  "test"
]

clean = [
  "rm",
  "-rf",
  ".zig-cache",
  "zig-out"
]

[package]
enabled = true
manifest = "build.zig.zon"
manager = "zig"

[formatter]
enabled = true
provider = "zig-fmt"
command = "zig"

[formatter.arguments]
values = [
  "fmt",
  "$file"
]

[lsp]
enabled = true
provider = "zls"
command = "zls"

[lsp.arguments]
values = []

[diagnostics]
enabled = true

[diagnostics.compiler]
enabled = true
command = "zig"

[diagnostics.compiler.arguments]
values = [
  "ast-check",
  "$file"
]

[debugger]
enabled = true
providers = [
  "gdb",
  "lldb"
]

[repl]
enabled = false

[test]
enabled = true
command = "zig"

[test.arguments]
values = [
  "test",
  "$file"
]

[tasks]
run = [
  "zig",
  "run",
  "$file"
]

build = [
  "zig",
  "build"
]

check = [
  "zig",
  "ast-check",
  "$file"
]

test = [
  "zig",
  "test",
  "$file"
]

format = [
  "zig",
  "fmt",
  "$file"
]

[environment]
ZIG_GLOBAL_CACHE_DIR = true
ZIG_LOCAL_CACHE_DIR = true
ZIG_LIB_DIR = true
PATH = true

[architectures]
supported = [
  "x86",
  "x86_64",
  "arm",
  "thumb",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "sparc",
  "sparc64",
  "s390x",
  "wasm32",
  "wasm64"
]

[platforms]
supported = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd",
  "dragonfly",
  "haiku",
  "solaris",
  "android",
  "wasi",
  "freestanding"
]

[rules]
required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.default"]
}

when $build.enabled == true {
  required_path += ["build.default"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
}