# VFConf — Vitte Foundation Configuration Language
# languages/zig.vf.conf
#
# Zig programming language definition.

[language]
id = "zig"
name = "Zig"
display_name = "Zig"
version = "1.0"
enabled = true
category = "systems"
case_sensitive = true

[files]
extensions = [
  ".zig",
  ".zon"
]
filenames = [
  "build.zig",
  "build.zig.zon"
]
mime = [
  "text/x-zig"
]

[lexer]
encoding = "utf-8"
unicode = true
case_sensitive = true

[comments]
line = ["//"]
block = []
documentation = [
  "///",
  "//!"
]

[strings]
double_quote = true
escape = "\\"
multiline = false

[strings.multiline]
enabled = true
prefix = "\\\\"
line_based = true

[characters]
enabled = true
quote = "'"
escape = "\\"

[escapes]
values = [
  "\\n",
  "\\r",
  "\\t",
  "\\\\",
  "\\'",
  "\\\""
]

[escapes.hex]
enabled = true
prefix = "\\x"
digits = 2

[escapes.unicode]
enabled = true
prefix = "\\u{"
suffix = "}"

[numbers]
decimal = true
hexadecimal = true
octal = true
binary = true
floating_point = true
scientific = true
hexadecimal_float = true
digit_separator = "_"

[numbers.patterns]
decimal = "[0-9][0-9_]*"
hexadecimal = "0[xX][0-9A-Fa-f_]+"
octal = "0[oO][0-7_]+"
binary = "0[bB][01_]+"

[keywords]
values = [
  "addrspace",
  "align",
  "allowzero",
  "and",
  "anyframe",
  "anytype",
  "asm",
  "async",
  "await",
  "break",
  "callconv",
  "catch",
  "comptime",
  "const",
  "continue",
  "defer",
  "else",
  "enum",
  "errdefer",
  "error",
  "export",
  "extern",
  "fn",
  "for",
  "if",
  "inline",
  "linksection",
  "noalias",
  "noinline",
  "nosuspend",
  "opaque",
  "or",
  "orelse",
  "packed",
  "pub",
  "resume",
  "return",
  "struct",
  "suspend",
  "switch",
  "test",
  "threadlocal",
  "try",
  "union",
  "unreachable",
  "usingnamespace",
  "var",
  "volatile",
  "while"
]

[keywords.control]
values = [
  "break",
  "catch",
  "continue",
  "defer",
  "else",
  "errdefer",
  "for",
  "if",
  "orelse",
  "return",
  "switch",
  "try",
  "unreachable",
  "while"
]

[keywords.declaration]
values = [
  "const",
  "enum",
  "error",
  "export",
  "extern",
  "fn",
  "opaque",
  "struct",
  "test",
  "union",
  "usingnamespace",
  "var"
]

[keywords.modifiers]
values = [
  "addrspace",
  "align",
  "allowzero",
  "callconv",
  "comptime",
  "inline",
  "linksection",
  "noalias",
  "noinline",
  "packed",
  "pub",
  "threadlocal",
  "volatile"
]

[keywords.async]
values = [
  "async",
  "await",
  "nosuspend",
  "resume",
  "suspend"
]

[keywords.logical]
values = [
  "and",
  "or"
]

[literals]
values = [
  "true",
  "false",
  "null",
  "undefined",
  "unreachable"
]

[primitive_types]
values = [
  "anyerror",
  "anyopaque",
  "bool",
