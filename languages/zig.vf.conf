]

[operators.bitwise]
values = [
  "&",
  "|",
  "^",
  "~",
  "<<",
  ">>",
  "<<|"
]

[operators.wrapping]
values = [
  "+%",
  "-%",
  "*%"
]

[operators.saturating]
values = [
  "+|",
  "-|",
  "*|"
]

[delimiters]
parentheses = ["(", ")"]
brackets = ["[", "]"]
braces = ["{", "}"]
semicolon = ";"
comma = ","
colon = ":"
dot = "."

[builtins]
enabled = true
prefix = "@"

[builtins.values]
