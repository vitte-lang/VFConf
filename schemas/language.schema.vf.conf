[schema.diagnostics.fields.format]
type = "string"
required = false

[schema.diagnostics.fields.error_pattern]
type = "string"
required = false

[schema.diagnostics.fields.warning_pattern]
type = "string"
required = false

[schema.diagnostics.fields.information_pattern]
type = "string"
required = false

# ------------------------------------------------------------
# REPL
# ------------------------------------------------------------

[schema.repl]
description = "Interactive interpreter configuration"
allow_unknown_fields = false

[schema.repl.fields.enabled]
type = "boolean"
required = false
default = false

[schema.repl.fields.command]
type = "string"
required = false

[schema.repl.fields.args]
type = "array"
required = false
default = []

[schema.repl.fields.prompt]
type = "string"
required = false

# ------------------------------------------------------------
# Tasks
# ------------------------------------------------------------

[schema.tasks]
description = "Common language actions"
allow_unknown_fields = false

[schema.tasks.fields.check]
type = "array"
required = false
default = []

[schema.tasks.fields.build]
type = "array"
required = false
default = []

[schema.tasks.fields.run]
type = "array"
required = false
default = []

[schema.tasks.fields.test]
type = "array"
required = false
default = []

[schema.tasks.fields.clean]
type = "array"
required = false
default = []

[schema.tasks.fields.format]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Environment
# ------------------------------------------------------------

[schema.environment]
description = "Environment variables used by language tooling"
allow_unknown_fields = true

# ------------------------------------------------------------
# Architecture support
# ------------------------------------------------------------

[schema.architectures]
description = "Supported processor architectures"
allow_unknown_fields = false

[schema.architectures.fields.supported]
type = "array"
required = false
default = [
  "x86",
  "x86_64",
  "arm",
  "aarch64",
  "riscv32",
  "riscv64",
  "mips",
  "mips64",
  "powerpc",
  "powerpc64",
  "sparc",
  "sparc64"
]

[schema.architectures.fields.host_only]
type = "boolean"
required = false
default = false

# ------------------------------------------------------------
# Operating systems
# ------------------------------------------------------------

[schema.platforms]
description = "Supported operating systems"
allow_unknown_fields = false

[schema.platforms.fields.supported]
type = "array"
required = false
default = [
  "linux",
  "macos",
  "windows",
  "freebsd",
  "openbsd",
  "netbsd"
]

# ------------------------------------------------------------
# Validation rules
# ------------------------------------------------------------

[rules]

required_path = [
  "language.id",
  "language.name",
  "files.extensions"
]

when $compiler.enabled == true {
  required_path += ["compiler.command"]
}

when $interpreter.enabled == true {
  required_path += ["interpreter.command"]
}

when $formatter.enabled == true {
  required_path += ["formatter.command"]
}

when $lsp.enabled == true {
  required_path += ["lsp.command"]
  required_path += ["lsp.language_id"]
}

when $debugger.enabled == true {
  required_path += ["debugger.adapter"]
}

rule = [
  {
    name: "unique-language-id",
    severity: "error",
    target: "language.id"
  },

  {
    name: "valid-extension",
    severity: "error",
    target: "files.extensions"
  },

  {
    name: "valid-language-id",
    severity: "error",
    target: "language.id"
  },

  {
    name: "valid-mime-type",
    severity: "warning",
    target: "language.mime"
  }
]
