[schema.build.fields.system]
type = "string"
required = false

[schema.build.fields.files]
type = "array"
required = false
default = []

[schema.build.fields.command]
type = "string"
required = false

[schema.build.fields.args]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Language server
# ------------------------------------------------------------

[schema.lsp]
