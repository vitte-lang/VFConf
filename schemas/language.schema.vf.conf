# VFConf — Vitte Foundation Configuration Language
# schemas/language.schema.vf.conf
#
# Canonical schema for language definitions.
#
# Language files:
#   languages/vitte.vf.conf
#   languages/c.vf.conf
#   languages/cpp.vf.conf
#   languages/rust.vf.conf
#   languages/ocaml.vf.conf
#   languages/vfconf.vf.conf

[schema]
name = "language"
version = "1.0"
description = "VFConf programming language definition schema"
target = "languages/*.vf.conf"
allow_unknown_sections = false

# ------------------------------------------------------------
# Language identity
# ------------------------------------------------------------

[schema.language]
description = "Language identity and metadata"
allow_unknown_fields = false

[schema.language.fields.id]
type = "string"
required = true
non_empty = true

[schema.language.fields.name]
type = "string"
required = true
non_empty = true

[schema.language.fields.display_name]
type = "string"
required = false

[schema.language.fields.version]
type = "string"
required = false

[schema.language.fields.enabled]
type = "boolean"
required = false
default = true

[schema.language.fields.mime]
type = "string"
required = false

[schema.language.fields.website]
type = "string"
required = false

[schema.language.fields.description]
type = "string"
required = false

# ------------------------------------------------------------
# File detection
# ------------------------------------------------------------

[schema.files]
description = "File names and extensions associated with the language"
allow_unknown_fields = false

[schema.files.fields.extensions]
type = "array"
required = true
non_empty = true

[schema.files.fields.filenames]
type = "array"
required = false
default = []

[schema.files.fields.patterns]
type = "array"
required = false
default = []

[schema.files.fields.shebangs]
type = "array"
required = false
default = []

[schema.files.fields.case_sensitive]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Lexical configuration
# ------------------------------------------------------------

[schema.lexer]
description = "Lexical rules used by syntax highlighting and tooling"
allow_unknown_fields = false

[schema.lexer.fields.enabled]
type = "boolean"
required = false
default = true

[schema.lexer.fields.case_sensitive]
type = "boolean"
required = false
default = true

[schema.lexer.fields.unicode_identifiers]
type = "boolean"
required = false
default = false

[schema.lexer.fields.identifier_start]
type = "string"
required = false

[schema.lexer.fields.identifier_continue]
type = "string"
required = false

# ------------------------------------------------------------
# Comments
# ------------------------------------------------------------

[schema.comments]
description = "Language comment syntax"
allow_unknown_fields = false

[schema.comments.fields.line]
type = "array"
required = false
default = []

[schema.comments.fields.block_start]
type = "string"
required = false

[schema.comments.fields.block_end]
type = "string"
required = false

[schema.comments.fields.nested_block]
type = "boolean"
required = false
default = false

[schema.comments.fields.documentation]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Strings
# ------------------------------------------------------------

[schema.strings]
description = "String literal configuration"
allow_unknown_fields = false

[schema.strings.fields.delimiters]
type = "array"
required = false
default = ["\""]

[schema.strings.fields.escape]
type = "string"
required = false
default = "\\"

[schema.strings.fields.multiline]
type = "boolean"
required = false
default = false

[schema.strings.fields.raw]
type = "boolean"
required = false
default = false

[schema.strings.fields.interpolation]
type = "boolean"
required = false
default = false

# ------------------------------------------------------------
# Numbers
# ------------------------------------------------------------

[schema.numbers]
description = "Numeric literal capabilities"
allow_unknown_fields = false

[schema.numbers.fields.decimal]
type = "boolean"
required = false
default = true

[schema.numbers.fields.hexadecimal]
type = "boolean"
required = false
default = false

[schema.numbers.fields.binary]
type = "boolean"
required = false
default = false

[schema.numbers.fields.octal]
type = "boolean"
required = false
default = false

[schema.numbers.fields.float]
type = "boolean"
required = false
default = true

[schema.numbers.fields.exponent]
type = "boolean"
required = false
default = true

[schema.numbers.fields.separator]
type = "string"
required = false
default = "_"

# ------------------------------------------------------------
# Keywords
# ------------------------------------------------------------

[schema.keywords]
description = "Keyword groups used by highlighting and completion"
allow_unknown_fields = false

[schema.keywords.fields.control]
type = "array"
required = false
default = []

[schema.keywords.fields.declaration]
type = "array"
required = false
default = []

[schema.keywords.fields.type]
type = "array"
required = false
default = []

[schema.keywords.fields.modifier]
type = "array"
required = false
default = []

[schema.keywords.fields.operator]
type = "array"
required = false
default = []

[schema.keywords.fields.literal]
type = "array"
required = false
default = []

[schema.keywords.fields.builtin]
type = "array"
required = false
default = []

[schema.keywords.fields.reserved]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Operators
# ------------------------------------------------------------

[schema.operators]
description = "Language operators"
allow_unknown_fields = false

[schema.operators.fields.assignment]
type = "array"
required = false
default = []

[schema.operators.fields.arithmetic]
type = "array"
required = false
default = []

[schema.operators.fields.comparison]
type = "array"
required = false
default = []

[schema.operators.fields.logical]
type = "array"
required = false
default = []

[schema.operators.fields.bitwise]
type = "array"
required = false
default = []

[schema.operators.fields.other]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Delimiters
# ------------------------------------------------------------

[schema.delimiters]
description = "Structural delimiters"
allow_unknown_fields = false

[schema.delimiters.fields.parentheses]
type = "array"
required = false
default = ["(", ")"]

[schema.delimiters.fields.brackets]
type = "array"
required = false
default = ["[", "]"]

[schema.delimiters.fields.braces]
type = "array"
required = false
default = ["{", "}"]

[schema.delimiters.fields.statement]
type = "array"
required = false
default = [";"]

# ------------------------------------------------------------
# Indentation
# ------------------------------------------------------------

[schema.indentation]
description = "Language indentation behaviour"
allow_unknown_fields = false

[schema.indentation.fields.enabled]
type = "boolean"
required = false
default = true

[schema.indentation.fields.width]
type = "integer"
required = false
default = 4
min_integer = 1
max_integer = 16

[schema.indentation.fields.tabs]
type = "boolean"
required = false
default = false

[schema.indentation.fields.increase_after]
type = "array"
required = false
default = []

[schema.indentation.fields.decrease_before]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Bracket matching
# ------------------------------------------------------------

[schema.brackets]
description = "Bracket matching and automatic closing"
allow_unknown_fields = false

[schema.brackets.fields.pairs]
type = "array"
required = false
default = [
  ["(", ")"],
  ["[", "]"],
  ["{", "}"]
]

[schema.brackets.fields.auto_close]
type = "boolean"
required = false
default = true

[schema.brackets.fields.highlight_matching]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# Syntax highlighting
# ------------------------------------------------------------

[schema.syntax]
description = "Syntax highlighting configuration"
allow_unknown_fields = false

[schema.syntax.fields.enabled]
type = "boolean"
required = false
default = true

[schema.syntax.fields.definition]
type = "string"
required = false

[schema.syntax.fields.semantic]
type = "boolean"
required = false
default = true

[schema.syntax.fields.fallback]
