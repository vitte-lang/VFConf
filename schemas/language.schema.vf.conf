[schema.lsp.fields.enabled]
type = "boolean"
required = false
default = false

[schema.lsp.fields.command]
type = "string"
required = false

[schema.lsp.fields.args]
type = "array"
required = false
default = []

[schema.lsp.fields.language_id]
type = "string"
required = false

[schema.lsp.fields.initialization_options]
