  "priority",
  "declaration",
  "longest"
]

[schema.patterns.fields.maximum_matches]
type = "integer"
required = false
default = 100000
min_integer = 1

# ------------------------------------------------------------
# Scope mapping
# ------------------------------------------------------------

[schema.scopes]
description = "Canonical syntax scope names"
allow_unknown_fields = true

# ------------------------------------------------------------
# Validation
# ------------------------------------------------------------

[rules]

required_path = [
  "syntax.id",
  "syntax.name",
  "syntax.language"
]

when $strings.interpolation == true {
  required_path += ["strings.interpolation_start"]
  required_path += ["strings.interpolation_end"]
}

when $functions.enabled == true {
  rule += [
    {
      name: "valid-function-syntax",
      severity: "error",
      target: "functions"
    }
  ]
}

when $attributes.enabled == true {
  required_path += ["attributes.pattern"]
}

when $preprocessor.enabled == true {
  required_path += ["preprocessor.pattern"]
}

when $references.enabled == true {
  required_path += ["references.pattern"]
}

when $sections.enabled == true {
  required_path += ["sections.pattern"]
}

when $folding.regions == true {
  required_path += ["folding.region_start"]
  required_path += ["folding.region_end"]
}

rule = [
  {
    name: "unique-syntax-id",
    severity: "error",
    target: "syntax.id"
  },

  {
    name: "valid-language-reference",
    severity: "error",
    target: "syntax.language"
  },

  {
    name: "valid-file-pattern",
    severity: "error",
    target: "files.patterns"
  },

  {
    name: "valid-regex",
    severity: "error",
    target: "pattern.regex"
  },

  {
    name: "valid-scope",
    severity: "error",
    target: "pattern.scope"
  },

  {
    name: "non-overlapping-delimiters",
    severity: "warning",
    target: "delimiters"
  },

  {
    name: "duplicate-keyword",
    severity: "warning",
    target: "keywords"
  }
]
