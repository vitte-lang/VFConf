# Pattern engine
# ------------------------------------------------------------

[schema.patterns]
description = "Custom syntax pattern engine"
allow_unknown_fields = false

[schema.patterns.fields.enabled]
type = "boolean"
required = false
default = true

[schema.patterns.fields.engine]
type = "string"
required = false
default = "regex"

[schema.patterns.fields.order]
type = "string"
required = false
default = "priority"
