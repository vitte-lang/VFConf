# VFConf — Vitte Foundation Configuration Language
# schemas/syntax.schema.vf.conf
#
# Canonical schema for syntax.vf.conf.
#
# Defines lexical and syntactic highlighting rules used by editors,
# terminal editors, syntax engines and future VFConf tooling.

[schema]
name = "syntax"
version = "1.0"
description = "VFConf syntax highlighting definition schema"
target = "syntax.vf.conf"
allow_unknown_sections = false

# ------------------------------------------------------------
# Syntax identity
# ------------------------------------------------------------

[schema.syntax]
description = "Syntax definition metadata"
allow_unknown_fields = false

[schema.syntax.fields.id]
type = "string"
required = true
non_empty = true

[schema.syntax.fields.name]
type = "string"
required = true
non_empty = true

[schema.syntax.fields.language]
type = "string"
required = true
non_empty = true

[schema.syntax.fields.version]
type = "string"
required = false
default = "1.0"

[schema.syntax.fields.enabled]
type = "boolean"
required = false
default = true

[schema.syntax.fields.description]
type = "string"
required = false

[schema.syntax.fields.case_sensitive]
type = "boolean"
required = false
default = true

# ------------------------------------------------------------
# File detection
# ------------------------------------------------------------

[schema.files]
description = "Files handled by this syntax definition"
allow_unknown_fields = false

[schema.files.fields.extensions]
type = "array"
required = false
default = []

[schema.files.fields.filenames]
type = "array"
required = false
default = []

[schema.files.fields.patterns]
type = "array"
required = false
default = []

[schema.files.fields.shebangs]
type = "array"
required = false
default = []

[schema.files.fields.mime_types]
type = "array"
required = false
default = []

# ------------------------------------------------------------
# Lexer
# ------------------------------------------------------------

[schema.lexer]
description = "General lexical configuration"
allow_unknown_fields = false

[schema.lexer.fields.case_sensitive]
type = "boolean"
required = false
default = true

[schema.lexer.fields.unicode]
type = "boolean"
required = false
default = true

[schema.lexer.fields.longest_match]
type = "boolean"
required = false
default = true

[schema.lexer.fields.skip_whitespace]
type = "boolean"
required = false
default = true

[schema.lexer.fields.identifier_start]
type = "string"
required = false
default = "[A-Za-z_]"

[schema.lexer.fields.identifier_continue]
type = "string"
required = false
default = "[A-Za-z0-9_-]"

# ------------------------------------------------------------
# Comments
# ------------------------------------------------------------

[schema.comments]
description = "Comment syntax"
allow_unknown_fields = false

[schema.comments.fields.line]
type = "array"
required = false
default = []

[schema.comments.fields.block]
type = "array"
required = false
default = []

[schema.comments.fields.documentation]
type = "array"
required = false
default = []

[schema.comments.fields.nested]
type = "boolean"
required = false
default = false

[schema.comments.fields.scope]
type = "string"
required = false
default = "comment"

# ------------------------------------------------------------
# Strings
# ------------------------------------------------------------

[schema.strings]
description = "String literal syntax"
allow_unknown_fields = false

[schema.strings.fields.delimiters]
type = "array"
required = false
default = ["\""]

[schema.strings.fields.escape]
type = "string"
