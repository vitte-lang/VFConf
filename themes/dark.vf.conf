# VFConf — Vitte Foundation Configuration Language
# themes/dark.vf.conf
#
# Canonical dark theme for VFConf-compatible editors and terminal tooling.

[theme]
id = "dark"
name = "VFConf Dark"
display_name = "VFConf Dark"
version = "1.0"
type = "dark"
enabled = true
high_contrast = false

[ui]
background = "#111318"
foreground = "#D8DEE9"
border = "#303540"
separator = "#282D36"
focus = "#6EA8FE"
disabled = "#6C7480"
shadow = "#00000080"

[editor]
background = "#111318"
foreground = "#D8DEE9"
selection_background = "#31405A"
selection_foreground = "#FFFFFF"
inactive_selection_background = "#252F40"
current_line_background = "#171A20"
current_line_border = "#242A34"
find_match_background = "#6A5320"
find_match_foreground = "#FFFFFF"
find_match_current_background = "#8A6824"
find_match_current_foreground = "#FFFFFF"
word_highlight_background = "#25334A"
word_highlight_strong_background = "#304362"
range_highlight_background = "#202A38"
indent_guide = "#292F39"
indent_guide_active = "#4A5566"
whitespace = "#3B424D"
cursor = "#F2F4F8"
cursor_secondary = "#8F98A8"
link = "#6EA8FE"

[gutter]
background = "#0E1014"
foreground = "#697281"
active_foreground = "#D8DEE9"
border = "#242933"
line_number = "#697281"
line_number_active = "#D8DEE9"
added = "#4FAF72"
modified = "#D6A84B"
deleted = "#E06C75"

[terminal]
background = "#0D0F13"
foreground = "#D8DEE9"
cursor = "#F2F4F8"
cursor_text = "#111318"
selection_background = "#31405A"
selection_foreground = "#FFFFFF"

[terminal_ansi]
black = "#1B1D23"
red = "#E06C75"
green = "#7EC699"
yellow = "#E5C07B"
blue = "#61AFEF"
magenta = "#C678DD"
cyan = "#56B6C2"
white = "#D8DEE9"
bright_black = "#5C6370"
bright_red = "#FF7A85"
bright_green = "#98D8AA"
bright_yellow = "#F0C987"
bright_blue = "#7CC2FF"
bright_magenta = "#D99AF0"
bright_cyan = "#72D1DD"
bright_white = "#FFFFFF"

[panel]
background = "#101217"
foreground = "#D8DEE9"
border = "#292E38"
title_foreground = "#F0F2F6"
title_background = "#15181E"

[sidebar]
background = "#0F1116"
foreground = "#C9D0DA"
border = "#292E38"
section_background = "#14171D"
section_foreground = "#E2E6EC"
selection_background = "#25334A"
selection_foreground = "#FFFFFF"
inactive_selection_background = "#1C2533"
hover_background = "#191E27"

[statusbar]
background = "#171B22"
foreground = "#D8DEE9"
border = "#2C323D"
active_background = "#1E2632"
active_foreground = "#FFFFFF"
warning_background = "#5D481A"
warning_foreground = "#FFE6A3"
error_background = "#57282E"
error_foreground = "#FFD7DA"

[tabs]
background = "#0F1116"
foreground = "#8D96A5"
active_background = "#171A20"
active_foreground = "#F0F2F6"
active_border = "#6EA8FE"
inactive_background = "#111318"
inactive_foreground = "#7D8694"
hover_background = "#191E27"
border = "#292E38"
dirty = "#D6A84B"

[menu]
background = "#171A20"
foreground = "#D8DEE9"
border = "#343A45"
selection_background = "#29374D"
selection_foreground = "#FFFFFF"
separator = "#343A45"
disabled = "#6C7480"

[input]
background = "#171A20"
foreground = "#E1E5EB"
border = "#3A414D"
focus_border = "#6EA8FE"
placeholder = "#707987"
selection_background = "#31405A"
selection_foreground = "#FFFFFF"

[button]
background = "#28364A"
foreground = "#FFFFFF"
border = "#3B4B63"
hover_background = "#34465F"
active_background = "#405674"
disabled_background = "#20242B"
disabled_foreground = "#686F7A"

[scrollbar]
track = "#111318"
thumb = "#353C48"
thumb_hover = "#46505F"
thumb_active = "#596576"

[minimap]
background = "#0F1115"
foreground = "#59616D"
selection = "#5D78A080"
find_match = "#D6A84B80"
error = "#E06C75"
warning = "#E5C07B"

[diagnostics]
error = "#F07178"
warning = "#E5C07B"
information = "#61AFEF"
hint = "#56B6C2"
unnecessary = "#68717F"
deprecated = "#9A849F"

[diagnostics.background]
error = "#F0717818"
warning = "#E5C07B18"
information = "#61AFEF18"
hint = "#56B6C218"

[diagnostics.underline]
error = "#F07178"
warning = "#E5C07B"
information = "#61AFEF"
hint = "#56B6C2"

[diff]
added_background = "#1D3928"
added_foreground = "#A8DDB8"
removed_background = "#432328"
removed_foreground = "#F2A7AD"
modified_background = "#3B321F"
modified_foreground = "#EFD28A"
added_gutter = "#4FAF72"
removed_gutter = "#E06C75"
modified_gutter = "#D6A84B"

[syntax]
foreground = "#D8DEE9"
background = "#111318"

[syntax.comment]
foreground = "#6A737D"
italic = true

[syntax.documentation]
foreground = "#7D8792"
italic = true

[syntax.keyword]
foreground = "#C792EA"
bold = false

[syntax.control]
foreground = "#C792EA"

[syntax.declaration]
foreground = "#BB80B3"

[syntax.modifier]
foreground = "#D49BD4"

[syntax.operator]
foreground = "#89DDFF"

[syntax.punctuation]
foreground = "#AAB2BF"

[syntax.string]
foreground = "#C3E88D"

[syntax.character]
foreground = "#C3E88D"

[syntax.escape]
foreground = "#F78C6C"

[syntax.number]
foreground = "#F78C6C"

[syntax.boolean]
foreground = "#FF9CAC"

[syntax.null]
foreground = "#FF9CAC"

[syntax.variable]
foreground = "#D8DEE9"

[syntax.variable_builtin]
foreground = "#FFCB6B"

[syntax.parameter]
foreground = "#F2C38B"

[syntax.property]
foreground = "#82AAFF"

[syntax.constant]
foreground = "#FFCB6B"

[syntax.function]
foreground = "#82AAFF"

[syntax.method]
foreground = "#82AAFF"

[syntax.type]
foreground = "#FFCB6B"

[syntax.class]
foreground = "#FFCB6B"

[syntax.struct]
foreground = "#FFCB6B"

[syntax.enum]
foreground = "#FFCB6B"

[syntax.interface]
foreground = "#C3E88D"

[syntax.trait]
foreground = "#C3E88D"

[syntax.namespace]
foreground = "#89DDFF"

[syntax.module]
foreground = "#89DDFF"

[syntax.attribute]
foreground = "#F2C38B"

[syntax.decorator]
foreground = "#F2C38B"

[syntax.macro]
foreground = "#C792EA"

[syntax.label]
foreground = "#89DDFF"

[syntax.lifetime]
foreground = "#F2C38B"

[syntax.regex]
foreground = "#89DDFF"

[syntax.reference]
foreground = "#82AAFF"

[syntax.section]
foreground = "#89DDFF"
bold = true

[syntax.key]
foreground = "#82AAFF"

[syntax.color]
foreground = "#F78C6C"

[syntax.duration]
foreground = "#F78C6C"

[syntax.size]
foreground = "#F78C6C"

[syntax.invalid]
foreground = "#FFFFFF"
background = "#B33945"

[token_style]
comment = "italic"
documentation = "italic"
keyword = "normal"
control = "normal"
declaration = "normal"
modifier = "normal"
operator = "normal"
string = "normal"
number = "normal"
function = "normal"
type = "normal"
section = "bold"

[semantic]
enabled = true

[semantic.variable]
foreground = "#D8DEE9"

[semantic.variable.readonly]
foreground = "#FFCB6B"

[semantic.variable.static]
foreground = "#E8B46A"

[semantic.parameter]
foreground = "#F2C38B"

[semantic.property]
foreground = "#82AAFF"

[semantic.function]
foreground = "#82AAFF"

[semantic.function.async]
foreground = "#7EC8E3"

[semantic.method]
foreground = "#82AAFF"

[semantic.type]
foreground = "#FFCB6B"

[semantic.type_parameter]
foreground = "#F2C38B"

[semantic.class]
foreground = "#FFCB6B"

[semantic.struct]
foreground = "#FFCB6B"

[semantic.enum]
foreground = "#FFCB6B"

[semantic.enum_member]
foreground = "#F78C6C"

[semantic.interface]
foreground = "#C3E88D"

[semantic.namespace]
foreground = "#89DDFF"

[semantic.macro]
foreground = "#C792EA"

[semantic.keyword]
foreground = "#C792EA"

[semantic.operator]
foreground = "#89DDFF"

[semantic.string]
foreground = "#C3E88D"

[semantic.number]
foreground = "#F78C6C"

[semantic.comment]
foreground = "#6A737D"

[semantic_modifiers]
declaration = "normal"
definition = "normal"
readonly = "normal"
static = "normal"
deprecated = "strikethrough"
abstract = "italic"
async = "italic"
modification = "normal"
documentation = "italic"
default_library = "normal"

[font]
family = "monospace"
size = 14
weight = "normal"
line_height = 1.4
ligatures = true

[font.editor]
family = "monospace"
size = 14
weight = "normal"
ligatures = true

[font.terminal]
family = "monospace"
size = 13
weight = "normal"
ligatures = false

[link]
foreground = "#6EA8FE"
active_foreground = "#8EBBFF"
visited_foreground = "#B69ADF"
underline = true

[notification]
background = "#191D24"
foreground = "#D8DEE9"
border = "#343B47"

[notification.info]
accent = "#61AFEF"

[notification.warning]
accent = "#E5C07B"

[notification.error]
accent = "#F07178"

[notification.success]
accent = "#7EC699"

[accessibility]
minimum_contrast = 4.5
focus_indicator = "#6EA8FE"
high_visibility_cursor = true
underline_links = true

[custom]
accent_primary = "#6EA8FE"
accent_secondary = "#C792EA"
accent_success = "#7EC699"
accent_warning = "#E5C07B"
accent_error = "#F07178"

[rules]
required_path = [
  "theme.id",
  "theme.name",
  "theme.type",
  "editor.background",
  "editor.foreground",
  "syntax.foreground"
]

when $theme.enabled == true {
  required_path += ["ui.background"]
}

when $semantic.enabled == true {
  required_path += ["semantic.variable.foreground"]
}