# VFConf — Vitte Foundation Configuration Language
# themes/high-contrast.vf.conf
#
# Canonical high-contrast theme for VFConf-compatible editors
# and terminal tooling.

[theme]
id = "high-contrast"
name = "VFConf High Contrast"
display_name = "VFConf High Contrast"
version = "1.0"
type = "dark"
enabled = true
high_contrast = true

[ui]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"
separator = "#808080"
focus = "#00BFFF"
disabled = "#A0A0A0"
shadow = "#000000"

[editor]
background = "#000000"
foreground = "#FFFFFF"
selection_background = "#005A9E"
selection_foreground = "#FFFFFF"
inactive_selection_background = "#333333"
current_line_background = "#151515"
current_line_border = "#FFFFFF"
find_match_background = "#8A6500"
find_match_foreground = "#FFFFFF"
find_match_current_background = "#B88600"
find_match_current_foreground = "#FFFFFF"
word_highlight_background = "#003D66"
word_highlight_strong_background = "#005A94"
range_highlight_background = "#202020"
indent_guide = "#606060"
indent_guide_active = "#FFFFFF"
whitespace = "#808080"
cursor = "#FFFFFF"
cursor_secondary = "#00FFFF"
link = "#40C4FF"

[gutter]
background = "#000000"
foreground = "#B0B0B0"
active_foreground = "#FFFFFF"
border = "#FFFFFF"
line_number = "#B0B0B0"
line_number_active = "#FFFFFF"
added = "#00FF66"
modified = "#FFD700"
deleted = "#FF4D4D"

[terminal]
background = "#000000"
foreground = "#FFFFFF"
cursor = "#FFFFFF"
cursor_text = "#000000"
selection_background = "#005A9E"
selection_foreground = "#FFFFFF"

[terminal_ansi]
black = "#000000"
red = "#FF5555"
green = "#50FA7B"
yellow = "#F1FA8C"
blue = "#5CAEFF"
magenta = "#FF79C6"
cyan = "#8BE9FD"
white = "#F8F8F2"
bright_black = "#808080"
bright_red = "#FF8080"
bright_green = "#80FF9F"
bright_yellow = "#FFFFA6"
bright_blue = "#80C4FF"
bright_magenta = "#FF9ED2"
bright_cyan = "#B0F2FF"
bright_white = "#FFFFFF"

[panel]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"
title_foreground = "#FFFFFF"
title_background = "#151515"

[sidebar]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"
section_background = "#151515"
section_foreground = "#FFFFFF"
selection_background = "#005A9E"
selection_foreground = "#FFFFFF"
inactive_selection_background = "#303030"
hover_background = "#202020"

[statusbar]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"
active_background = "#004C80"
active_foreground = "#FFFFFF"
warning_background = "#6B5200"
warning_foreground = "#FFFF00"
error_background = "#700000"
error_foreground = "#FFFFFF"

[tabs]
background = "#000000"
foreground = "#C0C0C0"
active_background = "#151515"
active_foreground = "#FFFFFF"
active_border = "#00BFFF"
inactive_background = "#000000"
inactive_foreground = "#A0A0A0"
hover_background = "#202020"
border = "#FFFFFF"
dirty = "#FFD700"

[menu]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"
selection_background = "#005A9E"
selection_foreground = "#FFFFFF"
separator = "#808080"
disabled = "#A0A0A0"

[input]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"
focus_border = "#00BFFF"
placeholder = "#B0B0B0"
selection_background = "#005A9E"
selection_foreground = "#FFFFFF"

[button]
background = "#005A9E"
foreground = "#FFFFFF"
border = "#FFFFFF"
hover_background = "#007ACC"
active_background = "#008FE6"
disabled_background = "#303030"
disabled_foreground = "#A0A0A0"

[scrollbar]
track = "#000000"
thumb = "#808080"
thumb_hover = "#B0B0B0"
thumb_active = "#FFFFFF"

[minimap]
background = "#000000"
foreground = "#A0A0A0"
selection = "#00BFFF80"
find_match = "#FFD700"
error = "#FF5555"
warning = "#FFFF00"

[diagnostics]
error = "#FF5555"
warning = "#FFFF00"
information = "#40C4FF"
hint = "#00FFFF"
unnecessary = "#B0B0B0"
deprecated = "#FF9EFF"

[diagnostics.background]
error = "#660000"
warning = "#554400"
information = "#003D66"
hint = "#004D4D"

[diagnostics.underline]
error = "#FF5555"
warning = "#FFFF00"
information = "#40C4FF"
hint = "#00FFFF"

[diff]
added_background = "#003D18"
added_foreground = "#80FFA6"
removed_background = "#550000"
removed_foreground = "#FF9999"
modified_background = "#554400"
modified_foreground = "#FFFF80"
added_gutter = "#00FF66"
removed_gutter = "#FF4D4D"
modified_gutter = "#FFD700"

[syntax]
foreground = "#FFFFFF"
background = "#000000"

[syntax.comment]
foreground = "#B0B0B0"
italic = true

[syntax.documentation]
foreground = "#D0D0D0"
italic = true

[syntax.keyword]
foreground = "#FF80FF"
bold = true

[syntax.control]
foreground = "#FF80FF"
bold = true

[syntax.declaration]
foreground = "#FF9EFF"
bold = true

[syntax.modifier]
foreground = "#FFB3FF"

[syntax.operator]
foreground = "#00FFFF"
bold = true

[syntax.punctuation]
foreground = "#FFFFFF"

[syntax.string]
foreground = "#80FF80"

[syntax.character]
foreground = "#80FF80"

[syntax.escape]
foreground = "#FFB366"

[syntax.number]
foreground = "#FFB366"

[syntax.boolean]
foreground = "#FF99AA"
bold = true

[syntax.null]
foreground = "#FF99AA"
bold = true

[syntax.variable]
foreground = "#FFFFFF"

[syntax.variable_builtin]
foreground = "#FFFF66"

[syntax.parameter]
foreground = "#FFD080"

[syntax.property]
foreground = "#80C4FF"

[syntax.constant]
foreground = "#FFFF66"

[syntax.function]
foreground = "#80C4FF"
bold = true

[syntax.method]
foreground = "#80C4FF"

[syntax.type]
foreground = "#FFFF66"
bold = true

[syntax.class]
foreground = "#FFFF66"
bold = true

[syntax.struct]
foreground = "#FFFF66"
bold = true

[syntax.enum]
foreground = "#FFFF66"
bold = true

[syntax.interface]
foreground = "#80FF80"

[syntax.trait]
foreground = "#80FF80"

[syntax.namespace]
foreground = "#00FFFF"

[syntax.module]
foreground = "#00FFFF"

[syntax.attribute]
foreground = "#FFD080"

[syntax.decorator]
foreground = "#FFD080"

[syntax.macro]
foreground = "#FF80FF"

[syntax.label]
foreground = "#00FFFF"

[syntax.lifetime]
foreground = "#FFD080"

[syntax.regex]
foreground = "#00FFFF"

[syntax.reference]
foreground = "#80C4FF"

[syntax.section]
foreground = "#00FFFF"
bold = true

[syntax.key]
foreground = "#80C4FF"
bold = true

[syntax.color]
foreground = "#FFB366"

[syntax.duration]
foreground = "#FFB366"

[syntax.size]
foreground = "#FFB366"

[syntax.invalid]
foreground = "#FFFFFF"
background = "#B00020"
bold = true

[token_style]
comment = "italic"
documentation = "italic"
keyword = "bold"
control = "bold"
declaration = "bold"
modifier = "normal"
operator = "bold"
string = "normal"
number = "normal"
function = "bold"
type = "bold"
section = "bold"

[semantic]
enabled = true

[semantic.variable]
foreground = "#FFFFFF"

[semantic.variable.readonly]
foreground = "#FFFF66"

[semantic.variable.static]
foreground = "#FFD966"

[semantic.parameter]
foreground = "#FFD080"

[semantic.property]
foreground = "#80C4FF"

[semantic.function]
foreground = "#80C4FF"
bold = true

[semantic.function.async]
foreground = "#80FFFF"
bold = true

[semantic.method]
foreground = "#80C4FF"

[semantic.type]
foreground = "#FFFF66"
bold = true

[semantic.type_parameter]
foreground = "#FFD080"

[semantic.class]
foreground = "#FFFF66"
bold = true

[semantic.struct]
foreground = "#FFFF66"
bold = true

[semantic.enum]
foreground = "#FFFF66"
bold = true

[semantic.enum_member]
foreground = "#FFB366"

[semantic.interface]
foreground = "#80FF80"

[semantic.namespace]
foreground = "#00FFFF"

[semantic.macro]
foreground = "#FF80FF"

[semantic.keyword]
foreground = "#FF80FF"
bold = true

[semantic.operator]
foreground = "#00FFFF"
bold = true

[semantic.string]
foreground = "#80FF80"

[semantic.number]
foreground = "#FFB366"

[semantic.comment]
foreground = "#B0B0B0"

[semantic_modifiers]
declaration = "bold"
definition = "bold"
readonly = "normal"
static = "normal"
deprecated = "strikethrough"
abstract = "italic"
async = "bold"
modification = "normal"
documentation = "italic"
default_library = "normal"

[font]
family = "monospace"
size = 15
weight = "normal"
line_height = 1.5
ligatures = false

[font.editor]
family = "monospace"
size = 15
weight = "normal"
ligatures = false

[font.terminal]
family = "monospace"
size = 14
weight = "normal"
ligatures = false

[link]
foreground = "#40C4FF"
active_foreground = "#80D8FF"
visited_foreground = "#D5A6FF"
underline = true

[notification]
background = "#000000"
foreground = "#FFFFFF"
border = "#FFFFFF"

[notification.info]
accent = "#40C4FF"

[notification.warning]
accent = "#FFFF00"

[notification.error]
accent = "#FF5555"

[notification.success]
accent = "#50FA7B"

[accessibility]
minimum_contrast = 7.0
focus_indicator = "#00BFFF"
high_visibility_cursor = true
underline_links = true
high_contrast = true
reduce_transparency = true
distinguish_without_color = true

[custom]
accent_primary = "#00BFFF"
accent_secondary = "#FF80FF"
accent_success = "#50FA7B"
accent_warning = "#FFFF00"
accent_error = "#FF5555"

[rules]
required_path = [
  "theme.id",
  "theme.name",
  "theme.type",
  "editor.background",
  "editor.foreground",
  "syntax.foreground"
]

when $theme.enabled == true {
  required_path += ["ui.background"]
}

when $semantic.enabled == true {
  required_path += ["semantic.variable.foreground"]
}