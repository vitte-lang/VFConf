# VFConf — Vitte Foundation Configuration Language
# themes/light.vf.conf
#
# Canonical light theme for VFConf-compatible editors and terminal tooling.

[theme]
id = "light"
name = "VFConf Light"
display_name = "VFConf Light"
version = "1.0"
type = "light"
enabled = true
high_contrast = false

[ui]
background = "#F7F8FA"
foreground = "#24272E"
border = "#C9CDD4"
separator = "#D9DCE2"
focus = "#006FD6"
disabled = "#8A9099"
shadow = "#00000030"

[editor]
background = "#FFFFFF"
foreground = "#24272E"
selection_background = "#B8D7F5"
selection_foreground = "#111318"
inactive_selection_background = "#DCE8F3"
current_line_background = "#F4F6F8"
current_line_border = "#E2E5E9"
find_match_background = "#F6D77A"
find_match_foreground = "#24272E"
find_match_current_background = "#E9B949"
find_match_current_foreground = "#111318"
word_highlight_background = "#E1EDF8"
word_highlight_strong_background = "#C8DFF3"
range_highlight_background = "#EEF3F8"
indent_guide = "#D7DAE0"
indent_guide_active = "#9BA2AD"
whitespace = "#C4C8CE"
cursor = "#111318"
cursor_secondary = "#59616D"
link = "#006FD6"

[gutter]
background = "#F8F9FA"
foreground = "#7A818C"
active_foreground = "#24272E"
border = "#D8DBE0"
line_number = "#7A818C"
line_number_active = "#24272E"
added = "#27864D"
modified = "#A56A00"
deleted = "#C43B48"

[terminal]
background = "#FFFFFF"
foreground = "#24272E"
cursor = "#111318"
cursor_text = "#FFFFFF"
selection_background = "#B8D7F5"
selection_foreground = "#111318"

[terminal_ansi]
black = "#24272E"
red = "#C43B48"
green = "#27864D"
yellow = "#9A6700"
blue = "#006FD6"
magenta = "#8E44AD"
cyan = "#007C91"
white = "#E5E7EB"
bright_black = "#68707C"
bright_red = "#E05260"
bright_green = "#3A9B60"
bright_yellow = "#B77B00"
bright_blue = "#2589E8"
bright_magenta = "#A45BC2"
bright_cyan = "#1695A8"
bright_white = "#FFFFFF"

[panel]
background = "#F4F5F7"
foreground = "#24272E"
border = "#CED2D8"
title_foreground = "#1B1E23"
title_background = "#EDEFF2"

[sidebar]
background = "#F3F4F6"
foreground = "#343840"
border = "#CED2D8"
section_background = "#E9EBEE"
section_foreground = "#24272E"
selection_background = "#C9E0F5"
selection_foreground = "#111318"
inactive_selection_background = "#E1E8EF"
hover_background = "#E8EDF2"

[statusbar]
background = "#E8EBEF"
foreground = "#343840"
border = "#C8CDD4"
active_background = "#D5E5F4"
active_foreground = "#111318"
warning_background = "#F5E2A8"
warning_foreground = "#5E4300"
error_background = "#F2C7CB"
error_foreground = "#751D27"

[tabs]
background = "#ECEEF1"
foreground = "#6B727D"
active_background = "#FFFFFF"
active_foreground = "#24272E"
active_border = "#006FD6"
inactive_background = "#ECEEF1"
inactive_foreground = "#747B86"
hover_background = "#E1E5EA"
border = "#C9CDD4"
dirty = "#A56A00"

[menu]
background = "#FFFFFF"
foreground = "#24272E"
border = "#BFC4CB"
selection_background = "#D5E8F8"
selection_foreground = "#111318"
separator = "#D4D8DE"
disabled = "#9298A1"

[input]
background = "#FFFFFF"
foreground = "#24272E"
border = "#B9BEC6"
focus_border = "#006FD6"
placeholder = "#858C96"
selection_background = "#B8D7F5"
selection_foreground = "#111318"

[button]
background = "#006FD6"
foreground = "#FFFFFF"
border = "#005EBA"
hover_background = "#005FBA"
active_background = "#004E9C"
disabled_background = "#D8DCE1"
disabled_foreground = "#858B94"

[scrollbar]
track = "#F3F4F6"
thumb = "#B8BDC5"
thumb_hover = "#989FA9"
thumb_active = "#7D858F"

[minimap]
background = "#F8F9FA"
foreground = "#A0A6AF"
selection = "#5C9DED60"
find_match = "#D39A1880"
error = "#C43B48"
warning = "#A56A00"

[diagnostics]
error = "#C43B48"
warning = "#946200"
information = "#006FD6"
hint = "#007C91"
unnecessary = "#858B94"
deprecated = "#87658F"

[diagnostics.background]
error = "#C43B4815"
warning = "#A56A0015"
information = "#006FD615"
hint = "#007C9115"

[diagnostics.underline]
error = "#C43B48"
warning = "#946200"
information = "#006FD6"
hint = "#007C91"

[diff]
added_background = "#DDF2E4"
added_foreground = "#176D39"
removed_background = "#F7DDDF"
removed_foreground = "#9C2934"
modified_background = "#F8EDCF"
modified_foreground = "#765000"
added_gutter = "#27864D"
removed_gutter = "#C43B48"
modified_gutter = "#A56A00"

[syntax]
foreground = "#24272E"
background = "#FFFFFF"

[syntax.comment]
foreground = "#6A737D"
italic = true

[syntax.documentation]
foreground = "#747D87"
italic = true

[syntax.keyword]
foreground = "#7B3FA1"

[syntax.control]
foreground = "#7B3FA1"

[syntax.declaration]
foreground = "#8A3D80"

[syntax.modifier]
foreground = "#934A8A"

[syntax.operator]
foreground = "#006C7A"

[syntax.punctuation]
foreground = "#555C66"

[syntax.string]
foreground = "#397A20"

[syntax.character]
foreground = "#397A20"

[syntax.escape]
foreground = "#B44C12"

[syntax.number]
foreground = "#B44C12"

[syntax.boolean]
foreground = "#B02A52"

[syntax.null]
foreground = "#B02A52"

[syntax.variable]
foreground = "#24272E"

[syntax.variable_builtin]
foreground = "#8A6500"

[syntax.parameter]
foreground = "#9A5A14"

[syntax.property]
foreground = "#075FA8"

[syntax.constant]
foreground = "#8A6500"

[syntax.function]
foreground = "#075FA8"

[syntax.method]
foreground = "#075FA8"

[syntax.type]
foreground = "#8A6500"

[syntax.class]
foreground = "#8A6500"

[syntax.struct]
foreground = "#8A6500"

[syntax.enum]
foreground = "#8A6500"

[syntax.interface]
foreground = "#397A20"

[syntax.trait]
foreground = "#397A20"

[syntax.namespace]
foreground = "#006C7A"

[syntax.module]
foreground = "#006C7A"

[syntax.attribute]
foreground = "#9A5A14"

[syntax.decorator]
foreground = "#9A5A14"

[syntax.macro]
foreground = "#7B3FA1"

[syntax.label]
foreground = "#006C7A"

[syntax.lifetime]
foreground = "#9A5A14"

[syntax.regex]
foreground = "#006C7A"

[syntax.reference]
foreground = "#075FA8"

[syntax.section]
foreground = "#006C7A"
bold = true

[syntax.key]
foreground = "#075FA8"

[syntax.color]
foreground = "#B44C12"

[syntax.duration]
foreground = "#B44C12"

[syntax.size]
foreground = "#B44C12"

[syntax.invalid]
foreground = "#FFFFFF"
background = "#B42332"

[token_style]
comment = "italic"
documentation = "italic"
keyword = "normal"
control = "normal"
declaration = "normal"
modifier = "normal"
operator = "normal"
string = "normal"
number = "normal"
function = "normal"
type = "normal"
section = "bold"

[semantic]
enabled = true

[semantic.variable]
foreground = "#24272E"

[semantic.variable.readonly]
foreground = "#8A6500"

[semantic.variable.static]
foreground = "#9A5A14"

[semantic.parameter]
foreground = "#9A5A14"

[semantic.property]
foreground = "#075FA8"

[semantic.function]
foreground = "#075FA8"

[semantic.function.async]
foreground = "#006C7A"

[semantic.method]
foreground = "#075FA8"

[semantic.type]
foreground = "#8A6500"

[semantic.type_parameter]
foreground = "#9A5A14"

[semantic.class]
foreground = "#8A6500"

[semantic.struct]
foreground = "#8A6500"

[semantic.enum]
foreground = "#8A6500"

[semantic.enum_member]
foreground = "#B44C12"

[semantic.interface]
foreground = "#397A20"

[semantic.namespace]
foreground = "#006C7A"

[semantic.macro]
foreground = "#7B3FA1"

[semantic.keyword]
foreground = "#7B3FA1"

[semantic.operator]
foreground = "#006C7A"

[semantic.string]
foreground = "#397A20"

[semantic.number]
foreground = "#B44C12"

[semantic.comment]
foreground = "#6A737D"

[semantic_modifiers]
declaration = "normal"
definition = "normal"
readonly = "normal"
static = "normal"
deprecated = "strikethrough"
abstract = "italic"
async = "italic"
modification = "normal"
documentation = "italic"
default_library = "normal"

[font]
family = "monospace"
size = 14
weight = "normal"
line_height = 1.4
ligatures = true

[font.editor]
family = "monospace"
size = 14
weight = "normal"
ligatures = true

[font.terminal]
family = "monospace"
size = 13
weight = "normal"
ligatures = false

[link]
foreground = "#006FD6"
active_foreground = "#004F9E"
visited_foreground = "#70458A"
underline = true

[notification]
background = "#FFFFFF"
foreground = "#24272E"
border = "#BFC4CB"

[notification.info]
accent = "#006FD6"

[notification.warning]
accent = "#946200"

[notification.error]
accent = "#C43B48"

[notification.success]
accent = "#27864D"

[accessibility]
minimum_contrast = 4.5
focus_indicator = "#006FD6"
high_visibility_cursor = true
underline_links = true

[custom]
accent_primary = "#006FD6"
accent_secondary = "#7B3FA1"
accent_success = "#27864D"
accent_warning = "#946200"
accent_error = "#C43B48"

[rules]
required_path = [
  "theme.id",
  "theme.name",
  "theme.type",
  "editor.background",
  "editor.foreground",
  "syntax.foreground"
]

when $theme.enabled == true {
  required_path += ["ui.background"]
}

when $semantic.enabled == true {
  required_path += ["semantic.variable.foreground"]
}